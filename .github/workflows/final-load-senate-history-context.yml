name: Final load Senate history context
on:
  push:
    paths:
      - '.github/workflows/final-load-senate-history-context.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Move Senate context script to final loader position
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="h=h.replace('</body>','</body>');document.open();"
          new="h=h.replace('</body>','<script src=\"/senate-history-context.js?v=20260911-1344\"><\\/script></body>');document.open();"
          if old not in s: raise SystemExit('final loader anchor not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name 'Will Election Polls Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Load Senate history context after all site patches'
          git push origin main
