name: Load split House and Senate homepage forecast
on:
  push:
    paths:
      - '.github/workflows/load-home-split-forecast.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load split forecast safely
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          src='home-split-forecast.js?v=20260909-1430'
          marker='document.open();document.write(h);document.close()'
          if src not in s:
              if s.count(marker)!=1:
                  raise SystemExit(f'expected one document.write marker, found {s.count(marker)}')
              inject="h=h.replace('</body>','<script src=\"/home-split-forecast.js?v=20260909-1430\"><\\/script></body>');"+marker
              s=s.replace(marker,inject,1)
          p.write_text(s)
      - name: Validate loader
        shell: python
        run: |
          from pathlib import Path
          s=Path('index.html').read_text()
          assert 'home-split-forecast.js?v=20260909-1430' in s
          assert '<script src="/home-split-forecast.js?v=20260909-1430"><\\/script>' in s
          assert "const files=['d0.txt','d1.txt','d2.txt','d3.txt','d4.txt','d5.txt','d6.txt','d7.txt','d8a.txt','d8b.txt','d9.txt']" in s
          assert 'document.open();document.write(h);document.close()' in s
      - name: Commit split homepage
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/load-home-split-forecast.yml
          git add index.html .github/workflows/load-home-split-forecast.yml
          git diff --cached --quiet || git commit -m "Split homepage House and Senate forecasts"
          git push
