name: Fix Homepage Senate Count 51-49

on:
  push:
    paths:
      - '.github/workflows/fix-homepage-senate-count-51-49.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Force homepage Senate count to 51-49 Democratic
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('site-ux-polish.js')
          s = p.read_text()
          s = s.replace("const card=root.querySelector('#homeForecastSplit .senate-card,.will-senate-card');if(!card)return;", "let card=root.querySelector('#homeForecastSplit .senate-card,.will-senate-card');if(!card)card=root;")
          old = "    }\n  }\n\n  function apply(){ensureStyle();reorderNav();electionCountdown();keepPartyLabels();fixGrahamText();fixKansasOdds();fixHomeSenateCount();}"
          new = "    }\n    const bar=card.querySelector('.senate-bar,.final-bar,.forecast-bar,.seat-bar');if(bar){const d=bar.querySelector('.dem,.democratic,[data-party=dem]'),r=bar.querySelector('.rep,.republican,[data-party=rep]');if(d)d.style.setProperty('width','51%','important');if(r)r.style.setProperty('width','49%','important');const y=bar.querySelector('.tossup,.toss-up,[data-tossup]');if(y){y.style.setProperty('width','0%','important');y.style.setProperty('display','none','important');}bar.setAttribute('aria-label','Senate prediction: 51 Democrats and 49 Republicans');}\n  }\n\n  function apply(){ensureStyle();reorderNav();electionCountdown();keepPartyLabels();fixGrahamText();fixKansasOdds();fixHomeSenateCount();}"
          if old in s:
              s = s.replace(old, new)
          p.write_text(s)
          idx = Path('index.html')
          h = idx.read_text()
          h = re.sub(r"site-ux-polish\.js\?v=[A-Za-z0-9._-]+", "site-ux-polish.js?v=20260916-2010", h)
          idx.write_text(h)
          PY
      - name: Commit homepage count fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-homepage-senate-count-51-49.yml
          git add site-ux-polish.js index.html
          git commit -m 'Set homepage Senate count to 51-49 Democratic' || exit 0
          git push