name: Fix Homepage Senate Count 51-49

on:
  push:
    paths:
      - '.github/workflows/fix-homepage-senate-count-51-49.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Force homepage Senate count to 51-49 Democratic
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('site-ux-polish.js')
          s = p.read_text()
          needle = "  function apply(){"
          fn = """  function fixHomepageCountHard(){
    const root=document.getElementById('page-home');if(!root)return;
    let card=root.querySelector('#homeForecastSplit .senate-card,.will-senate-card');
    if(!card){
      const title=leafs(root).find(el=>/^(Will[’']s|2026) Senate Prediction$/i.test(norm(el.textContent)));
      if(title){
        card=title.parentElement;
        for(let i=0;card&&card!==root&&i<8;i++,card=card.parentElement){
          const t=norm(card.textContent);
          if(/Democrat/i.test(t)&&/Republican/i.test(t))break;
        }
      }
    }
    if(!card||card===root)return;
    const demBlock=[...card.querySelectorAll('*')].find(el=>/Democrat/i.test(norm(el.textContent))&&el.querySelector?.('.party-number,.final-party-number,strong'));
    const repBlock=[...card.querySelectorAll('*')].find(el=>/Republican/i.test(norm(el.textContent))&&el.querySelector?.('.party-number,.final-party-number,strong'));
    const setBlock=(block,val)=>{if(!block)return;const n=block.querySelector('.party-number,.final-party-number,strong');if(n)n.textContent=val;};
    setBlock(demBlock,'51');setBlock(repBlock,'49');
    const nums=[...card.querySelectorAll('.party-number,.final-party-number')];
    if(nums[0])nums[0].textContent='51';if(nums[1])nums[1].textContent='49';
    for(const el of leafs(card)){
      const t=norm(el.textContent);
      if(/^Democrats?\s*:?\s*\d+$/i.test(t))el.textContent=t.replace(/\d+$/,'51');
      if(/^Republicans?\s*:?\s*\d+$/i.test(t))el.textContent=t.replace(/\d+$/,'49');
      if(/^\d+\s+seats$/i.test(t)){
        const pt=norm(el.parentElement?.textContent);
        if(/Democrat/i.test(pt))el.textContent='51 seats';
        if(/Republican/i.test(pt))el.textContent='49 seats';
      }
    }
    const bar=card.querySelector('.senate-bar,.final-bar,.forecast-bar,.seat-bar');
    if(bar){
      const d=bar.querySelector('.dem,.democratic,[data-party=dem]');
      const r=bar.querySelector('.rep,.republican,[data-party=rep]');
      if(d)d.style.setProperty('width','51%','important');
      if(r)r.style.setProperty('width','49%','important');
      const y=bar.querySelector('.tossup,.toss-up,[data-tossup]');
      if(y){y.style.setProperty('width','0%','important');y.style.setProperty('display','none','important');}
      bar.setAttribute('aria-label','Senate prediction: 51 Democrats and 49 Republicans');
    }
  }

"""
          if 'function fixHomepageCountHard()' not in s:
              s = s.replace(needle, fn + needle)
          s = s.replace('fixHomeSenateCount();}', 'fixHomeSenateCount();fixHomepageCountHard();}')
          p.write_text(s)

          idx = Path('index.html')
          h = idx.read_text()
          h = re.sub(r"site-ux-polish\.js\?v=[A-Za-z0-9._-]+", "site-ux-polish.js?v=20260916-2005", h)
          idx.write_text(h)
          PY
      - name: Commit homepage count fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-homepage-senate-count-51-49.yml
          git add site-ux-polish.js index.html
          git commit -m 'Set homepage Senate count to 51-49 Democratic' || exit 0
          git push
