name: Safely reposition homepage methodology note

on:
  push:
    paths:
      - '.github/workflows/reposition-home-note-safe.yml'

permissions:
  contents: write

jobs:
  reposition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move note outside hero
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = 'heroIntro.insertAdjacentElement("afterend",note)'
          new = 'document.querySelector("#page-home .reference-hero")?.insertAdjacentElement("afterend",note)'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one old insertion point, found {s.count(old)}')
          updated = s.replace(old, new, 1)
          if len(updated) < len(s) - 200 or len(updated) > len(s) + 200:
              raise SystemExit('Unexpected file size change')
          p.write_text(updated)
      - name: Validate loader JavaScript
        shell: python
        run: |
          from pathlib import Path
          s = Path('index.html').read_text()
          start = s.find('<script>')
          end = s.rfind('</script>')
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('Outer script not found')
          Path('/tmp/loader.js').write_text(s[start+8:end])
      - run: node --check /tmp/loader.js
      - name: Commit index.html only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Place methodology note between hero and stats"
          git push
