# trigger cache bump
name: Bump seat balance cache
on:
  push:
    paths:
      - '.github/workflows/bump-seat-cache-v2.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump final UI script cache
        run: |
          python -c "from pathlib import Path; import re; p=Path('index.html'); s=p.read_text(); s=re.sub(r'site-ux-polish\.js\?v=[0-9-]+','site-ux-polish.js?v=20260915-2205',s); p.write_text(s)"
      - name: Commit cache bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Bump final Senate balance cache"
          git push
