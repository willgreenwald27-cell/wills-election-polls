name: Adjust map size and restore home polling banner
on:
  push:
    paths:
      - '.github/workflows/adjust-map-size-home-box.yml'
permissions:
  contents: write
jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted layout fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ip = Path('index.html')
          s = ip.read_text()

          replacements = [
            ('max-height:calc(100vh - 320px)!important', 'max-height:calc(100vh - 260px)!important'),
            ('max-height:calc(100vh - 310px)!important', 'max-height:calc(100vh - 250px)!important'),
          ]
          for old, new in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f'Expected exactly one index match for {old!r}, found {s.count(old)}')
              s = s.replace(old, new, 1)

          marker = '/*home-hero-past-polling-removed*/'
          if s.count(marker) != 1:
              raise SystemExit(f'Expected one home marker, found {s.count(marker)}')
          banner = '''/*home-hero-past-polling-removed*/const homeShell=document.querySelector("#page-home .reference-home-shell");if(homeShell&&!document.getElementById("homePastPollingMisses")){const box=document.createElement("button");box.id="homePastPollingMisses";box.type="button";box.style.cssText="width:100%;margin:24px 0 8px;padding:23px 26px;background:#0c1829;color:#fff;border:0;border-radius:14px;text-align:left;cursor:pointer;display:block;box-shadow:0 8px 22px rgba(12,24,41,.15)";box.innerHTML=`<span style="display:block;font-size:10px;font-weight:900;letter-spacing:1.5px;color:#9fb0c6;margin-bottom:7px">PAST POLLING MISSES</span><strong style="display:block;font-family:Georgia,serif;font-size:25px;line-height:1.15;color:#fff;margin-bottom:7px">See where polling has missed in the past</strong><span style="display:block;font-size:12px;font-weight:800;color:#d7e0eb">Explore past polling errors →</span>`;box.addEventListener("click",()=>showPage("errors"));homeShell.appendChild(box)}/*home-bottom-polling-banner-v1*/'''
          s = s.replace(marker, banner, 1)
          ip.write_text(s)

          gp = Path('governor.html')
          g = gp.read_text()
          old = 'grid-template-rows:repeat(7,44px)'
          new = 'grid-template-rows:repeat(7,48px)'
          if g.count(old) != 1:
              raise SystemExit(f'Expected exactly one governor row-size match, found {g.count(old)}')
          g = g.replace(old, new, 1)
          gp.write_text(g)
          PY
      - name: Commit layout fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html governor.html
          git commit -m 'Balance desktop map sizes and restore home polling banner'
          git push