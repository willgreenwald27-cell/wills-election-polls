name: Fix desktop map fits
on:
  push:
    paths:
      - '.github/workflows/fix-desktop-map-fits.yml'
permissions:
  contents: write
jobs:
  fix-maps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply precise map fit fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Main site: restore original Senate ratings/calls for TX, ME, MI,
          # and fit Senate + Betting maps vertically on desktop.
          p = Path('index.html')
          s = p.read_text()

          replacements = [
            (
              '#page-senate .map-wrap{padding:4px 8px!important}#page-senate .map-wrap svg{display:block!important;width:min(100%,1320px)!important;max-width:1320px!important;height:auto!important;margin:0 auto!important}/*senate-desktop-fit-v1*/',
              '#page-senate .map-wrap{padding:2px 8px!important;display:flex!important;justify-content:center!important;align-items:flex-start!important;overflow:visible!important}#page-senate .map-wrap svg{display:block!important;width:auto!important;max-width:100%!important;height:auto!important;max-height:calc(100vh - 320px)!important;margin:0 auto!important}/*senate-desktop-fit-v2*/'
            ),
            (
              '#page-betting .kalshi-map-wrap{width:100%!important;max-width:100%!important}#page-betting .kalshi-map-wrap svg{width:100%!important;max-width:100%!important;height:auto!important}',
              '#page-betting .kalshi-map-wrap{width:100%!important;max-width:100%!important;display:flex!important;justify-content:center!important;align-items:flex-start!important;overflow:visible!important}#page-betting .kalshi-map-wrap svg{display:block!important;width:auto!important;max-width:100%!important;height:auto!important;max-height:calc(100vh - 310px)!important;margin:0 auto!important}'
            ),
            (
              "function renderSenate(){\\n  applyPaletteCSS();\\n  if(stateData.NH&&stateData.NH.active)stateData.NH.rating='tilt-d';\\n  for(const ab of ['TX','ME','MI'])if(stateData[ab]&&stateData[ab].active){stateData[ab].rating='tossup';stateData[ab].prediction='Tossup';}",
              "function renderSenate(){\\n  applyPaletteCSS();\\n  if(stateData.NH&&stateData.NH.active)stateData.NH.rating='tilt-d';"
            ),
            (
              "const marginLabel=statePollMarginLabel(s);const callOverride={AK:'Peltola +1.1%',GA:'Ossoff +8.1%',NC:'Cooper +7.9%',OH:'Husted +0.9%',NH:'Pappas +5.6%',ME:'Tossup',MI:'Tossup',TX:'Tossup'}[s.abbr];",
              "const marginLabel=statePollMarginLabel(s);const callOverride={AK:'Peltola +1.1%',GA:'Ossoff +8.1%',NC:'Cooper +7.9%',OH:'Husted +0.9%',NH:'Pappas +5.6%',ME:'Jackson +0.4%',TX:'Paxton +0.3%'}[s.abbr];"
            ),
          ]

          for old, new in replacements:
            count = s.count(old)
            if count != 1:
              raise SystemExit(f'index.html safety check failed: expected 1 match, found {count} for {old[:80]!r}')
            s = s.replace(old, new, 1)
          p.write_text(s)

          # Governor page: compact the desktop header/map so the full map is visible sooner.
          g = Path('governor.html')
          t = g.read_text()
          anchor = '@media(max-width:1000px){.poll-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}'
          desktop = '@media(min-width:900px){.page-head{padding:10px 24px 8px}.page-head h1{font-size:30px;margin:2px 0 4px}.page-head p{font-size:12px}.balance{margin-top:8px;padding:9px 16px}.seat{padding:7px 12px}.seat b{font-size:23px}.content{padding-bottom:26px}.map-card{padding:10px}.map-top{margin-bottom:7px}.map-wrap{padding:9px;overflow:visible}.tile-map{grid-template-rows:repeat(7,44px);gap:5px}.source{margin-top:6px}}'
          if desktop in t:
            raise SystemExit('Governor desktop compact CSS already present; refusing duplicate insertion')
          if t.count(anchor) != 1:
            raise SystemExit(f'governor.html safety check failed: expected 1 anchor, found {t.count(anchor)}')
          t = t.replace(anchor, desktop + anchor, 1)
          g.write_text(t)
          PY

      - name: Validate browser JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for filename in ['index.html','governor.html']:
            text=Path(filename).read_text()
            scripts=re.findall(r'<script>(.*?)</script>', text, flags=re.S)
            if not scripts:
              raise SystemExit(f'No script found in {filename}')
            for i,code in enumerate(scripts):
              Path(f'/tmp/{filename}.{i}.js').write_text(code)
          PY
          for f in /tmp/index.html.*.js /tmp/governor.html.*.js; do node --check "$f"; done

      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html governor.html
          git commit -m 'Fit desktop maps and restore Senate ratings'
          git push