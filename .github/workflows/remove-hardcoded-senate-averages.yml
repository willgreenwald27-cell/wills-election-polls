name: Make archive Senate averages authoritative
on:
  push:
    paths:
      - '.github/workflows/remove-hardcoded-senate-averages.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove stale hard-coded polling averages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('sep9-polls-update.js')
          s=p.read_text()
          start=s.index('  function applyAverages(){')
          end=s.index('\n  function ensureNativePolls(){', start)
          block=s[start:end]
          block2=re.sub(r"^\s*changed=setCandidatePoll\([^\n]*\)\|\|changed;\n",'',block,flags=re.M)
          if block2==block:
              raise SystemExit('no hardcoded averages found')
          if 'setCandidatePoll(' in block2:
              raise SystemExit('hardcoded average remained in applyAverages')
          s=s[:start]+block2+s[end:]
          p.write_text(s)

          p=Path('index.html')
          s=p.read_text()
          s=re.sub(r'/sep9-polls-update\.js\?v=[^"<]+','/sep9-polls-update.js?v=20260911-0028',s)
          s=re.sub(r'/senate-auto-averages\.js\?v=[^"<]+','/senate-auto-averages.js?v=20260911-0028',s)
          p.write_text(s)
          PY
          node --check sep9-polls-update.js
          node --check senate-auto-averages.js
          grep -q 'changed=applyForecastCalls()||changed;' sep9-polls-update.js
          ! sed -n '/function applyAverages(){/,/function ensureNativePolls(){/p' sep9-polls-update.js | grep -q 'setCandidatePoll('
          grep -q 'senate-auto-averages.js?v=20260911-0028' index.html
          grep -q 'sep9-polls-update.js?v=20260911-0028' index.html
      - name: Commit production update
        shell: bash
        run: |
          git config user.name 'Will Election Polls Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add sep9-polls-update.js index.html
          git commit -m 'Make archive-driven Senate averages authoritative'
          git push
