name: Finalize Ohio tossup renderer
on:
  push:
    paths:
      - '.github/workflows/finalize-ohio-tossup.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove stale Ohio Republican call override
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = "OH:'Husted +0.9%'"
          new = "OH:'Tossup'"
          if old not in s:
              raise SystemExit('stale Ohio override not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git config user.name 'Will Election Polls Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Remove stale Ohio Republican call override'
          git push origin main
