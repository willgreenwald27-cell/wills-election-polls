name: Sync live Kalshi Senate odds
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/kalshi-live-sync.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch live Senate markets and safely connect the site
        run: |
          python - <<'PY'
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import datetime, timezone
          import json, re, urllib.request, urllib.error

          states = ['AL','AK','AR','CO','DE','FL','GA','ID','IL','IA','KS','KY','LA','ME','MA','MI','MN','MS','MT','NE','NH','NJ','NM','NC','OH','OK','OR','RI','SC','SD','TN','TX','VA','WV','WY']
          base = 'https://external-api.kalshi.com/trade-api/v2'

          def fetch_state(ab):
              url = f'{base}/events/SENATE{ab}-26?with_nested_markets=true'
              req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      data = json.load(r)
                  markets = (data.get('event') or {}).get('markets') or data.get('markets') or []
                  keep = []
                  for m in markets:
                      ticker = str(m.get('ticker') or '')
                      if not re.fullmatch(rf'SENATE{ab}-26-[DRI]', ticker):
                          continue
                      keep.append({
                          'ticker': ticker,
                          'yes_sub_title': m.get('yes_sub_title'),
                          'last_price_dollars': m.get('last_price_dollars'),
                          'yes_bid_dollars': m.get('yes_bid_dollars'),
                          'yes_ask_dollars': m.get('yes_ask_dollars'),
                          'updated_time': m.get('updated_time')
                      })
                  return ab, keep, None
              except Exception as e:
                  return ab, [], f'{type(e).__name__}: {e}'

          all_markets = []
          errors = {}
          with ThreadPoolExecutor(max_workers=10) as ex:
              futures = [ex.submit(fetch_state, ab) for ab in states]
              for fut in as_completed(futures):
                  ab, markets, err = fut.result()
                  all_markets.extend(markets)
                  if err:
                      errors[ab] = err

          all_markets.sort(key=lambda m: m['ticker'])
          payload = {
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'source': 'Kalshi public Trade API',
              'markets': all_markets,
              'errors': errors
          }
          Path('kalshi-live.json').write_text(json.dumps(payload, separators=(',',':')) + '\n')

          p = Path('index.html')
          s = p.read_text()
          old = "fetch('https://external-api.kalshi.com/trade-api/v2/markets?limit=1000&status=open',{cache:'no-store'})"
          new = "fetch('kalshi-live.json?ts='+Date.now(),{cache:'no-store'})"
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('Could not find the expected Kalshi fetch expression; refusing to edit index.html')
          s = s.replace('Live Kalshi market data · refreshes every 30 seconds','Live Kalshi market data · auto-updates every few minutes')
          p.write_text(s)

          if not all_markets:
              raise SystemExit('Kalshi returned no Senate markets; refusing to publish an empty live feed')
          print(f'Fetched {len(all_markets)} Senate markets across {len(states)-len(errors)} states; errors={errors}')
          PY
      - name: Commit only when odds or connection change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html kalshi-live.json
          if git diff --cached --quiet; then
            echo 'No Kalshi changes to commit.'
          else
            git commit -m 'Auto-sync live Kalshi Senate odds'
            git push
          fi
