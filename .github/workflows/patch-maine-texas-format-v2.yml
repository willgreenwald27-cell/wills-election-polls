name: Match Maine popup to Texas
on:
  push:
    paths:
      - '.github/workflows/patch-maine-texas-format-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply Maine popup patch
        run: python patch-maine-texas-format-v2.py
      - name: Validate JavaScript
        run: |
          node --check site-layout-polish.js
          node --check senate-current-sync.js
          grep -q 'WHY MY FORECAST DIFFERS' site-layout-polish.js
          grep -q "textContent='Republican'" senate-current-sync.js
          grep -q 'site-layout-polish.js?v=20260910-1946' index.html
      - name: Commit production changes and clean helper files
        run: |
          git config user.name 'Will Election Polls Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add site-layout-polish.js senate-current-sync.js index.html
          git rm patch-maine-texas-format-v2.py .github/workflows/patch-maine-texas-format-v2.yml
          git commit -m 'Match Maine popup to Texas format'
          git push origin main
