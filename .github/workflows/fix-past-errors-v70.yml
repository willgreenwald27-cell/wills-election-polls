name: Fix Past Polling Errors copy and 2026 scope
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-past-errors-v70.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch Past Polling Errors only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('senate-error-history.js')
          s=p.read_text()
          helper="  const statusClass=s=>String(s||'').toUpperCase()==='HIT'?'hit':String(s||'').toUpperCase()==='MISS'?'miss':'nopoll';\n"
          if 'const isCycleState=' not in s:
              s=s.replace(helper, helper+"  const isCycleState=r=>{const t=data?.targetStates||[];return !t.length||t.includes(String(r?.state||''));};\n", 1)
          s=s.replace("const scored=(data?.records||[]).filter(r=>r.pollCount&&num(r.pollMargin)!==null&&num(r.actualMargin)!==null);", "const scored=(data?.records||[]).filter(r=>isCycleState(r)&&r.pollCount&&num(r.pollMargin)!==null&&num(r.actualMargin)!==null);")
          s=s.replace(".filter(r=>r.swing2026&&r.pollCount&&num(r.pollMargin)!==null&&num(r.actualMargin)!==null)", ".filter(r=>isCycleState(r)&&r.swing2026&&r.pollCount&&num(r.pollMargin)!==null&&num(r.actualMargin)!==null)")
          s=s.replace(".filter(z=>z.r.pollCount&&z.g!==null).sort((a,b)=>Math.abs(b.g)-Math.abs(a.g));", ".filter(z=>isCycleState(z.r)&&z.r.pollCount&&z.g!==null).sort((a,b)=>Math.abs(b.g)-Math.abs(a.g));")
          s=s.replace(".filter(({r})=>(!s||r.state===s)&&(!st||r.status===st)&&(!q||JSON.stringify(r).toLowerCase().includes(q)));", ".filter(({r})=>isCycleState(r)&&(!s||r.state===s)&&(!st||r.status===st)&&(!q||JSON.stringify(r).toLowerCase().includes(q)));")
          old="const st=data.stats||{}, ex=heroExample(), states=[...new Set(data.records.map(r=>r.state))].sort((a,b)=>{const an=data.records.find(r=>r.state===a)?.stateName||a,bn=data.records.find(r=>r.state===b)?.stateName||b;return an.localeCompare(bn)});"
          new="const cycleRecords=(data.records||[]).filter(isCycleState);\n    const st=data.stats||{}, ex=heroExample(), states=[...new Set(cycleRecords.map(r=>r.state))].sort((a,b)=>{const an=cycleRecords.find(r=>r.state===a)?.stateName||a,bn=cycleRecords.find(r=>r.state===b)?.stateName||b;return an.localeCompare(bn)});"
          s=s.replace(old,new)
          s=s.replace("const avg=one(st.avgAbsError), threshold=one(st.hitThreshold||3), wrong=st.wrongWinner??data.records.filter(r=>r.wrongWinner).length;", "const scoredCycle=cycleRecords.filter(r=>r.pollCount&&absError(r)!==null), missCycle=scoredCycle.filter(r=>String(r.status).toUpperCase()==='MISS');\n    const avg=one(scoredCycle.length?scoredCycle.reduce((sum,r)=>sum+absError(r),0)/scoredCycle.length:st.avgAbsError), threshold=one(st.hitThreshold||3), wrong=cycleRecords.filter(r=>r.wrongWinner).length;")
          s=s.replace("String(st.states??35)", "String(states.length)")
          s=s.replace("String(st.misses??'—')", "String(missCycle.length)")
          replacements={
            'the <em>polls moved.</em>':'the <em>polls missed.</em>',
            '<span>Margin moved</span>':'<span>Polls missed</span>',
            '<h3>How the margin changed</h3>':'<h3>How far did the polls miss?</h3>',
            'Margin movement = actual D–R margin minus polled D–R margin.':'Margin miss = actual D–R margin minus polled D–R margin.',
            'ranked by absolute margin movement':'ranked by absolute polling miss',
            'Historical polling movement for the states currently grouped as 2026 Senate battlegrounds. These are the largest prior margin shifts in that group;':'Historical polling misses for the states currently grouped as 2026 Senate battlegrounds. These are the largest prior polling misses in that group;'
          }
          for a,b in replacements.items(): s=s.replace(a,b)
          p.write_text(s)
          PY
          node --check senate-error-history.js
          if grep -E "polls moved|Margin moved|margin movement|How the margin changed|Historical polling movement|margin shifts" senate-error-history.js; then exit 1; fi
      - name: Commit fix
        run: |
          git config user.name 'Will Election Polls Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add senate-error-history.js
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Past Polling Errors wording and 2026 archive scope'
          git push origin main
