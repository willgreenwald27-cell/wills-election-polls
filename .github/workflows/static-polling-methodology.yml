name: Apply navigation, Kalshi, and About refinements

on:
  push:
    paths:
      - '.github/workflows/static-polling-methodology.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update site source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, re

          names=['d0.txt','d1.txt','d2.txt','d3.txt','d4.txt','d5.txt','d6.txt','d7.txt','d8a.txt','d8b.txt','d9.txt']
          html=gzip.decompress(base64.b64decode(''.join(Path(n).read_text().strip() for n in names))).decode('utf-8')

          # Keep internal pages in the SPA and make direct ?page= links restore correctly.
          show_start=html.find('function showPage(name){')
          if show_start < 0:
              raise SystemExit('showPage not found')
          marker="window.scrollTo({top:0,behavior:'instant'});"
          pos=html.find(marker, show_start)
          if pos < 0:
              raise SystemExit('showPage marker not found')
          route="window.scrollTo({top:0,behavior:'instant'});try{const u=name==='home'?location.pathname:location.pathname+'?page='+encodeURIComponent(name);history.replaceState(null,'',u)}catch(e){}"
          if "history.replaceState(null,'',u)" not in html[show_start:show_start+1800]:
              html=html[:pos]+route+html[pos+len(marker):]

          def button_type(m):
              attrs=m.group(1)
              if re.search(r'\btype\s*=', attrs, re.I):
                  return '<button'+attrs+'>'
              return '<button type="button"'+attrs+'>'
          html=re.sub(r'<button([^>]*\bdata-page-link="[^"]+"[^>]*)>', button_type, html)

          html=re.sub(r'<script id="page-route-restore">.*?</script>', '', html, flags=re.S)
          route_script="<script id=\"page-route-restore\">(()=>{try{const p=new URLSearchParams(location.search).get('page');if(p&&['home','senate','polls','betting','errors','about'].includes(p)&&document.getElementById('page-'+p)&&typeof showPage==='function')showPage(p)}catch(e){}})();</script>"
          html=html.replace('</body>', route_script+'</body>', 1)

          # Permanent live Kalshi heading.
          if '<h1>Kalshi Senate Odds</h1>' in html:
              html=html.replace('<h1>Kalshi Senate Odds</h1>', '<h1 class="live-kalshi-title"><span class="live-kalshi-dot" aria-hidden="true"></span>Live Kalshi Senate Odds</h1>', 1)
          elif 'Live Kalshi Senate Odds' not in html:
              raise SystemExit('Kalshi title not found')

          html=re.sub(r'<style id="static-live-kalshi-style">.*?</style>', '', html, flags=re.S)
          live_css='<style id="static-live-kalshi-style">.live-kalshi-title{display:flex;align-items:center}.live-kalshi-dot{display:inline-block;width:10px;height:10px;flex:0 0 10px;border-radius:50%;background:#e32636;margin-right:9px;animation:kalshiPulseStatic 1.15s ease-in-out infinite}@keyframes kalshiPulseStatic{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(227,38,54,.42)}50%{opacity:.32;box-shadow:0 0 0 6px rgba(227,38,54,0)}}</style>'
          html=html.replace('</head>', live_css+'</head>', 1)

          # School card on About Me.
          html=re.sub(r'<section id="aboutSchool".*?</section>', '', html, flags=re.S)
          about=html.find('<section class="page" id="page-about">')
          strip=html.find('<section class="about-stat-strip"', about)
          if about < 0 or strip < 0:
              raise SystemExit('About page insertion point not found')
          end=html.find('</section>', strip)
          if end < 0:
              raise SystemExit('About stat strip close not found')
          end += len('</section>')
          school='''
<section id="aboutSchool" aria-label="School" style="margin:14px 0 18px;padding:16px 18px;border:1px solid #d9dee7;border-radius:16px;background:#fff;display:flex;align-items:center;gap:18px;box-shadow:0 7px 22px rgba(20,34,53,.055)">
  <div style="width:86px;height:72px;flex:0 0 86px;display:flex;align-items:center;justify-content:center;background:#f7f8fa;border-radius:13px;border:1px solid #e4e8ee">
    <svg viewBox="0 0 120 120" width="70" height="70" role="img" aria-label="Redwood High School redwood tree logo">
      <text x="7" y="99" font-family="Georgia,serif" font-size="96" font-weight="900" fill="#d92732" stroke="#17263d" stroke-width="2.2" paint-order="stroke">R</text>
      <path d="M61 11 51 29h7L45 45h10L41 63h12L37 84h18v23h12V84h18L69 63h12L67 45h9L64 29h7Z" fill="#177548" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
    </svg>
  </div>
  <div style="min-width:0">
    <div style="font-size:9px;font-weight:950;letter-spacing:1.4px;color:#d92732;text-transform:uppercase;margin-bottom:4px">School</div>
    <h3 style="margin:0;font-family:Georgia,serif;font-size:21px;line-height:1.15;color:#17263d">Redwood High School</h3>
    <p style="margin:5px 0 0;font-size:12px;line-height:1.45;color:#66758a">Larkspur, California</p>
  </div>
</section>'''
          html=html[:end]+school+html[end:]

          # Repack source chunks.
          encoded=base64.b64encode(gzip.compress(html.encode('utf-8'),mtime=0)).decode('ascii')
          q,r=divmod(len(encoded),len(names))
          at=0
          for i,n in enumerate(names):
              size=q+(1 if i<r else 0)
              Path(n).write_text(encoded[at:at+size])
              at += size
          if at != len(encoded):
              raise SystemExit('chunk split failed')

          rebuilt=gzip.decompress(base64.b64decode(''.join(Path(n).read_text().strip() for n in names))).decode('utf-8')
          for needle in ['id="page-route-restore"','Live Kalshi Senate Odds','id="aboutSchool"','Redwood High School','Larkspur, California',"history.replaceState(null,'',u)"]:
              if needle not in rebuilt:
                  raise SystemExit('Missing after rebuild: '+needle)
          print('All requested changes verified in rebuilt source.')
          PY
      - name: Validate page JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,gzip,re
          names=['d0.txt','d1.txt','d2.txt','d3.txt','d4.txt','d5.txt','d6.txt','d7.txt','d8a.txt','d8b.txt','d9.txt']
          html=gzip.decompress(base64.b64decode(''.join(Path(n).read_text().strip() for n in names))).decode('utf-8')
          for i,s in enumerate(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S)):
              Path('/tmp/script-%d.js'%i).write_text(s)
          PY
          for f in /tmp/script-*.js; do node --check "$f"; done
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add d0.txt d1.txt d2.txt d3.txt d4.txt d5.txt d6.txt d7.txt d8a.txt d8b.txt d9.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Fix page routing and refresh About and Kalshi UI'
          git push
