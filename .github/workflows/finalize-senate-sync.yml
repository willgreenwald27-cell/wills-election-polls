name: Finalize Senate map and polling sync
on:
  push:
    paths:
      - 'tools/finalize-senate-sync.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply audited Senate sync
        run: |
          python tools/finalize-senate-sync.py
          node --check senate-julsep-archive.js
          node --check sep9-polls-update.js
          node --check sep10-polls-update.js
          node --check senate-color-polish.js
          node --check sept9-final-ui.js
          node --check senate-error-history.js
          node --check site-final.js
          node --check senate-current-sync.js
      - name: Commit production fixes and clean audit helpers
        run: |
          git config user.name 'Will Election Polls Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f tools/finalize-senate-sync.py .github/workflows/finalize-senate-sync.yml .github/workflows/audit-site-poll-averages.yml poll-average-audit.json poll-average-summary.csv
          git add index.html senate-julsep-archive.js sep9-polls-update.js sep10-polls-update.js senate-color-polish.js sept9-final-ui.js senate-error-history.js site-final.js senate-current-sync.js senate-state-summary.csv
          git commit -m 'Sync Senate polling averages and 51-49 forecast'
          git push origin main
