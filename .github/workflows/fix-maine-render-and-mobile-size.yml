name: Fix Maine render and mobile map size
on:
  push:
    paths:
      - '.github/workflows/fix-maine-render-and-mobile-size.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Neutralize the mobile-only enlargement without touching the normal map layout.
          p=Path('senate-julsep-archive.js')
          s=p.read_text()
          if 'scale(1.32)' not in s:
              raise SystemExit('1.32 mobile map rule not found')
          s=s.replace("st.textContent=`@media(max-width:760px){#page-senate .map-wrap{overflow:visible!important}#page-senate .map-wrap svg{transform:scale(1.32)!important;transform-origin:center center!important;max-width:none!important}}`;","st.textContent='';",1)
          p.write_text(s)

          # Make the underlying Senate renderer itself treat Maine as Tilt Democratic.
          p=Path('index.html')
          i=p.read_text()
          old="if(stateData.NH&&stateData.NH.active)stateData.NH.rating='tilt-d';if(stateData.ME&&stateData.ME.active)stateData.ME.rating='tilt-r';"
          new="if(stateData.NH&&stateData.NH.active)stateData.NH.rating='tilt-d';if(stateData.ME&&stateData.ME.active)stateData.ME.rating='tilt-d';"
          if old not in i:
              raise SystemExit('Maine render override anchor not found')
          i=i.replace(old,new,1)
          i=i.replace("ME:'Collins +1.3%'","ME:'Jackson +0.4%'")
          i=re.sub(r'senate-julsep-archive\.js\?v=[0-9-]+','senate-julsep-archive.js?v=20260908-1318',i)
          p.write_text(i)

          assert 'scale(1.32)' not in Path('senate-julsep-archive.js').read_text()
          out=Path('index.html').read_text()
          assert "stateData.ME.active)stateData.ME.rating='tilt-d'" in out
          assert "ME:'Jackson +0.4%'" in out
          assert 'senate-julsep-archive.js?v=20260908-1318' in out
          PY
      - name: Commit site update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/fix-maine-render-and-mobile-size.yml
          git add index.html senate-julsep-archive.js .github/workflows/fix-maine-render-and-mobile-size.yml
          git commit -m "Fix Maine map render and restore mobile map size"
          git push
