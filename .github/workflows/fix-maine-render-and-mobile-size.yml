name: Fix Maine render and mobile map size
on:
  push:
    paths:
      - '.github/workflows/fix-maine-render-and-mobile-size.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Remove the mobile-only map enlargement that was added for the previous request.
          p = Path('senate-julsep-archive.js')
          s = p.read_text()
          s = re.sub(r"\n\s*function ensureMobileSenateMapSize\(\)\{.*?\n\s*\}\n\n\s*function apply\(\)\{applyMaineCall\(\);applyMinnesotaAverage\(\);ensureSep7MinnesotaPoll\(\);ensureMobileSenateMapSize\(\);fixMaineVisibleDetail\(\);ensurePollArchive\(\);\}",
                     "\n\n  function apply(){applyMaineCall();applyMinnesotaAverage();ensureSep7MinnesotaPoll();fixMaineVisibleDetail();ensurePollArchive();}",
                     s, flags=re.S)
          if 'scale(1.32)' in s or 'ensureMobileSenateMapSize' in s:
              raise SystemExit('mobile map enlargement still present')
          p.write_text(s)

          # Fix the source renderer itself so Maine is drawn Tilt Democratic instead of
          # being painted Republican first and then patched afterward.
          p = Path('index.html')
          i = p.read_text()
          old = "if(stateData.NH&&stateData.NH.active)stateData.NH.rating='tilt-d';if(stateData.ME&&stateData.ME.active)stateData.ME.rating='tilt-r';"
          new = "if(stateData.NH&&stateData.NH.active)stateData.NH.rating='tilt-d';if(stateData.ME&&stateData.ME.active)stateData.ME.rating='tilt-d';"
          if old not in i:
              raise SystemExit('Maine render override anchor not found')
          i = i.replace(old, new, 1)
          i = i.replace("ME:'Collins +1.3%'", "ME:'Jackson +0.4%'")
          # Fresh archive URL so phones cannot retain the old 1.32x CSS.
          i = re.sub(r'senate-julsep-archive\.js\?v=[0-9-]+', 'senate-julsep-archive.js?v=20260908-1312', i)
          p.write_text(i)

          out = Path('index.html').read_text()
          assert "stateData.ME.active)stateData.ME.rating='tilt-d'" in out
          assert "ME:'Jackson +0.4%'" in out
          assert 'senate-julsep-archive.js?v=20260908-1312' in out
          assert 'scale(1.32)' not in Path('senate-julsep-archive.js').read_text()
          PY
      - name: Commit site update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/fix-maine-render-and-mobile-size.yml
          git add index.html senate-julsep-archive.js .github/workflows/fix-maine-render-and-mobile-size.yml
          git commit -m "Fix Maine map render and restore mobile map size"
          git push
