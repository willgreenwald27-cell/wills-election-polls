name: Equalize homepage forecast cards
on:
  push:
    paths:
      - '.github/workflows/equal-home-forecast-cards.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make House and Senate cards equal size
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('sep9-polls-update.js')
          s=p.read_text()

          s=s.replace(
            '#homeForecastSplit{display:grid;grid-template-columns:minmax(0,42fr) minmax(0,58fr);gap:18px;align-items:stretch;width:100%}',
            '#homeForecastSplit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:stretch;width:100%}'
          )

          s=s.replace(
            '#homeForecastSplit .forecast-card{border:1px solid #dde3ec;border-radius:20px;background:#fff;box-shadow:0 10px 28px rgba(20,34,53,.08);overflow:hidden;min-width:0}',
            '#homeForecastSplit .forecast-card{border:1px solid #dde3ec;border-radius:20px;background:#fff;box-shadow:0 10px 28px rgba(20,34,53,.08);overflow:hidden;min-width:0;box-sizing:border-box}@media(min-width:761px){#homeForecastSplit .forecast-card{aspect-ratio:1672/941;height:auto!important}}'
          )

          s=s.replace(
            '#homeForecastSplit .senate-card{position:relative;padding:28px 30px 25px;background:linear-gradient(135deg,#f7faff 0%,#fff 56%,#fff6f7 100%);display:flex;flex-direction:column;justify-content:center;min-height:340px}',
            '#homeForecastSplit .senate-card{position:relative;padding:22px 24px 20px;background:linear-gradient(135deg,#f7faff 0%,#fff 56%,#fff6f7 100%);display:flex;flex-direction:column;justify-content:center;min-height:0}'
          )

          # Slightly tighten Senate typography so the equal-aspect card stays balanced.
          s=s.replace('font:800 clamp(32px,4vw,54px)/1 Georgia,serif','font:800 clamp(28px,3.2vw,46px)/1 Georgia,serif')
          s=s.replace('font:900 clamp(58px,7vw,92px)/.9 Georgia,serif','font:900 clamp(48px,5.7vw,78px)/.9 Georgia,serif')

          p.write_text(s)

          idx=Path('index.html')
          i=idx.read_text()
          i,n=re.subn(r'sep9-polls-update\.js\?v=[0-9-]+','sep9-polls-update.js?v=20260909-2334',i)
          if n!=1:
              raise SystemExit(f'expected one updater cache key, found {n}')
          idx.write_text(i)

          out=p.read_text()
          assert 'grid-template-columns:minmax(0,1fr) minmax(0,1fr)' in out
          assert 'aspect-ratio:1672/941' in out
          assert 'sep9-polls-update.js?v=20260909-2334' in idx.read_text()
          PY
      - name: Commit equal-card layout
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/equal-home-forecast-cards.yml
          git add sep9-polls-update.js index.html .github/workflows/equal-home-forecast-cards.yml
          git commit -m "Make homepage House and Senate cards equal size"
          git push
