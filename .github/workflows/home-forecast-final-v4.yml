name: Refine homepage forecast UI
on:
  push:
    paths:
      - '.github/workflows/home-forecast-final-v4.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update homepage CTA nav type and countdown
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('sep9-polls-update.js')
          s=p.read_text()

          # Give the nav a more distinctive editorial type treatment.
          if '#page-home #homeForecastSplit .senate-countdown' not in s:
              css_anchor="      #page-home #homeForecastSplit .majority-note{margin-top:8px!important;font:800 9px/1.2 Inter,ui-sans-serif,system-ui,sans-serif!important;letter-spacing:1px!important;text-transform:uppercase!important;color:#6c798b!important;text-align:center!important}\n"
              css_add="""      #page-home #homeForecastSplit .senate-countdown{margin-top:9px!important;padding-top:8px!important;border-top:1px solid #e2e7ef!important;display:flex!important;align-items:center!important;justify-content:space-between!important;gap:10px!important}\n      #page-home #homeForecastSplit .senate-countdown-label{font:900 8px/1.2 Inter,ui-sans-serif,system-ui,sans-serif!important;letter-spacing:1px!important;text-transform:uppercase!important;color:#728095!important}\n      #page-home #homeForecastSplit #senateElectionCountdown{font:900 15px/1 Georgia,serif!important;letter-spacing:.2px!important;color:#17263d!important;white-space:nowrap!important}\n      .site-header .nav[data-accepted-nav=\"1\"]>button{font-family:Georgia,\"Times New Roman\",serif!important;font-weight:700!important;letter-spacing:.2px!important;font-size:12px!important}\n      .site-header .nav[data-accepted-nav=\"1\"]>button.active{font-weight:800!important;letter-spacing:.1px!important}\n"""
              if css_anchor not in s:
                  raise SystemExit('countdown CSS anchor missing')
              s=s.replace(css_anchor,css_anchor+css_add,1)

              mobile_anchor="        #page-home #homeForecastSplit .party-number{font-size:54px!important}\n"
              mobile_add="""        #page-home #homeForecastSplit .senate-countdown{margin-top:7px!important;padding-top:7px!important}\n        #page-home #homeForecastSplit #senateElectionCountdown{font-size:13px!important}\n        .site-header .nav[data-accepted-nav=\"1\"]>button{font-size:11px!important}\n"""
              if mobile_anchor not in s:
                  raise SystemExit('mobile CSS anchor missing')
              s=s.replace(mobile_anchor,mobile_anchor+mobile_add,1)

              html_anchor='            <div class="majority-note">51 seats needed for a majority</div>\n'
              html_add='            <div class="senate-countdown"><span class="senate-countdown-label">First polls close · Nov 3 · 6 PM ET</span><strong id="senateElectionCountdown">--d --h --m --s</strong></div>\n'
              if html_anchor not in s:
                  raise SystemExit('Senate countdown HTML anchor missing')
              s=s.replace(html_anchor,html_anchor+html_add,1)

          if 'function fixHomePastErrorsCTA()' not in s:
              fn_anchor='  function removeDuplicateHomeSenatePrediction(){\n'
              fn=r'''  function fixHomePastErrorsCTA(){
    const root=document.getElementById('page-home'); if(!root) return;
    for(const el of root.querySelectorAll('button,a')){
      const t=norm(el.textContent).toLowerCase();
      if(t==='see forecasts'||t==='see forecast'){
        el.textContent='See past polling errors';
        el.dataset.pastErrorsCta='1';
        el.removeAttribute('href');
      }
    }
  }

  function updateElectionCountdown(){
    const el=document.getElementById('senateElectionCountdown'); if(!el) return;
    const target=new Date('2026-11-03T18:00:00-05:00').getTime();
    let ms=Math.max(0,target-Date.now());
    const d=Math.floor(ms/86400000); ms%=86400000;
    const h=Math.floor(ms/3600000); ms%=3600000;
    const m=Math.floor(ms/60000); ms%=60000;
    const sec=Math.floor(ms/1000);
    el.textContent=ms===0&&Date.now()>=target?'POLLS CLOSING':`${d}d ${String(h).padStart(2,'0')}h ${String(m).padStart(2,'0')}m ${String(sec).padStart(2,'0')}s`;
  }

'''
              if fn_anchor not in s:
                  raise SystemExit('function anchor missing')
              s=s.replace(fn_anchor,fn+fn_anchor,1)

          # Make sure the new CTA and countdown are refreshed every apply cycle.
          s=s.replace('    ensureHomeForecastSplit();\n    removeDuplicateHomeSenatePrediction();',
                      '    ensureHomeForecastSplit();\n    fixHomePastErrorsCTA();\n    updateElectionCountdown();\n    removeDuplicateHomeSenatePrediction();',1)

          if 'data.pastErrorsCta' not in s:
              click_anchor="  document.addEventListener('change',e=>{if(e.target?.closest?.('#julsepPollArchive')) setTimeout(apply,20);},true);\n"
              click="""  document.addEventListener('click',e=>{\n    const target=e.target?.closest?.('[data-past-errors-cta]'); if(!target) return;\n    e.preventDefault(); e.stopPropagation();\n    if(typeof window.__acceptedGoodNavigate==='function') window.__acceptedGoodNavigate('errors',true);\n    else document.querySelector('[data-accepted-page=\"errors\"]')?.click();\n  },true);\n"""
              if click_anchor not in s:
                  raise SystemExit('click listener anchor missing')
              s=s.replace(click_anchor,click_anchor+click,1)

          if 'setInterval(updateElectionCountdown,1000);' not in s:
              interval_anchor='  setInterval(apply,1800);\n'
              if interval_anchor not in s:
                  raise SystemExit('interval anchor missing')
              s=s.replace(interval_anchor,interval_anchor+'  setInterval(updateElectionCountdown,1000);\n',1)

          p.write_text(s)

          idx=Path('index.html')
          i=idx.read_text()
          i,n=re.subn(r'sep9-polls-update\.js\?v=[0-9-]+','sep9-polls-update.js?v=20260909-2223',i)
          if n!=1:
              raise SystemExit(f'expected one sep9 updater cache key, found {n}')
          idx.write_text(i)

          out=p.read_text()
          assert 'See past polling errors' in out
          assert 'First polls close · Nov 3 · 6 PM ET' in out
          assert "2026-11-03T18:00:00-05:00" in out
          assert 'font-family:Georgia' in out
          assert 'grid-template-columns:repeat(2,minmax(0,1fr))' in out
          assert 'aspect-ratio:1672/941' in out
          assert "const files=['d0.txt','d1.txt','d2.txt','d3.txt','d4.txt','d5.txt','d6.txt','d7.txt','d8a.txt','d8b.txt','d9.txt']" in idx.read_text()
          assert 'document.open();document.write(h);document.close()' in idx.read_text()
          PY
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/home-forecast-final-v4.yml
          git add sep9-polls-update.js index.html .github/workflows/home-forecast-final-v4.yml
          git commit -m "Polish homepage forecast and add election countdown"
          git push
