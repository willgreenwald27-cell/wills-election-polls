name: Restore accepted site shell

on:
  push:
    paths:
      - '.github/workflows/restore-accepted-site-shell.yml'

permissions:
  contents: write

jobs:
  restore-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore accepted navigation and fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '<script src="/senate-julsep-archive.js?v=20260907-2115"><\\/script><script src="/site-final.js?v=20260907-2045"><\\/script></body>'
          new = '<script src="/senate-julsep-archive.js?v=20260907-2238"><\\/script><script src="/site-final.js?v=20260907-2238"><\\/script><script src="/safe-patches.js?v=20260907-2238"><\\/script></body>'
          if old not in s:
              raise SystemExit('Expected loader sequence not found; refusing broad edit')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Validate restored shell
        run: |
          node --check site-final.js
          node --check safe-patches.js
          test -f past-senate-maps.html
          grep -q 'safe-patches.js?v=20260907-2238' index.html
          git diff --exit-code -- d0.txt d1.txt d2.txt d3.txt d4.txt d5.txt d6.txt d7.txt d8a.txt d8b.txt d9.txt
      - name: Commit exact shell restore
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Restore accepted tabs, Maine, date and Senate history shell'
          git push origin main
