name: Inspect polling errors data
on:
  push:
    paths:
      - '.github/workflows/inspect-errors-data.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract polling errors code snippets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,gzip,re
          files=['d0.txt','d1.txt','d2.txt','d3.txt','d4.txt','d5.txt','d6.txt','d7.txt','d8a.txt','d8b.txt','d9.txt']
          raw=''.join(Path(f).read_text().strip() for f in files)
          html=gzip.decompress(base64.b64decode(raw)).decode('utf-8','replace')
          pats=['error-race','renderErrors','polling error','errorData','pastErrors','errorsData','pollingErrors','error-race-matchup']
          out=[]
          for pat in pats:
            out.append('\n\n===== '+pat+' =====\n')
            for m in list(re.finditer(re.escape(pat),html,re.I))[:8]:
              a=max(0,m.start()-1800); b=min(len(html),m.end()+3500)
              out.append(html[a:b])
              out.append('\n---\n')
          Path('diag-errors-snippets.txt').write_text(''.join(out))
          PY
      - name: Commit diagnostic snippet
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/inspect-errors-data.yml
          git add diag-errors-snippets.txt .github/workflows/inspect-errors-data.yml
          git commit -m "Inspect polling errors data structure"
          git push
