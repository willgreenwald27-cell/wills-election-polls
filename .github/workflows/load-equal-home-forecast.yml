name: Load equal homepage forecast cards
on:
  push:
    paths:
      - '.github/workflows/load-equal-home-forecast.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load equal forecast layout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text()
          if 'home-forecast-equal.js' not in s:
              pat=r'(<script src="/sep9-polls-update\.js\?v=[^"]+"><\\/script>)'
              m=re.search(pat,s)
              if not m:
                  raise SystemExit('sep9 updater script reference not found')
              tag='<script src="/home-forecast-equal.js?v=20260909-1501"><\\/script>'
              s=s[:m.end()]+tag+s[m.end():]
          p.write_text(s)

          out=p.read_text()
          assert 'home-forecast-equal.js?v=20260909-1501' in out
          assert "const files=['d0.txt','d1.txt','d2.txt','d3.txt','d4.txt','d5.txt','d6.txt','d7.txt','d8a.txt','d8b.txt','d9.txt']" in out
          assert 'document.open();document.write(h);document.close()' in out
          PY
      - name: Commit loader update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/load-equal-home-forecast.yml
          git add index.html .github/workflows/load-equal-home-forecast.yml
          git commit -m "Load equal-size homepage forecast cards"
          git push
