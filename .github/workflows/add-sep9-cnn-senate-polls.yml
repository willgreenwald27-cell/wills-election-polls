name: Load Sept 9 poll updater
on:
  push:
    paths:
      - '.github/workflows/add-sep9-cnn-senate-polls.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load poll updater
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          needle='document.open();document.write(h);document.close()'
          tag='sep9-polls-update.js?v=20260909-1322'
          if tag not in s:
              if needle not in s:
                  raise SystemExit('document.write loader anchor missing')
              injection='h=h.replace(\'</body>\',\'<script src="/sep9-polls-update.js?v=20260909-1322"><\\/script></body>\');'
              s=s.replace(needle,injection+needle,1)
          p.write_text(s)
      - name: Validate loader
        shell: python
        run: |
          from pathlib import Path
          s=Path('index.html').read_text()
          assert 'sep9-polls-update.js?v=20260909-1322' in s
          assert "const files=['d0.txt','d1.txt','d2.txt','d3.txt','d4.txt','d5.txt','d6.txt','d7.txt','d8a.txt','d8b.txt','d9.txt']" in s
          assert 'document.open();document.write(h);document.close()' in s
          assert '<script src="/sep9-polls-update.js?v=20260909-1322"><\\/script></body>' in s
      - name: Commit site update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/add-sep9-cnn-senate-polls.yml
          git add index.html .github/workflows/add-sep9-cnn-senate-polls.yml
          git commit -m "Load Sept. 9 Senate poll updater"
          git push
