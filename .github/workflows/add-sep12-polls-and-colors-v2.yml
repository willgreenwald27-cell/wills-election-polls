name: Add Sep 12 polls and colors v2
on:
  push:
    paths:
      - '.github/workflows/add-sep12-polls-and-colors-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch poll data and loader
        run: |
          python -c "from pathlib import Path; p=Path('senate-julsep-archive.js'); s=p.read_text(); m='  const POLLS=[\\n'; rows=[\"['2026-09-12','NC','North Carolina','Trafalgar Group*','Roy Cooper',48,'Michael Whatley',42,'RCP'],\",\"['2026-09-12','GA','Georgia','Trafalgar Group*','Jon Ossoff',49,'Mike Collins',43,'RCP'],\",\"['2026-09-10','MN','Minnesota','Quantus Insights','Peggy Flanagan',48,'Michele Tafoya',44,'RCP'],\",\"['2026-09-10','FL','Florida Special Election','Quantus Insights','Ashley Moody',50,'Jasmine Nixon',43,'RCP'],\"]; [None for r in reversed(rows) if (r.rstrip(',') in s) or not (s:=s.replace(m,m+r+'\\n',1))]; p.write_text(s)"
          python -c "from pathlib import Path; p=Path('senate-auto-averages.js'); s=p.read_text(); a='  const NEW_POLLS=[\\n'; add=\"    ['2026-09-12','NC','North Carolina','Trafalgar Group*','Roy Cooper',48,'Michael Whatley',42,'User-provided poll'],\\n    ['2026-09-12','GA','Georgia','Trafalgar Group*','Jon Ossoff',49,'Mike Collins',43,'User-provided poll'],\\n\"; s=s if \"'2026-09-12','NC','North Carolina','Trafalgar Group*'\" in s else s.replace(a,a+add,1); s=s.replace(\"notes:row[1]==='IA'?'Turek +2':row[1]==='MN'?'Flanagan +4':'Moody +7'\",\"notes:row[1]==='NC'?'Cooper +6':row[1]==='GA'?'Ossoff +6':row[1]==='IA'?'Turek +2':row[1]==='MN'?'Flanagan +4':'Moody +7'\",1); s=s.replace(\"if(s.updated!=='2026-09-11'){s.updated='2026-09-11';changed=true;}\",\"if(s.updated!=='2026-09-12'){s.updated='2026-09-12';changed=true;}\",1); p.write_text(s)"
          python -c "from pathlib import Path; import re; p=Path('index.html'); s=p.read_text(); s=re.sub(r'senate-julsep-archive\\.js\\?v=[0-9-]+','senate-julsep-archive.js?v=20260913-2034',s,count=1); s=re.sub(r'senate-auto-averages\\.js\\?v=[0-9-]+','senate-auto-averages.js?v=20260913-2034',s,count=1); tag='<script src=\"/poll-color-fix.js?v=20260913-2034\"><\\/script>'; s=s.replace('</body>',tag+'</body>',1) if 'poll-color-fix.js' not in s else s; p.write_text(s)"
          node --check senate-julsep-archive.js
          node --check senate-auto-averages.js
          node --check poll-color-fix.js
          grep -q "2026-09-12','NC','North Carolina','Trafalgar Group" senate-julsep-archive.js
          grep -q "2026-09-12','GA','Georgia','Trafalgar Group" senate-julsep-archive.js
          grep -q "poll-color-fix.js?v=20260913-2034" index.html
          git config user.name 'Will Election Polls Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add senate-julsep-archive.js senate-auto-averages.js index.html
          git commit -m 'Add Sep 12 NC and GA polls to averages and New Polls'
          git push origin main
