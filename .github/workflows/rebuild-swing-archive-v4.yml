name: Rebuild swing archive v4
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-swing-archive-v4.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Run patch script
        run: python .github/scripts/rebuild_swing_archive_v4.py
      - name: Validate JavaScript
        run: node --check senate-error-history.js
      - name: Commit production update
        run: |
          git config user.name 'Will Election Polls Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add senate-error-history.js
          git diff --cached --quiet && exit 0
          git commit -m 'Organize swing histories, fix party colors, and feature polling errors'
          git push origin main
