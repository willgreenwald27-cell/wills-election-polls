name: State average immersive v6
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/state-average-immersive-v6.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply swing-state average redesign
        run: python .github/scripts/state_average_immersive_v6.py
      - name: Validate JavaScript
        run: node --check senate-error-history.js
      - name: Commit production update
        run: |
          git config user.name 'Will Election Polls Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add senate-error-history.js
          git diff --cached --quiet && exit 0
          git commit -m 'Show average polling miss with immersive state histories'
          git push origin main
