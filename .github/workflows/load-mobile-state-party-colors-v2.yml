name: Load mobile state party colors v2
on:
  push:
    paths:
      - '.github/workflows/load-mobile-state-party-colors-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Load mobile party color fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="/mobile-state-party-colors-v2.js?v=20260907-2322"></script>'
          if tag not in s:
              marker='<script src="/accepted-good.js?v=20260907-1958"></script>'
              if marker in s:
                  s=s.replace(marker, marker+tag)
              else:
                  s=s.replace('</body>', tag+'</body>', 1)
          p.write_text(s)
          PY
      - name: Validate loader and fix
        run: |
          grep -q 'mobile-state-party-colors-v2.js?v=20260907-2322' index.html
          node --check mobile-state-party-colors-v2.js
          git diff --quiet -- d0.txt d1.txt d2.txt d3.txt d4.txt d5.txt d6.txt d7.txt d8a.txt d8b.txt d9.txt
      - name: Commit loader update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Load mobile candidate and odds bar color fix'
            git push
          fi
