name: Refresh Maine mobile color fix
on:
  push:
    paths:
      - '.github/workflows/fix-home-layout-maine-colors.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh mobile color script cache key
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          idx=Path('index.html')
          s=idx.read_text()
          s,n=re.subn(r'mobile-home-repair\.js\?v=[0-9-]+','mobile-home-repair.js?v=20260909-2216',s)
          if n!=1:
              raise SystemExit(f'expected one mobile-home-repair cache key, found {n}')
          idx.write_text(s)
          out=idx.read_text()
          assert "['d0.txt','d1.txt','d2.txt','d3.txt','d4.txt','d5.txt','d6.txt','d7.txt','d8a.txt','d8b.txt','d9.txt']" in out
          assert 'document.open();document.write(h);document.close()' in out
          assert 'mobile-home-repair.js?v=20260909-2216' in out
          PY
      - name: Commit cache refresh
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/fix-home-layout-maine-colors.yml
          git add index.html .github/workflows/fix-home-layout-maine-colors.yml
          git commit -m "Refresh Maine mobile color fix"
          git push
