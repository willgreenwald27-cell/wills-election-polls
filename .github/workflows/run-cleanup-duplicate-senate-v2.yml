name: Clean duplicate homepage Senate card
on:
  push:
    paths:
      - '.github/workflows/run-cleanup-duplicate-senate-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run cleanup script
        run: python3 cleanup-duplicate-senate.py
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sep9-polls-update.js index.html
          git diff --cached --quiet || git commit -m "Remove duplicate Senate prediction from homepage"
          git push
