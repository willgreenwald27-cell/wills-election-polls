name: Refresh final style asset
on:
  push:
    paths:
      - '.github/workflows/refresh-sept11-style.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh asset version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          s,n=re.subn(r'sept11-final\.js\?v=[0-9A-Za-z._-]+','sept11-final.js?v=20260911-005',s,count=1)
          if n!=1: raise SystemExit(f'cache key replacement count={n}')
          p.write_text(s)
          PY
          grep -q "sept11-final.js?v=20260911-005" index.html
      - name: Commit refresh
        run: |
          git config user.name "Will Election Polls Bot"
          git config user.email "actions@users.noreply.github.com"
          rm -f .github/workflows/standardize-republican-call-boxes.yml
          rm -f .github/workflows/refresh-sept11-style.yml
          git add index.html .github/workflows/standardize-republican-call-boxes.yml .github/workflows/refresh-sept11-style.yml
          git commit -m "Refresh final Senate call styling"
          git push
