name: Cleanup stale overrides v3
on: push
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('sept11-final.js')
          s=p.read_text()
          s=s.replace("'Sep 11, 2026'","'Sep 15, 2026'")
          s=s.replace("'Last updated September 11, 2026'","'Last updated September 15, 2026'")
          s=s.replace("  setInterval(apply,500);\n","")
          p.write_text(s)

          p=Path('sept9-final-ui.js')
          s=p.read_text()
          s=s.replace("'Sep 9, 2026'","'Sep 15, 2026'")
          s=s.replace("s.updated!=='2026-09-09'","s.updated!=='2026-09-15'")
          s=s.replace("s.updated='2026-09-09'","s.updated='2026-09-15'")
          s=s.replace("    if(changed&&typeof renderSenate==='function'&&!renderingSenate){","    if(stateData?.TX){stateData.TX.rating='tilt-d';stateData.TX.predictionParty='Democratic';stateData.TX.callParty='Democratic';stateData.TX.prediction='Tilt Democratic';stateData.TX.notes='';}\n    changed=false;\n    if(changed&&typeof renderSenate==='function'&&!renderingSenate){")
          s=s.replace("  setInterval(apply,1400);\n","")
          p.write_text(s)

          p=Path('site-ux-polish.js')
          s=p.read_text().replace("  setInterval(apply,750);\n","")
          s=s.replace("new MutationObserver(schedule).observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['class','style']});","new MutationObserver(schedule).observe(document.body,{childList:true,subtree:true,characterData:true});")
          p.write_text(s)

          p=Path('index.html')
          s=p.read_text()
          s=s.replace("h=h.replace('Sep 11, 2026','Sep 15, 2026');","h=h.replaceAll('Sep 11, 2026','Sep 15, 2026').replaceAll('Sep 12, 2026','Sep 15, 2026').replaceAll('Sep 9, 2026','Sep 15, 2026');")
          for f in ['site-final.js','senate-current-sync.js','sept9-final-ui.js','sept11-final.js','site-ux-polish.js','senate-auto-averages.js']:
              s=re.sub(re.escape(f)+r'\?v=[0-9-]+',f+'?v=20260915-2140',s)
          p.write_text(s)
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sept11-final.js sept9-final-ui.js site-ux-polish.js
          git diff --cached --quiet && exit 0
          git commit -m "Remove stale date and Senate rerender conflicts"
          git push
