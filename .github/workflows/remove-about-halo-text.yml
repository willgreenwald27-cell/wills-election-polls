name: Remove About logo halo and text

on:
  push:
    paths:
      - '.github/workflows/remove-about-halo-text.yml'

permissions:
  contents: write

jobs:
  patch-about:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hide duplicate About logo halo and text
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '#page-about .profile-card{background:#5a789d!important;color:#fff!important}'
          new = '#page-about .about-logo-halo,#page-about .about-logo-stage strong{display:none!important}#page-about .profile-card{background:#5a789d!important;color:#fff!important}'
          if s.count(old) != 1:
              raise SystemExit(f'About CSS target count: {s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s)
      - name: Validate loader JavaScript
        shell: python
        run: |
          from pathlib import Path
          s = Path('index.html').read_text()
          start = s.find('<script>')
          end = s.rfind('</script>')
          if start < 0 or end <= start:
              raise SystemExit('Loader script not found')
          Path('/tmp/loader.js').write_text(s[start+8:end])
      - run: node --check /tmp/loader.js
      - name: Commit About logo cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Keep only About Me logo"
          git push
