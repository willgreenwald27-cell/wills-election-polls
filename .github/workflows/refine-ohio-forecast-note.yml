name: Refine Ohio forecast note
on:
  push:
    paths:
      - '.github/workflows/refine-ohio-forecast-note.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Ohio rationale
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('accepted-good.js')
          s=p.read_text()
          old="OH:{candidates:['Jon Husted','Sherrod Brown'],text:\"Why my forecast differs from the polling average: I’m giving more weight to Ohio’s recent Republican-leaning fundamentals and turnout patterns, while accounting for the possibility that some surveys may underrepresent rural and blue-collar voters.\"}"
          new="OH:{candidates:['Jon Husted','Sherrod Brown'],text:\"Why my forecast differs from the polling average: Ohio polling has repeatedly been more Democratic than the final result in recent statewide elections, so I’m weighting the state’s recent election history and Republican-leaning results more heavily than the current polling average.\"}"
          if old not in s:
              raise SystemExit('Ohio note anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('index.html')
          i=p.read_text()
          i=re.sub(r'accepted-good\.js\?v=[0-9-]+','accepted-good.js?v=20260908-1657',i)
          p.write_text(i)

          out=Path('accepted-good.js').read_text()
          assert 'Ohio polling has repeatedly been more Democratic than the final result' in out
          assert 'accepted-good.js?v=20260908-1657' in Path('index.html').read_text()
          PY
      - name: Commit site update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/refine-ohio-forecast-note.yml
          git add accepted-good.js index.html .github/workflows/refine-ohio-forecast-note.yml
          git commit -m "Refine Ohio polling rationale note"
          git push
