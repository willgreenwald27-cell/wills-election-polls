name: Stabilize Ohio and Texas forecast
on:
  push:
    paths:
      - '.github/workflows/stabilize-ohio-texas-20260914.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove stale tossup label
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('senate-history-context.js'); s=p.read_text()
          s=s.replace("if(/^\\d+\\s+(?:INDEPENDENT|TOSSUPS?)$/i.test(t))el.textContent='1 TOSSUP';","if(/^\\d+\\s+(?:INDEPENDENT|TOSSUPS?)$/i.test(t))el.textContent='0 TOSSUP';",1)
          p.write_text(s)
          p=Path('index.html'); s=p.read_text()
          old='senate-history-context.js?v=20260914-1826'; new='senate-history-context.js?v=20260914-1827'
          i=s.rfind(old)
          if i>=0: s=s[:i]+new+s[i+len(old):]
          p.write_text(s)
          PY
      - name: Commit final totals
        shell: bash
        run: |
          git config user.name 'Will Election Polls Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add senate-history-context.js index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Finalize 50-50 Senate totals after Texas tilt red'
          git push
