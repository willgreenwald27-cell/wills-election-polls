name: Stabilize Ohio and Texas forecast
on:
  push:
    paths:
      - '.github/workflows/stabilize-ohio-texas-20260914.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply stable Ohio and Texas forecast
        run: python3 .github/scripts/stabilize-ohio-texas.py
      - name: Commit stable forecast
        shell: bash
        run: |
          git config user.name 'Will Election Polls Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add site-final.js senate-current-sync.js senate-history-context.js index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Stop Ohio flashing and set Texas tilt red'
          git push
