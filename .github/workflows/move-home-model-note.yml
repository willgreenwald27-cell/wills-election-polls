name: Move homepage methodology note

on:
  push:
    paths:
      - '.github/workflows/move-home-model-note.yml'

permissions:
  contents: write

jobs:
  move-note:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move note in index.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '''const heroIntro=document.querySelector("#page-home .reference-hero-copy>p");if(heroIntro&&!document.getElementById("homeModelNote")){const note=document.createElement("p");note.id="homeModelNote";note.textContent="One of the only election forecasting sites to incorporate every U.S. Senate polling miss of the 21st century into its probability model.";note.style.cssText="margin:10px 0 0;font-size:13px;line-height:1.45;font-weight:700;color:#4b5b70;max-width:690px";heroIntro.insertAdjacentElement("afterend",note)}const heroActions=document.querySelector(".reference-hero-actions");'''
          new = '''const heroActions=document.querySelector(".reference-hero-actions");if(heroActions&&!document.getElementById("homeModelNote")){const note=document.createElement("div");note.id="homeModelNote";note.innerHTML='<span style="display:block;font-size:10px;font-weight:900;letter-spacing:1.25px;text-transform:uppercase;color:#607086;margin-bottom:5px">Methodology</span><span style="display:block;font-size:13px;line-height:1.45;font-weight:700;color:#33445b">One of the only election forecasting sites to incorporate every U.S. Senate polling miss of the 21st century into its probability model.</span>';note.style.cssText="margin:16px 0 2px;padding:12px 14px;border:1px solid #dce3eb;border-radius:10px;background:#f7f9fb;max-width:690px;box-sizing:border-box";heroActions.insertAdjacentElement("afterend",note)}'''
          if old not in s:
              raise SystemExit('Expected homepage note block not found; index.html left unchanged')
          p.write_text(s.replace(old, new, 1))
      - name: Commit direct index.html change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Move homepage methodology note below hero buttons"
          git push
