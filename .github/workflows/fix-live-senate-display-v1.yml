name: Fix live Senate display
on:
  push:
    paths:
      - '.github/workflows/fix-live-senate-display-v1.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix homepage balance, Senate bar, and Texas stability
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Fix the old homepage Senate card at its source if present.
          p=Path('home-split-forecast.js')
          if p.exists():
              s=p.read_text()
              s=s.replace('DEMOCRATS: 49','DEMOCRATS: 51')
              s=s.replace('REPUBLICANS: 51','REPUBLICANS: 49')
              s=s.replace('<div class="will-split-bar-labels"><strong>49</strong><strong>51</strong></div>','<div class="will-split-bar-labels"><strong>51</strong><strong>49</strong></div>')
              s=s.replace('Democrats<br><small>49 seats</small>','Democrats<br><small>51 seats</small>')
              s=s.replace('Republicans<br><small>51 seats</small>','Republicans<br><small>49 seats</small>')
              s=s.replace('.dem-bar{background:${BLUE};width:49%} #housePrediction2026 .rep-bar{background:${RED};width:51%}', '.dem-bar{background:${BLUE};width:51%} #housePrediction2026 .rep-bar{background:${RED};width:49%}')
              p.write_text(s)

          # Replace the late UI patch with a small targeted stabilizer. No polling interval.
          p=Path('site-ux-polish.js')
          s=r'''(()=>{
  'use strict';
  const BLUE='#2763b8', RED='#bd2937', TILT_BLUE='#d3e2f7';
  const norm=v=>String(v||'').replace(/\s+/g,' ').trim();
  const leafs=root=>root?[...root.querySelectorAll('*')].filter(el=>el.children.length===0):[];
  const watchedTx=new WeakSet(), watchedBars=new WeakSet();
  let raf=0;

  function ensureStyle(){
    let st=document.getElementById('wgFinalStableStyle');
    if(!st){st=document.createElement('style');st.id='wgFinalStableStyle';document.head.appendChild(st);}
    st.textContent=`
      .site-header .nav{position:relative!important;z-index:1001!important}
      .site-header .nav>[data-page-link],.site-header .nav>button{pointer-events:auto!important;position:relative!important;z-index:1002!important}
      #page-senate .balance-count-row{display:grid!important;grid-template-columns:1fr auto 1fr!important;align-items:end!important}
      #page-senate .balance-party{display:flex!important;align-items:baseline!important;gap:8px!important;min-width:0!important}
      #page-senate .balance-party.dem{justify-content:flex-start!important;text-align:left!important}
      #page-senate .balance-party.rep{justify-content:flex-end!important;text-align:right!important}
      #page-senate .balance-party.dem span{order:1!important;color:${BLUE}!important}
      #page-senate .balance-party.dem strong{order:2!important}
      #page-senate .balance-party.rep strong{order:1!important}
      #page-senate .balance-party.rep span{order:2!important;color:${RED}!important}
      #page-senate [data-state="TX"],#page-senate [data-state="TX"] path,#page-senate [data-abbr="TX"],#page-senate [data-abbr="TX"] path,#page-senate [data-state-abbr="TX"],#page-senate [data-state-abbr="TX"] path,#page-senate #TX,#page-senate #TX path,#page-senate #state-TX,#page-senate #state-TX path{fill:${TILT_BLUE}!important}
      @media(max-width:650px){#page-senate .balance-party{gap:4px!important}#page-senate .balance-party span{font-size:7px!important;letter-spacing:.55px!important}}
    `;
  }

  function reorderNav(){
    const nav=document.querySelector('.site-header .nav');if(!nav)return;
    const items=[...nav.children];
    const find=(sel,re)=>nav.querySelector(sel)||items.find(el=>re.test(norm(el.textContent)));
    const preferred=[find('[data-page-link="home"]',/^Home$/i),find('[data-page-link="senate"]',/^2026 Senate Prediction$/i),find('[data-page-link="errors"]',/^Past Polling Errors$/i),find('[data-page-link="polls"]',/^New Polls$/i)].filter(Boolean);
    preferred.forEach((el,i)=>{el.style.setProperty('order',String(i),'important');el.style.setProperty('pointer-events','auto','important');if(el.tagName==='BUTTON'&&!el.type)el.type='button';});
    items.filter(el=>!preferred.includes(el)).forEach((el,i)=>el.style.setProperty('order',String(10+i),'important'));
  }

  function installNavClickRepair(){
    if(window.__wgNavClickRepair)return;window.__wgNavClickRepair=true;
    document.addEventListener('click',e=>{const btn=e.target?.closest?.('.site-header .nav [data-page-link]');if(!btn)return;const page=btn.getAttribute('data-page-link');if(!page)return;try{if(typeof showPage==='function'){e.preventDefault();e.stopImmediatePropagation();showPage(page);}}catch(_){}},true);
  }

  function fixHomeDate(){
    const root=document.getElementById('page-home');if(!root)return;
    for(const el of leafs(root)){const t=norm(el.textContent);if(/^(?:Sep(?:t(?:ember)?)?\.?\s+(?:9|11|12|15),?\s+2026|2026-09-(?:09|11|12|15))$/i.test(t))el.textContent='Sep 15, 2026';}
  }

  function paintBinaryBar(bar){
    if(!bar)return;
    const grad=`linear-gradient(to right,${BLUE} 0%,${BLUE} 51%,${RED} 51%,${RED} 100%)`;
    if(bar.style.getPropertyValue('background-image')!==grad)bar.style.setProperty('background-image',grad,'important');
    if(bar.style.getPropertyValue('background-color')!=='transparent')bar.style.setProperty('background-color','transparent','important');
    for(const el of [...bar.children]){
      if(el.matches('b,.majority-line,[class*="majority"]'))continue;
      const cls=String(el.className||'');
      if(/toss|neutral|independent|\bind\b/i.test(cls)){
        if(el.style.getPropertyValue('display')!=='none')el.style.setProperty('display','none','important');
        if(el.style.getPropertyValue('width')!=='0%')el.style.setProperty('width','0%','important');
        if(el.style.getPropertyValue('flex')!=='0 0 0%')el.style.setProperty('flex','0 0 0%','important');
      }else{
        if(el.style.getPropertyValue('background-color')!=='transparent')el.style.setProperty('background-color','transparent','important');
        if(el.style.getPropertyValue('background-image')!=='none')el.style.setProperty('background-image','none','important');
      }
    }
    if(!watchedBars.has(bar)){
      watchedBars.add(bar);
      new MutationObserver(()=>paintBinaryBar(bar)).observe(bar,{attributes:true,subtree:true,attributeFilter:['style','class']});
    }
  }

  function fixSenateBalance(){
    const root=document.getElementById('page-senate');if(!root)return;
    const row=root.querySelector('.balance-count-row');
    const dem=row?.querySelector('.balance-party.dem'), rep=row?.querySelector('.balance-party.rep');
    if(dem){const n=dem.querySelector('strong')||leafs(dem).find(x=>/^\d+$/.test(norm(x.textContent)));if(n)n.textContent='51';const s=dem.querySelector('span');if(s)s.textContent='Democratic';}
    if(rep){const n=rep.querySelector('strong')||leafs(rep).find(x=>/^\d+$/.test(norm(x.textContent)));if(n)n.textContent='49';const s=rep.querySelector('span');if(s)s.textContent='Republican';}

    const rr=row?.getBoundingClientRect();
    const scope=row?.parentElement||root;
    const named=[...scope.querySelectorAll('.senate-bar,.balance-bar,.forecast-bar,.seat-bar,[class*="balance-bar"],[class*="senate-bar"],[class*="seat-bar"]')];
    const nearby=[...scope.querySelectorAll('div,section')].filter(el=>{
      if(el===row)return false;const r=el.getBoundingClientRect();if(r.width<Math.min(300,window.innerWidth*.55)||r.height<5||r.height>35)return false;
      if(rr&&(r.top<rr.bottom-4||r.top>rr.bottom+95))return false;
      const colors=[el,...el.children].map(x=>getComputedStyle(x).backgroundColor||'');
      return colors.some(c=>/rgb\((?:39, 99, 184|189, 41, 55|242, 201, 76|204, 177, 75|234, 219, 150)\)/.test(c));
    });
    [...new Set([...named,...nearby])].forEach(bar=>{const r=bar.getBoundingClientRect();if(r.width>250&&r.height<=40)paintBinaryBar(bar);});
  }

  function findHomeSenateCard(root){
    const direct=root.querySelector('.will-senate-card,#homeForecastSplit .senate-card,.senate-card');if(direct)return direct;
    const hits=[...root.querySelectorAll('div,section,article')].filter(el=>{const t=norm(el.textContent);return /Senate/i.test(t)&&/Democrat/i.test(t)&&/Republican/i.test(t)&&el.getClientRects().length;});
    hits.sort((a,b)=>a.getBoundingClientRect().width*a.getBoundingClientRect().height-b.getBoundingClientRect().width*b.getBoundingClientRect().height);
    return hits[0]||null;
  }

  function fixHomeBalance(){
    const root=document.getElementById('page-home');if(!root)return;
    const card=findHomeSenateCard(root);if(!card)return;
    const dem=card.querySelector('.will-split-parties .dem');if(dem)dem.textContent='DEMOCRATS: 51';
    const rep=card.querySelector('.will-split-parties .rep');if(rep)rep.textContent='REPUBLICANS: 49';
    const labs=card.querySelectorAll('.will-split-bar-labels strong');if(labs[0])labs[0].textContent='51';if(labs[1])labs[1].textContent='49';
    const legends=card.querySelectorAll('.will-split-legend small');if(legends[0])legends[0].textContent='51 seats';if(legends[1])legends[1].textContent='49 seats';
    const db=card.querySelector('.dem-bar');if(db){db.style.setProperty('width','51%','important');db.style.setProperty('flex','0 0 51%','important');}
    const rb=card.querySelector('.rep-bar');if(rb){rb.style.setProperty('width','49%','important');rb.style.setProperty('flex','0 0 49%','important');}
    for(const el of leafs(card)){
      let t=norm(el.textContent), p=norm(el.parentElement?.textContent||'');
      if(/^Democrats?:\s*\d+$/i.test(t))el.textContent=t.replace(/\d+$/,'51');
      else if(/^Republicans?:\s*\d+$/i.test(t))el.textContent=t.replace(/\d+$/,'49');
      else if(/^\d+$/.test(t)&&/Democrat/i.test(p)&&!/Republican/i.test(p))el.textContent='51';
      else if(/^\d+$/.test(t)&&/Republican/i.test(p)&&!/Democrat/i.test(p))el.textContent='49';
    }
    const bar=card.querySelector('.will-split-bar,.senate-bar,.final-bar,[class*="senate-bar"]');if(bar)paintBinaryBar(bar);
  }

  function paintTexas(el){
    if(el.style.getPropertyValue('fill')!==TILT_BLUE||el.style.getPropertyPriority('fill')!=='important')el.style.setProperty('fill',TILT_BLUE,'important');
    if(el.namespaceURI!=='http://www.w3.org/2000/svg'&&!/^(path|polygon|rect)$/i.test(el.tagName||'')){
      if(el.style.getPropertyValue('background-color')!==TILT_BLUE||el.style.getPropertyPriority('background-color')!=='important')el.style.setProperty('background-color',TILT_BLUE,'important');
    }
  }

  function stabilizeTexas(){
    try{if(typeof stateData!=='undefined'&&stateData?.TX){const tx=stateData.TX;tx.rating='tilt-d';tx.predictionParty='Democratic';tx.prediction='Tilt Democratic';tx.notes='';tx.updated='2026-09-15';for(const k of ['projectedWinner','predictionWinner','winner','callParty'])if(k in tx)tx[k]='Democratic';if('call'in tx)tx.call='Tilt Democratic';}}catch(_){}
    const root=document.getElementById('page-senate');if(!root)return;
    const sel='[data-state="TX"],[data-state="TX"] path,[data-abbr="TX"],[data-abbr="TX"] path,[data-state-abbr="TX"],[data-state-abbr="TX"] path,#TX,#TX path,#state-TX,#state-TX path';
    root.querySelectorAll(sel).forEach(el=>{paintTexas(el);if(!watchedTx.has(el)){watchedTx.add(el);new MutationObserver(()=>paintTexas(el)).observe(el,{attributes:true,attributeFilter:['style','fill','class']});}});
  }

  function fixKansasOdds(){
    try{if(typeof stateData!=='undefined'&&stateData?.KS){const ks=stateData.KS;for(const [nk,ok] of [['candidate1','candidate1Odds'],['candidate2','candidate2Odds']]){const n=norm(ks[nk]);if(/Marshall/i.test(n))ks[ok]='77';if(/Hamilton/i.test(n))ks[ok]='23';}}}catch(_){}
  }

  function apply(){ensureStyle();reorderNav();fixHomeDate();fixSenateBalance();fixHomeBalance();stabilizeTexas();fixKansasOdds();}
  function schedule(){if(raf)return;raf=requestAnimationFrame(()=>{raf=0;apply();});}
  installNavClickRepair();apply();[40,120,300,700,1500,3000].forEach(ms=>setTimeout(apply,ms));
  new MutationObserver(schedule).observe(document.body,{childList:true,subtree:true,characterData:true});
  window.addEventListener('pageshow',apply);window.addEventListener('resize',apply);
})();
'''
          p.write_text(s)

          # Fresh cache key for the last-loaded stabilizer.
          p=Path('index.html')
          s=p.read_text()
          s=re.sub(r'site-ux-polish\.js\?v=[0-9-]+','site-ux-polish.js?v=20260915-2245',s)
          p.write_text(s)
          PY
      - name: Commit source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home-split-forecast.js site-ux-polish.js index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Stabilize Senate 51-49 display and Texas color"
          git push
