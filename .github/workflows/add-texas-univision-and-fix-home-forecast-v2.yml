name: Apply navigation cache bump

on:
  push:
    paths:
      - '.github/workflows/add-texas-univision-and-fix-home-forecast-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump site UX cache key
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = 'site-ux-polish.js?v=20260914-2045'
          new = 'site-ux-polish.js?v=20260914-2050'
          if old not in s:
              raise SystemExit(f'Expected cache key not found: {old}')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit cache bump
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Cache-bump navigation click fix"
          git push
# trigger fresh navigation cache bump 2050
