name: Apply final UI fixes

on:
  push:
    paths:
      - '.github/workflows/apply-final-ui-fixes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install final navigation and Maine fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()

          nh="if(stateData.NH&&stateData.NH.active)stateData.NH.rating='tilt-d';"
          both=nh+"if(stateData.ME&&stateData.ME.active)stateData.ME.rating='tilt-r';"
          if both not in s and nh in s:
              s=s.replace(nh,both,1)

          s=re.sub(r'/safe-patches\.js\?v=[0-9-]+','/safe-patches.js?v=20260907-2030',s)
          s=re.sub(r'/senate-julsep-archive\.js\?v=[0-9-]+','/senate-julsep-archive.js?v=20260907-2030',s)

          # Remove the two competing navigation/correction controllers. safe-patches.js now owns both.
          s=re.sub(r'<script src="/site-shell\.js\?v=[^"]+"><\\/script>','',s)
          s=re.sub(r'<script src="/site-corrections\.js\?v=[^"]+"><\\/script>','',s)
          s=re.sub(r'<script src="/navigation-controller\.js\?v=[^"]+"><\\/script>','',s)

          p.write_text(s)
          for marker in ['/safe-patches.js?v=20260907-2030','/senate-julsep-archive.js?v=20260907-2030']:
              if marker not in s: raise SystemExit('Missing '+marker)
          if '/site-shell.js?' in s: raise SystemExit('Old site-shell still loaded')
          PY
      - name: Validate without touching core site data
        run: |
          node --check safe-patches.js
          node --check senate-julsep-archive.js
          node --check senate-display-fixes.js
          node --check maine-statistical-odds.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          if len(scripts)!=1: raise SystemExit(f'Expected one loader script, found {len(scripts)}')
          Path('/tmp/loader.js').write_text(scripts[0])
          PY
          node --check /tmp/loader.js
          git diff --quiet -- d0.txt d1.txt d2.txt d3.txt d4.txt d5.txt d6.txt d7.txt d8a.txt d8b.txt d9.txt
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Use one smooth navigation system and refresh Maine fixes'
          git push
