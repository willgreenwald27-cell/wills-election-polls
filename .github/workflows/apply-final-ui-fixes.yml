name: Apply final UI fixes

on:
  push:
    paths:
      - '.github/workflows/apply-final-ui-fixes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load final unified controller
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()

          # Keep all 88 polls fresh.
          s=re.sub(r'/senate-julsep-archive\.js\?v=[0-9-]+','/senate-julsep-archive.js?v=20260907-2115',s)

          # site-final keeps the corrected Maine data/odds. Remove competing navigation shell.
          s=re.sub(r'<script src="/site-shell\.js\?v=[^"]+"><\\/script>','',s)

          # Load the one final navigation controller last so all tabs use the same in-page shell.
          final='<script src="/safe-patches.js?v=20260907-2115"><\\/script>'
          if '/safe-patches.js?v=20260907-2115' not in s:
              s=s.replace('</body>',final+'</body>',1)

          p.write_text(s)
          for marker in ['/senate-julsep-archive.js?v=20260907-2115','/safe-patches.js?v=20260907-2115','/site-final.js']:
              if marker not in s: raise SystemExit('Missing '+marker)
          if '/site-shell.js?' in s: raise SystemExit('Competing site-shell still loaded')
          PY
      - name: Validate without touching core site data
        run: |
          node --check safe-patches.js
          node --check site-final.js
          node --check senate-julsep-archive.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          if len(scripts)!=1: raise SystemExit(f'Expected one loader script, found {len(scripts)}')
          Path('/tmp/loader.js').write_text(scripts[0])
          PY
          node --check /tmp/loader.js
          git diff --quiet -- d0.txt d1.txt d2.txt d3.txt d4.txt d5.txt d6.txt d7.txt d8a.txt d8b.txt d9.txt
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Use one consistent in-page navigation system'
          git push
