name: Apply final UI fixes

on:
  push:
    paths:
      - '.github/workflows/apply-final-ui-fixes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch loader safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()

          old="function candidatePollClass(name,party){if(String(name||'').toLowerCase().includes('brian bengs')) return 'osborn';"
          new="function candidatePollClass(name,party){const pp=String(party||'').trim().toLowerCase();if(pp==='i'||pp.includes('independent')||pp.includes('unaffiliated')||pp.includes('other'))return 'osborn';if(String(name||'').toLowerCase().includes('brian bengs')) return 'osborn';"
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('candidatePollClass marker not found')

          marker='</body>'
          script='<script src="/final-ui-fixes.js?v=20260907-1836"><\\/script>'
          if '/final-ui-fixes.js' not in s:
              if marker not in s:
                  raise SystemExit('body marker not found')
              s=s.replace(marker,script+marker,1)
          else:
              s=re.sub(r'<script src="/final-ui-fixes\.js(?:\?v=[^"]+)?"><\\/script>',script,s,count=1)

          p.write_text(s)
          if s.count('/final-ui-fixes.js?v=20260907-1836') != 1:
              raise SystemExit('final UI loader verification failed')
          if new not in s:
              raise SystemExit('Independent party patch verification failed')
          PY
      - name: Validate without touching site data
        run: |
          node --check final-ui-fixes.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          if len(scripts) != 1:
              raise SystemExit(f'Expected one loader script, found {len(scripts)}')
          Path('/tmp/loader.js').write_text(scripts[0])
          PY
          node --check /tmp/loader.js
          git diff --quiet -- d0.txt d1.txt d2.txt d3.txt d4.txt d5.txt d6.txt d7.txt d8a.txt d8b.txt d9.txt
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Make all independent candidates purple'
          git push
