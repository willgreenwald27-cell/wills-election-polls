name: Debug Kalshi Texas event
on:
  push:
    paths:
      - '.github/workflows/debug-kalshi-tx.yml'
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Texas Senate event
        run: |
          python - <<'PY'
          import json, urllib.request
          url='https://external-api.kalshi.com/trade-api/v2/events/SENATETX-26?with_nested_markets=true'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=30) as r:
              data=json.load(r)
          with open('kalshi-tx-debug.json','w') as f:
              json.dump(data,f,indent=2)
          PY
      - name: Commit debug response
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kalshi-tx-debug.json
          git diff --cached --quiet || git commit -m 'Capture Kalshi Texas event shape'
          git push
