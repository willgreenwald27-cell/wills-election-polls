name: Set Ohio statistical odds 55-45
on:
  push:
    paths:
      - '.github/workflows/set-ohio-odds-55-45.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set Ohio statistical odds and refresh cache
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('sep9-polls-update.js')
          s=p.read_text()
          marker="      if(typeof stateData!=='undefined'&&stateData?.MI){"
          block="""      if(typeof stateData!=='undefined'&&stateData?.OH){\n        const oh=stateData.OH;\n        for(const slot of [1,2]){\n          const name=norm(oh['candidate'+slot]).toLowerCase();\n          const key='candidate'+slot+'Odds';\n          if(name.includes('husted')&&String(oh[key])!=='55'){oh[key]='55';changed=true;}\n          if(name.includes('brown')&&String(oh[key])!=='45'){oh[key]='45';changed=true;}\n        }\n        if(oh.updated!=='2026-09-09'){oh.updated='2026-09-09';changed=true;}\n      }\n"""
          if "name.includes('husted')&&String(oh[key])!=='55'" not in s:
              if marker not in s:
                  raise SystemExit('Michigan anchor missing')
              s=s.replace(marker,block+marker,1)
          p.write_text(s)

          idx=Path('index.html')
          i=idx.read_text()
          i,n=re.subn(r'sep9-polls-update\.js\?v=[0-9-]+','sep9-polls-update.js?v=20260909-1753',i)
          if n!=1:
              raise SystemExit(f'expected one sep9 cache key, found {n}')
          idx.write_text(i)

          out=p.read_text()
          assert "name.includes('husted')&&String(oh[key])!=='55'" in out
          assert "name.includes('brown')&&String(oh[key])!=='45'" in out
          assert 'sep9-polls-update.js?v=20260909-1753' in idx.read_text()
          PY
      - name: Commit update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/set-ohio-odds-55-45.yml
          git add sep9-polls-update.js index.html .github/workflows/set-ohio-odds-55-45.yml
          git commit -m "Set Ohio statistical odds to Husted 55 Brown 45"
          git push
