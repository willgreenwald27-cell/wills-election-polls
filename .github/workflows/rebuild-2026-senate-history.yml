name: Rebuild 2026 Senate polling history
on:
  push:
    paths:
      - '.github/workflows/rebuild-2026-senate-history.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build complete 2026-seat polling history
        shell: bash
        run: |
          python3 - <<'PY'
          import csv, io, json, math, re, statistics, urllib.request
          from datetime import datetime, date, timedelta
          from pathlib import Path

          REPO=Path('.')
          STANFORD_URL='https://raw.githubusercontent.com/stanford-policylab/polling-errors/master/data/polls_main_dataset.tsv'
          JACK_URL='https://raw.githubusercontent.com/Jack-Whitcomb/All-US-Senate-polls-2006-2024/refs/heads/main/2006_to_2024_senate_polls_with_actuals.csv'
          RESULTS_URL='https://raw.githubusercontent.com/fivethirtyeight/election-results/main/election_results_senate.csv'

          CLASS_II=['AL','AK','AR','CO','DE','GA','ID','IL','IA','KS','KY','LA','ME','MA','MI','MN','MS','MT','NE','NH','NJ','NM','NC','OK','OR','RI','SC','SD','TN','TX','VA','WV','WY']
          SPECIAL_CLASS_III=['FL','OH']
          TARGETS={ab:{'class':'Class II','years':[2002,2008,2014,2020]} for ab in CLASS_II}
          TARGETS.update({ab:{'class':'Class III','years':[2004,2010,2016,2022]} for ab in SPECIAL_CLASS_III})
          SWING=set(['AK','GA','IA','KS','ME','MI','MN','NE','NH','NC','OH','TX'])
          STATE_NAMES={'AL':'Alabama','AK':'Alaska','AR':'Arkansas','CO':'Colorado','DE':'Delaware','FL':'Florida','GA':'Georgia','ID':'Idaho','IL':'Illinois','IA':'Iowa','KS':'Kansas','KY':'Kentucky','LA':'Louisiana','ME':'Maine','MA':'Massachusetts','MI':'Michigan','MN':'Minnesota','MS':'Mississippi','MT':'Montana','NE':'Nebraska','NH':'New Hampshire','NJ':'New Jersey','NM':'New Mexico','NC':'North Carolina','OH':'Ohio','OK':'Oklahoma','OR':'Oregon','RI':'Rhode Island','SC':'South Carolina','SD':'South Dakota','TN':'Tennessee','TX':'Texas','VA':'Virginia','WV':'West Virginia','WY':'Wyoming'}

          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=45) as r:
                  return r.read().decode('utf-8-sig')

          def num(v):
              try:
                  if v is None: return None
                  s=str(v).strip()
                  if not s or s.upper() in ('NA','N/A','NAN','NULL'): return None
                  return float(s)
              except: return None

          def party_bucket(p):
              p=(p or '').strip().upper()
              if p in ('REP','R','GOP','REPUBLICAN'): return 'rep'
              if p in ('DEM','D','DFL','DEMOCRATIC'): return 'dem'
              return 'other'

          def first_tuesday(year):
              d=date(year,11,1)
              while d.weekday()!=0: d+=timedelta(days=1)
              return d+timedelta(days=1)

          stan=list(csv.DictReader(io.StringIO(get(STANFORD_URL)),delimiter='\t'))
          jack=list(csv.DictReader(io.StringIO(get(JACK_URL)))
          result_rows=list(csv.DictReader(io.StringIO(get(RESULTS_URL))))

          # Candidate/result records by state, cycle and seat class. Prefer a runoff when one exists.
          result_index={}
          for ab,spec in TARGETS.items():
              for yr in spec['years']:
                  rows=[r for r in result_rows if r.get('state_abbrev')==ab and str(r.get('cycle'))==str(yr) and r.get('office_seat_name')==spec['class'] and r.get('stage') in ('general','runoff') and r.get('candidate_name') and num(r.get('percent')) is not None]
                  if not rows:
                      result_index[(ab,yr)]=None
                      continue
                  stages={r.get('stage') for r in rows}
                  chosen='runoff' if 'runoff' in stages else 'general'
                  rows=[r for r in rows if r.get('stage')==chosen]
                  # If a ranked-choice file has multiple rounds, use the highest round where available.
                  rounds=[int(float(r['ranked_choice_round'])) for r in rows if str(r.get('ranked_choice_round') or '').strip()]
                  if rounds:
                      mx=max(rounds)
                      rows=[r for r in rows if not str(r.get('ranked_choice_round') or '').strip() or int(float(r['ranked_choice_round']))==mx]
                  cand=[]
                  for r in rows:
                      pct=num(r.get('percent'))
                      if pct is None: continue
                      cand.append({'name':r['candidate_name'].strip(),'party':r.get('ballot_party','').strip(),'bucket':party_bucket(r.get('ballot_party')),'pct':pct,'winner':str(r.get('winner')).lower()=='true'})
                  cand.sort(key=lambda x:x['pct'],reverse=True)
                  if len(cand)>=2:
                      result_index[(ab,yr)]={'stage':chosen,'winner':cand[0],'runner':cand[1]}
                  else:
                      result_index[(ab,yr)]=None

          def support_from_stan(r,b):
              return num(r.get({'dem':'democratic','rep':'republican','other':'someoneElse'}[b]))
          def support_from_jack(r,b):
              return num(r.get({'dem':'dem','rep':'rep','other':'other'}[b]))

          records=[]
          for ab,spec in TARGETS.items():
              for yr in spec['years']:
                  ri=result_index.get((ab,yr))
                  base={'state':ab,'stateName':STATE_NAMES[ab],'year':yr,'seatClass':spec['class'],'swing2026':ab in SWING}
                  if not ri:
                      records.append({**base,'status':'NO DATA','reason':'Official result/candidate data unavailable','pollCount':0})
                      continue
                  w,ru=ri['winner'],ri['runner']
                  matchup=f"{w['name']} vs. {ru['name']}"
                  poll_rows=[]
                  source=''
                  methodology=''

                  if yr<=2014:
                      candidates=[r for r in stan if r.get('state')==ab and str(r.get('year'))==str(yr) and r.get('election')=='Sen']
                      # Stanford can contain general + runoff polling in the same cycle. Use the latest deciding election date.
                      dates=[]
                      for r in candidates:
                          try: dates.append(datetime.strptime(r.get('electionDate',''),'%Y-%m-%d').date())
                          except: pass
                      if dates:
                          target_date=max(dates)
                          candidates=[r for r in candidates if r.get('electionDate')==target_date.isoformat()]
                      for r in candidates:
                          a=support_from_stan(r,w['bucket']); b=support_from_stan(r,ru['bucket'])
                          if a is None or b is None: continue
                          poll_rows.append((a,b,r.get('pollName','')))
                      source='Stanford polling-errors / FiveThirtyEight-Pollster final-three-week dataset'
                      methodology='Average of available Senate polls completed in the final three weeks of the deciding election.'
                  else:
                      # Georgia 2020 had two simultaneous Senate races in the RCP scrape, so use the published RCP runoff aggregate for the Class II seat.
                      if ab=='GA' and yr==2020:
                          # RCP runoff aggregate: Ossoff 49.3, Perdue 48.8; final: Ossoff 50.5, Perdue 49.5.
                          vals={w['name'].lower():49.3,ru['name'].lower():48.8}
                          # Works regardless of 538 ordering/name punctuation.
                          if 'ossoff' in w['name'].lower(): a,b=49.3,48.8
                          elif 'ossoff' in ru['name'].lower(): a,b=48.8,49.3
                          else: a=b=None
                          if a is not None: poll_rows=[(a,b,'RealClearPolitics runoff aggregate')]
                          source='RealClearPolitics published 2020 Georgia Class II runoff aggregate'
                          methodology='Published RCP aggregate for the final deciding runoff, used to avoid mixing Georgia’s two simultaneous 2020 Senate contests.'
                      else:
                          eday=first_tuesday(yr)
                          lo=eday-timedelta(days=21)
                          raw=[r for r in jack if str(r.get('year'))==str(yr) and str(r.get('state','')).strip().lower()==STATE_NAMES[ab].lower()]
                          seen=set()
                          for r in raw:
                              try: end=datetime.strptime(r.get('end_date',''),'%Y/%m/%d').date()
                              except: continue
                              if not (lo<=end<=eday): continue
                              a=support_from_jack(r,w['bucket']); b=support_from_jack(r,ru['bucket'])
                              if a is None or b is None: continue
                              key=(r.get('pollster',''),r.get('start_date',''),r.get('end_date',''),a,b)
                              if key in seen: continue
                              seen.add(key)
                              poll_rows.append((a,b,r.get('pollster','')))
                          source='RealClearPolling polls collected by Jack Whitcomb; official results from FiveThirtyEight'
                          methodology='Average of available RCP-listed Senate polls ending in the final 21 days before Election Day.'

                  if not poll_rows:
                      records.append({**base,'matchup':matchup,'stage':ri['stage'],'winner':w['name'],'winnerParty':w['party'],'runnerUp':ru['name'],'runnerUpParty':ru['party'],'actualWinnerPct':round(w['pct'],1),'actualRunnerPct':round(ru['pct'],1),'actualMargin':round(w['pct']-ru['pct'],1),'status':'NO POLLING','pollCount':0,'source':source,'methodology':methodology})
                      continue

                  wa=statistics.mean(x[0] for x in poll_rows)
                  rb=statistics.mean(x[1] for x in poll_rows)
                  poll_margin=wa-rb  # measured from the actual winner's perspective
                  actual_margin=w['pct']-ru['pct']
                  err=abs(actual_margin-poll_margin)
                  wrong=poll_margin<0
                  status='MISS' if wrong or err>3.0 else 'HIT'
                  leader=w['name'] if poll_margin>=0 else ru['name']
                  leader_margin=abs(poll_margin)
                  records.append({**base,
                      'matchup':matchup,'stage':ri['stage'],
                      'winner':w['name'],'winnerParty':w['party'],'runnerUp':ru['name'],'runnerUpParty':ru['party'],
                      'pollWinnerPct':round(wa,1),'pollRunnerPct':round(rb,1),
                      'pollLeader':leader,'pollMargin':round(leader_margin,1),'pollMarginSignedWinnerPerspective':round(poll_margin,1),
                      'actualWinnerPct':round(w['pct'],1),'actualRunnerPct':round(ru['pct'],1),'actualMargin':round(actual_margin,1),
                      'error':round(err,1),'wrongWinner':wrong,'status':status,'pollCount':len(poll_rows),
                      'source':source,'methodology':methodology})

          records.sort(key=lambda r:(r['stateName'],r['year']))
          scored=[r for r in records if r.get('status') in ('HIT','MISS')]
          hits=[r for r in scored if r['status']=='HIT']; misses=[r for r in scored if r['status']=='MISS']
          wrong=[r for r in scored if r.get('wrongWinner')]
          swing_misses=[r for r in misses if r.get('swing2026')]
          stats={
              'seatCycles':len(records),'states':len(TARGETS),'scored':len(scored),'hits':len(hits),'misses':len(misses),
              'wrongWinner':len(wrong),'noPolling':len([r for r in records if r.get('status')=='NO POLLING']),
              'avgAbsError':round(statistics.mean(r['error'] for r in scored),1) if scored else None,
              'medianAbsError':round(statistics.median(r['error'] for r in scored),1) if scored else None,
              'swingMisses':len(swing_misses),
              'hitThreshold':3.0
          }
          payload={
              'generated':'2026-09-09','scope':'Only Senate seats scheduled for election in 2026; four previous cycles for the same seat class.',
              'targetStates':list(TARGETS.keys()),'swingStates':sorted(SWING),'stats':stats,'records':records,
              'sources':[
                {'name':'Stanford Policy Lab polling-errors','url':'https://github.com/stanford-policylab/polling-errors','note':'Final-three-week polling data, 1998–2014.'},
                {'name':'Jack Whitcomb / RealClearPolling Senate polls','url':'https://github.com/Jack-Whitcomb/All-US-Senate-polls-2006-2024','note':'RCP-listed Senate polls, used for 2016–2022.'},
                {'name':'FiveThirtyEight election-results','url':'https://github.com/fivethirtyeight/election-results','note':'Candidate names, seat classes and official election results.'}
              ]
          }
          Path('senate-error-history-data.json').write_text(json.dumps(payload,indent=2,ensure_ascii=False)+'\n')

          js=r'''(()=>{
  const DATA_URL='/senate-error-history-data.json?v=20260909-2246';
  const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const fmt=n=>Number.isFinite(Number(n))?Number(n).toFixed(1):'—';
  let data=null, rendering=false;

  function style(){
    if(document.getElementById('seatHistory2026Style')) return;
    const s=document.createElement('style'); s.id='seatHistory2026Style'; s.textContent=`
      #page-errors .seh-wrap{max-width:1180px;margin:0 auto;padding:12px 0 50px;color:#17263d}
      #page-errors .seh-hero{padding:28px 0 18px;border-bottom:1px solid #dce3ed}
      #page-errors .seh-kicker{font:900 11px/1.2 Inter,system-ui,sans-serif;letter-spacing:2px;text-transform:uppercase;color:#6e7d91}
      #page-errors .seh-title{font:800 clamp(34px,5vw,58px)/1.02 Georgia,serif;margin:8px 0 12px;color:#132238}
      #page-errors .seh-sub{font:600 15px/1.55 Inter,system-ui,sans-serif;color:#58687d;max-width:900px}
      #page-errors .seh-stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin:20px 0}
      #page-errors .seh-stat{border:1px solid #dce3ed;border-radius:14px;padding:14px;background:#fff}
      #page-errors .seh-stat b{display:block;font:900 25px/1 Georgia,serif;margin-top:7px}.seh-stat span{font:800 10px/1.2 Inter,system-ui,sans-serif;letter-spacing:1.2px;text-transform:uppercase;color:#708096}
      #page-errors .seh-swing{margin:26px 0;padding:20px;border-radius:18px;background:linear-gradient(135deg,#f6f8fc,#fff4f5);border:1px solid #dce3ed}
      #page-errors .seh-swing h2,#page-errors .seh-all h2{font:800 28px/1.1 Georgia,serif;margin:0 0 7px}.seh-note{font:600 13px/1.5 Inter,system-ui,sans-serif;color:#66768b}
      #page-errors .seh-swing-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
      #page-errors .seh-mini{border-radius:13px;background:#fff;border:1px solid #e0e6ef;padding:12px}.seh-mini strong{display:block;font:800 14px/1.25 Inter,system-ui,sans-serif}.seh-mini small{display:block;margin-top:5px;color:#6b788b;font:700 11px/1.35 Inter,system-ui,sans-serif}
      #page-errors .seh-controls{display:grid;grid-template-columns:1.5fr repeat(3,minmax(130px,.6fr));gap:10px;margin:18px 0}
      #page-errors .seh-controls input,#page-errors .seh-controls select{width:100%;box-sizing:border-box;border:1px solid #ccd5e2;border-radius:12px;background:#fff;padding:11px 12px;font:700 13px Inter,system-ui,sans-serif;color:#17263d}
      #page-errors .seh-state{margin:15px 0 18px;border:1px solid #dce3ed;border-radius:17px;background:#fff;overflow:hidden}
      #page-errors .seh-state-head{display:flex;justify-content:space-between;align-items:end;gap:12px;padding:16px 18px;background:#f7f9fc;border-bottom:1px solid #e1e7ef}.seh-state-head h3{font:800 23px/1 Georgia,serif;margin:0}.seh-state-head span{font:800 10px/1.2 Inter,system-ui,sans-serif;letter-spacing:1px;text-transform:uppercase;color:#748397}
      #page-errors .seh-row{display:grid;grid-template-columns:68px minmax(180px,1.5fr) minmax(155px,1fr) minmax(155px,1fr) 90px 92px;gap:10px;align-items:center;padding:13px 18px;border-bottom:1px solid #edf1f6;font:700 12px/1.35 Inter,system-ui,sans-serif}.seh-row:last-child{border-bottom:0}.seh-year{font:900 18px/1 Georgia,serif}.seh-match{font-weight:800}.seh-label{display:block;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:#8a96a7;margin-bottom:3px}.seh-badge{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:7px 9px;font:900 10px/1 Inter,system-ui,sans-serif;letter-spacing:.8px}.seh-hit{background:#e9f7ef;color:#177447}.seh-miss{background:#fdebed;color:#b42334}.seh-nopoll{background:#eef1f5;color:#657387}.seh-wrong{color:#b42334;font-weight:900}.seh-error{font:900 16px/1 Georgia,serif}.seh-source{margin:24px 0 0;padding-top:18px;border-top:1px solid #dce3ed;font:600 11px/1.5 Inter,system-ui,sans-serif;color:#6b788b}.seh-source a{color:#315f9e;font-weight:800}
      @media(max-width:850px){#page-errors .seh-stats{grid-template-columns:repeat(2,1fr)}#page-errors .seh-swing-grid{grid-template-columns:1fr 1fr}#page-errors .seh-controls{grid-template-columns:1fr 1fr}#page-errors .seh-row{grid-template-columns:58px 1fr 82px;gap:8px}.seh-row .seh-poll,.seh-row .seh-result{grid-column:2}.seh-row .seh-error{grid-column:3;grid-row:1}.seh-row .seh-status{grid-column:3}.seh-row{align-items:start}}
      @media(max-width:520px){#page-errors .seh-swing-grid{grid-template-columns:1fr}#page-errors .seh-controls{grid-template-columns:1fr}#page-errors .seh-row{padding:12px}}
    `; document.head.appendChild(s);
  }

  function stat(label,value){return `<div class="seh-stat"><span>${esc(label)}</span><b>${esc(value)}</b></div>`}
  function card(r){
    const status=r.status==='HIT'?'<span class="seh-badge seh-hit">HIT</span>':r.status==='MISS'?'<span class="seh-badge seh-miss">MISS</span>':'<span class="seh-badge seh-nopoll">NO POLLING</span>';
    const poll=r.pollCount?`${esc(r.pollLeader)} +${fmt(r.pollMargin)} <small>(${r.pollCount} poll${r.pollCount===1?'':'s'})</small>`:'No qualifying public polls';
    const result=r.winner?`${esc(r.winner)} +${fmt(r.actualMargin)}`:'Official result unavailable';
    return `<div class="seh-row" data-state="${esc(r.state)}" data-year="${esc(r.year)}" data-status="${esc(r.status)}" data-error="${Number(r.error||-1)}">
      <div class="seh-year">${esc(r.year)}</div>
      <div class="seh-match"><span class="seh-label">Matchup</span>${esc(r.matchup||'—')}${r.stage==='runoff'?'<br><small>Deciding runoff</small>':''}</div>
      <div class="seh-poll"><span class="seh-label">Final polling avg.</span>${poll}</div>
      <div class="seh-result"><span class="seh-label">Result</span>${result}${r.wrongWinner?'<br><small class="seh-wrong">Poll average picked the wrong winner</small>':''}</div>
      <div class="seh-error"><span class="seh-label">Error</span>${r.error!=null?fmt(r.error)+' pts':'—'}</div>
      <div class="seh-status">${status}</div>
    </div>`;
  }

  function render(){
    if(!data||rendering) return; const root=document.getElementById('page-errors'); if(!root) return;
    rendering=true; style();
    const st=data.stats;
    const swing=data.records.filter(r=>r.swing2026&&r.status==='MISS').sort((a,b)=>(b.error||0)-(a.error||0));
    const states=[...new Set(data.records.map(r=>r.state))].sort((a,b)=>data.records.find(r=>r.state===a).stateName.localeCompare(data.records.find(r=>r.state===b).stateName));
    root.innerHTML=`<div class="content"><div class="seh-wrap">
      <section class="seh-hero"><div class="seh-kicker">2026 seats only · historical backtest</div><h1 class="seh-title">Past Senate Polling Hits & Misses</h1><div class="seh-sub">Every 21st-century election cycle for the Senate seats that are actually on the ballot in 2026. Seats not up in 2026 have been removed. A <b>Hit</b> means the final polling average picked the winner and finished within ${fmt(st.hitThreshold)} points of the final margin; everything else is a <b>Miss</b>. Cycles with no qualifying public polling stay visible but are excluded from accuracy stats.</div></section>
      <div class="seh-stats">${stat('2026 states',st.states)}${stat('Seat cycles',st.seatCycles)}${stat('Scored races',st.scored)}${stat('Hits',st.hits)}${stat('Misses',st.misses)}${stat('Avg. error',fmt(st.avgAbsError)+' pts')}</div>
      <section class="seh-swing"><h2>Swing-State Misses</h2><div class="seh-note">Historical misses from the current 2026 battleground group: AK, GA, IA, KS, ME, MI, MN, NE, NH, NC, OH and TX.</div><div class="seh-swing-grid">${swing.map(r=>`<div class="seh-mini"><strong>${esc(r.stateName)} ${esc(r.year)} · ${fmt(r.error)}-pt miss</strong><small>${esc(r.pollLeader)} +${fmt(r.pollMargin)} in the final average → ${esc(r.winner)} +${fmt(r.actualMargin)} in the result${r.wrongWinner?' · wrong winner':''}</small></div>`).join('')||'<div class="seh-note">No swing-state misses under the current definition.</div>'}</div></section>
      <section class="seh-all"><h2>All 2026-Seat History</h2><div class="seh-note">Four previous cycles for each seat: Class II seats use 2002, 2008, 2014 and 2020; the Florida and Ohio Class III special seats use 2004, 2010, 2016 and 2022.</div>
      <div class="seh-controls"><input id="sehSearch" placeholder="Search state, candidate or year"><select id="sehState"><option value="">All states</option>${states.map(ab=>`<option value="${ab}">${esc(data.records.find(r=>r.state===ab).stateName)}</option>`).join('')}</select><select id="sehStatus"><option value="">All results</option><option>MISS</option><option>HIT</option><option>NO POLLING</option></select><select id="sehSort"><option value="state">State / year</option><option value="newest">Newest first</option><option value="error">Largest error</option></select></div>
      <div id="sehList"></div></section>
      <div class="seh-source"><b>Sources & method:</b> ${data.sources.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a> — ${esc(s.note)}`).join(' &nbsp; · &nbsp; ')}<br>Older cycles use the Stanford final-three-week polling dataset; 2016–2022 use RCP-listed polls ending in the final 21 days. Georgia 2020 uses the published RCP Class II runoff aggregate so the two simultaneous Georgia Senate races are not mixed.</div>
    </div></div>`;

    function list(){
      const q=(document.getElementById('sehSearch')?.value||'').toLowerCase().trim(), state=document.getElementById('sehState')?.value||'', status=document.getElementById('sehStatus')?.value||'', sort=document.getElementById('sehSort')?.value||'state';
      let rows=data.records.filter(r=>(!state||r.state===state)&&(!status||r.status===status)&&(!q||JSON.stringify(r).toLowerCase().includes(q)));
      if(sort==='newest') rows.sort((a,b)=>b.year-a.year||a.stateName.localeCompare(b.stateName));
      else if(sort==='error') rows.sort((a,b)=>(b.error??-1)-(a.error??-1)||b.year-a.year);
      else rows.sort((a,b)=>a.stateName.localeCompare(b.stateName)||a.year-b.year);
      const box=document.getElementById('sehList'); if(!box)return;
      if(sort==='state'){
        const by={}; rows.forEach(r=>(by[r.state]||(by[r.state]=[])).push(r));
        box.innerHTML=Object.keys(by).map(ab=>`<section class="seh-state"><div class="seh-state-head"><h3>${esc(by[ab][0].stateName)}</h3><span>${by[ab][0].seatClass} · ${by[ab][0].swing2026?'2026 battleground':'2026 seat'}</span></div>${by[ab].map(card).join('')}</section>`).join('')||'<div class="seh-note">No races match these filters.</div>';
      }else box.innerHTML=`<section class="seh-state">${rows.map(card).join('')}</section>`;
    }
    ['sehSearch','sehState','sehStatus','sehSort'].forEach(id=>document.getElementById(id)?.addEventListener(id==='sehSearch'?'input':'change',list)); list();

    // Keep the homepage methodology claim accurate after narrowing the historical database to 2026 seats.
    const home=document.getElementById('page-home');
    if(home) for(const el of home.querySelectorAll('*')) if(!el.children.length&&/every U\.S\. Senate polling miss of the 21st century/i.test(el.textContent||'')) el.textContent='Uses the complete 21st-century polling history of every U.S. Senate seat up for election in 2026 to inform the model.';
    rendering=false;
  }

