name: Rebuild 2026 Senate polling history
on:
  push:
    paths:
      - 'tools/build_2026_senate_history.py'
      - '.github/workflows/rebuild-2026-senate-history.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate historical Senate dataset
        run: python3 tools/build_2026_senate_history.py
      - name: Validate output
        run: |
          test -s senate-error-history-data.json
          grep -q 'senate-error-history.js?v=20260909-2305' index.html
          python3 -c "import json; d=json.load(open('senate-error-history-data.json')); assert len(d['records'])==140; assert [r['year'] for r in d['records'] if r['state']=='ME']==[2002,2008,2014,2020]"
      - name: Commit generated data and loader
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add senate-error-history-data.json index.html
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild polling history for 2026 Senate seats"
          git push
