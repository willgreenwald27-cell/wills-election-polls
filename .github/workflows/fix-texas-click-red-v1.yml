name: Fix Texas click red and popup explanation

on:
  push:
    paths:
      - 'fix-texas-click-red.trigger'

permissions:
  contents: write

jobs:
  patch-loader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load fresh Texas stability scripts last
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text()

          s2,n=re.subn(r'senate-history-context\.js\?v=[0-9-]+','senate-history-context.js?v=20260916-2142',s)
          if n<1:
              raise SystemExit('No senate-history-context loader references found')
          s=s2

          if 'senate-click-stability.js?v=20260916-2142' not in s:
              if 'senate-click-stability.js?v=20260916-2135' in s:
                  s=s.replace('senate-click-stability.js?v=20260916-2135','senate-click-stability.js?v=20260916-2142')
              else:
                  marker='document.open();document.write(h);document.close()'
                  if marker not in s:
                      raise SystemExit('Loader document.open marker not found')
                  inject="h=h.replace('</body>','<script src=\"/senate-click-stability.js?v=20260916-2142\"><\\/script></body>');"
                  s=s.replace(marker,inject+marker,1)

          p.write_text(s)
          PY
      - name: Commit loader fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fully disable stale Texas red cache path'
          git push
