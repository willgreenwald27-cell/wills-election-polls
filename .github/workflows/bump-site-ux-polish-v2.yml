name: Bump stabilized Senate script caches
on:
  push:
    paths:
      - '.github/workflows/bump-site-ux-polish-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump stabilized Senate scripts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          s,n1=re.subn(r'senate-color-polish\.js\?v=[0-9A-Za-z._-]+','senate-color-polish.js?v=20260916-001',s,count=1)
          s,n2=re.subn(r'site-ux-polish\.js\?v=[0-9A-Za-z._-]+','site-ux-polish.js?v=20260916-001',s,count=1)
          if n1!=1 or n2!=1:
              raise SystemExit(f'loader refs not found exactly once: color={n1}, ux={n2}')
          p.write_text(s)
          PY
      - name: Commit cache bump
        shell: bash
        run: |
          git config user.name 'Will Election Polls Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Bump stabilized Senate script caches'
          git pull --rebase origin main
          git push
