name: Bump site UX polish v2
on:
  push:
    paths:
      - '.github/workflows/bump-site-ux-polish-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump Senate placement fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          old=s
          s,n=re.subn(r'site-ux-polish\.js\?v=[0-9A-Za-z._-]+','site-ux-polish.js?v=20260913-2136',s,count=1)
          if n!=1:
              raise SystemExit('site-ux-polish loader not found exactly once')
          if s!=old:
              p.write_text(s)
          PY
      - name: Commit production update
        shell: bash
        run: |
          git config user.name 'Will Election Polls Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Bump Senate party placement fix'
          git push
