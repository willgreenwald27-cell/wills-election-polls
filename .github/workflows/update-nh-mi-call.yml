name: Update New Hampshire and Michigan forecasts
on:
  push:
    paths:
      - '.github/workflows/update-nh-mi-call.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update NH rating and refresh forecast script
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          old="stateData.NH.rating='tilt-d'"
          if old not in s:
              raise SystemExit('NH tilt-d loader override not found')
          s=s.replace(old,"stateData.NH.rating='likely-d'",1)
          s,n=re.subn(r'sep9-polls-update\.js\?v=[0-9-]+','sep9-polls-update.js?v=20260909-1426',s)
          if n!=1:
              raise SystemExit(f'expected 1 sep9 updater cache key, found {n}')
          p.write_text(s)
      - name: Validate loader
        shell: python
        run: |
          from pathlib import Path
          s=Path('index.html').read_text()
          assert "stateData.NH.rating='likely-d'" in s
          assert 'sep9-polls-update.js?v=20260909-1426' in s
          assert "const files=['d0.txt','d1.txt','d2.txt','d3.txt','d4.txt','d5.txt','d6.txt','d7.txt','d8a.txt','d8b.txt','d9.txt']" in s
          assert 'document.open();document.write(h);document.close()' in s
      - name: Commit site update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/update-nh-mi-call.yml
          git add index.html .github/workflows/update-nh-mi-call.yml
          git commit -m "Set New Hampshire likely Democratic and refresh Michigan call"
          git push
