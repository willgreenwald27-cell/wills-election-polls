name: Remove homepage forecasts v2
on:
  push:
    paths:
      - '.github/workflows/remove-home-forecasts-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/remove_home_forecasts.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/remove-home-forecasts-v2.yml
          rm -f .github/workflows/remove-home-forecasts-v1.yml
          rm -f .github/scripts/remove_home_forecasts.py
          git add sep9-polls-update.js index.html .github/workflows/remove-home-forecasts-v2.yml .github/workflows/remove-home-forecasts-v1.yml .github/scripts/remove_home_forecasts.py
          git commit -m "Remove House and Senate forecasts from homepage"
          git push
