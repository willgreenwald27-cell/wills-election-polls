name: Refresh final Senate label script
on:
  push:
    paths:
      - '.github/workflows/cache-bust-history-context-final.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Refresh final script reference
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='senate-history-context.js?v=20260912-1257'
          new='senate-history-context.js?v=20260913-2120'
          if old not in s: raise SystemExit('final history context ref not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name 'Will Election Polls Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Refresh final Senate label script cache'
          git push origin main
