name: Cache bust Ohio tossup
on:
  push:
    paths:
      - '.github/workflows/cache-bust-ohio-tossup.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Refresh Senate sync script version
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = 'senate-current-sync.js?v=20260911-0035'
          new = 'senate-current-sync.js?v=20260911-1327'
          if old not in s:
              raise SystemExit('old cache version not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name 'Will Election Polls Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Refresh Ohio tossup and Senate balance cache'
          git push origin main
