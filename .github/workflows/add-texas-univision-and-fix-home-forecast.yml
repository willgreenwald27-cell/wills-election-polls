name: Add Texas Univision poll and fix homepage forecast cards
on:
  push:
    paths:
      - '.github/workflows/add-texas-univision-and-fix-home-forecast.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Texas poll, averages, counts, and homepage layout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('sep9-polls-update.js')
          s=p.read_text()

          # Texas RCP average after the new Univision/YouGov poll.
          anchor="    changed=setCandidatePoll('ME','collins','45.8')||changed;"
          if "setCandidatePoll('TX','talarico','47.3')" not in s:
              s=s.replace(anchor, anchor+"\n    changed=setCandidatePoll('TX','talarico','47.3')||changed;\n    changed=setCandidatePoll('TX','paxton','44.9')||changed;", 1)

          # Add the new poll to the native New Polls feed.
          native_anchor="      add({date:'2026-09-09',state:'ME',pollster:'CNN',sample:'',c1:'Troy Jackson',c1Pct:'48',c2:'Susan Collins',c2Pct:'45',notes:'RealClearPolling listing · Jackson +3'});"
          tx_native="      add({date:'2026-09-09',state:'TX',pollster:'Univision',sample:'1,000 RV',c1:'James Talarico',c1Pct:'48',c2:'Ken Paxton',c2Pct:'43',notes:'N+ Univision/YouGov · Aug. 27–Sep. 4 · Talarico +5'});"
          if tx_native not in s:
              s=s.replace(native_anchor, native_anchor+'\n'+tx_native, 1)

          # Add the poll to the archive view.
          archive_anchor="    if(filter==='ALL'||filter==='MI') list.prepend(row('MI','Michigan','CNN','Abdul El-Sayed',47,'Mike Rogers',44));"
          tx_archive="    if(filter==='ALL'||filter==='TX') list.prepend(row('TX','Texas','Univision','James Talarico',48,'Ken Paxton',43));"
          if tx_archive not in s:
              s=s.replace(archive_anchor, archive_anchor+'\n'+tx_archive, 1)

          # Poll archive total: 93.
          s=s.replace("if(sub) sub.textContent='92 public general-election matchup polls and snapshots from July 7 through September 9, including alternate matchups that were publicly tested during the period.';",
                      "if(sub) sub.textContent='93 public general-election matchup polls and snapshots from July 7 through September 9, including alternate matchups that were publicly tested during the period.';")

          # Count actual visible archive rows rather than repeatedly adding extras.
          s=re.sub(r"const base=Number\(\(count\.textContent\.match\(/\\d\+/\)\|\|\[\]\)\[0\]\|\|0\);\n\s*const extra=filter==='ALL'\?2:\(\(filter==='MI'\|\|filter==='ME'\)\?1:0\);\n\s*const total=base\+extra;",
                   "const total=list.querySelectorAll('.jp-row').length;", s)

          # Make homepage House and Senate exactly 50/50 and the same aspect ratio.
          s=s.replace("#homeForecastSplit{display:grid;grid-template-columns:minmax(0,42fr) minmax(0,58fr);gap:18px;align-items:stretch;width:100%}",
                      "#homeForecastSplit{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:stretch;width:100%}")
          s=s.replace("#homeForecastSplit .forecast-card{border:1px solid #dde3ec;border-radius:20px;background:#fff;box-shadow:0 10px 28px rgba(20,34,53,.08);overflow:hidden;min-width:0}",
                      "#homeForecastSplit .forecast-card{border:1px solid #dde3ec;border-radius:20px;background:#fff;box-shadow:0 10px 28px rgba(20,34,53,.08);overflow:hidden;min-width:0;aspect-ratio:1672/941}")
          s=s.replace("#homeForecastSplit .senate-card{position:relative;padding:28px 30px 25px;background:linear-gradient(135deg,#f7faff 0%,#fff 56%,#fff6f7 100%);display:flex;flex-direction:column;justify-content:center;min-height:340px}",
                      "#homeForecastSplit .senate-card{position:relative;padding:22px 24px 20px;background:linear-gradient(135deg,#f7faff 0%,#fff 56%,#fff6f7 100%);display:flex;flex-direction:column;justify-content:center;min-height:0;box-sizing:border-box}")
          s=s.replace("#homeForecastSplit .senate-title{font:800 clamp(32px,4vw,54px)/1 Georgia,serif;color:#17263d;margin:0 0 22px}",
                      "#homeForecastSplit .senate-title{font:800 clamp(28px,3.2vw,46px)/1 Georgia,serif;color:#17263d;margin:0 0 16px}")
          s=s.replace("#homeForecastSplit .party-number{font:900 clamp(58px,7vw,92px)/.9 Georgia,serif;margin-top:7px}",
                      "#homeForecastSplit .party-number{font:900 clamp(52px,5.2vw,78px)/.9 Georgia,serif;margin-top:7px}")
          s=s.replace("#homeForecastSplit .senate-bar{height:24px", "#homeForecastSplit .senate-bar{height:20px")

          # Keep poll count current anywhere it still appears.
          s=s.replace("if(t==='90'&&/poll/i.test(norm(el.parentElement?.textContent))) el.textContent='92';",
                      "if(/^\\d+$/.test(t)&&/polls entered/i.test(norm(el.parentElement?.textContent))) el.textContent='93';")
          s=s.replace("if(/\\b90\\s+polls?\\b/i.test(t)) el.textContent=t.replace(/\\b90(?=\\s+polls?\\b)/i,'92');\n        else if(t==='90'&&/poll/i.test(norm(el.parentElement?.textContent))) el.textContent='92';",
                      "if(/\\b(?:90|92)\\s+polls?\\b/i.test(t)) el.textContent=t.replace(/\\b(?:90|92)(?=\\s+polls?\\b)/i,'93');\n        else if(/^(?:90|92)$/.test(t)&&/poll/i.test(norm(el.parentElement?.textContent))) el.textContent='93';")

          p.write_text(s)

          # Cache-bust the updated script safely.
          idx=Path('index.html')
          i=idx.read_text()
          i,n=re.subn(r'sep9-polls-update\.js\?v=[0-9-]+','sep9-polls-update.js?v=20260909-1815',i)
          if n != 1:
              raise SystemExit(f'expected one sep9 updater cache key, found {n}')
          idx.write_text(i)

          out=p.read_text()
          assert "setCandidatePoll('TX','talarico','47.3')" in out
          assert "pollster:'Univision'" in out
          assert "grid-template-columns:repeat(2,minmax(0,1fr))" in out
          assert "aspect-ratio:1672/941" in out
          assert 'sep9-polls-update.js?v=20260909-1815' in idx.read_text()
          PY
      - name: Commit update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/add-texas-univision-and-fix-home-forecast.yml
          git add sep9-polls-update.js index.html .github/workflows/add-texas-univision-and-fix-home-forecast.yml
          git commit -m "Add Univision Texas poll and equalize homepage forecast cards"
          git push
