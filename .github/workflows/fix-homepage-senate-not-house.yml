name: Fix Homepage Senate Not House

on:
  push:
    paths:
      - '.github/workflows/fix-homepage-senate-not-house.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Senate-only homepage fix
        shell: bash
        run: |
          sed -i 's/fixHomeSenateCount();//g' site-ux-polish.js
          if ! grep -q 'wg-home-senate-direct-v4' site-ux-polish.js; then
            cat >> site-ux-polish.js <<'EOF'

/* wg-home-senate-direct-v4 */
(()=>{
  const txt=e=>String(e?.textContent||'').replace(/\s+/g,' ').trim();
  const leaves=r=>r?[...r.querySelectorAll('*')].filter(e=>e.children.length===0):[];
  function fix(){
    const root=document.getElementById('page-home');
    if(!root)return;
    const senateLabels=leaves(root).filter(e=>/senate/i.test(txt(e)));
    let card=null;
    for(const label of senateLabels){
      let node=label.parentElement;
      for(let i=0;node&&node!==root&&i<12;i++,node=node.parentElement){
        const t=txt(node);
        if(!/senate/i.test(t)||/house/i.test(t))continue;
        const fifties=leaves(node).filter(e=>txt(e)==='50');
        if(fifties.length>=2){card=node;break;}
      }
      if(card)break;
    }
    if(!card)return;
    const fifties=leaves(card).filter(e=>txt(e)==='50');
    if(fifties.length>=2){
      fifties[0].textContent='51';
      fifties[1].textContent='49';
    }
    for(const el of leaves(card)){
      const t=txt(el);
      if(/^Democrats?\s*:?\s*50$/i.test(t))el.textContent=t.replace(/50$/,'51');
      if(/^Republicans?\s*:?\s*50$/i.test(t))el.textContent=t.replace(/50$/,'49');
      if(/^50\s+seats$/i.test(t)){
        const p=txt(el.parentElement);
        if(/Democrat/i.test(p))el.textContent='51 seats';
        else if(/Republican/i.test(p))el.textContent='49 seats';
      }
    }
  }
  fix();
  [50,150,400,900,1800,3200].forEach(ms=>setTimeout(fix,ms));
  setInterval(fix,800);
  new MutationObserver(fix).observe(document.body,{childList:true,subtree:true,characterData:true});
})();
EOF
          fi
          sed -i -E 's/site-ux-polish\.js\?v=[0-9A-Za-z._-]+/site-ux-polish.js?v=20260916-2112/g' index.html
      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site-ux-polish.js index.html
          git commit -m 'Fix homepage Senate 51-49 only' || exit 0
          git push
