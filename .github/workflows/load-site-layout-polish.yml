name: Load site layout polish
on:
  push:
    paths:
      - 'tools/load-site-layout-polish.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add final layout polish loader
        run: |
          python tools/load-site-layout-polish.py
          node --check site-layout-polish.js
      - name: Commit production loader and clean helper files
        run: |
          git config user.name 'Will Election Polls Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f tools/load-site-layout-polish.py .github/workflows/load-site-layout-polish.yml
          git add index.html site-layout-polish.js
          git commit -m 'Apply polished Senate and site spacing'
          git push origin main
