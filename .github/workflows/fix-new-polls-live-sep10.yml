name: Fix Sep 10 polls on New Polls
on:
  push:
    paths:
      - '.github/workflows/fix-new-polls-live-sep10.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make latest polls authoritative in archive
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) Put all Sep 8-10 additions into the archive's real POLLS source.
          p=Path('senate-julsep-archive.js')
          s=p.read_text()
          marker="  const POLLS=[\n"
          rows=(
          "['2026-09-10','MI','Michigan','Trafalgar Group*','Abdul El-Sayed',46,'Mike Rogers',45,'RCP'],\n"
          "['2026-09-10','SC','South Carolina','InsiderAdvantage','Graham Nordone',45,'Annie Andrews',43,'RCP'],\n"
          "['2026-09-10','OH','Ohio','InsiderAdvantage','Sherrod Brown',47,'Jon Husted',42,'RCP'],\n"
          "['2026-09-09','MI','Michigan','CNN','Abdul El-Sayed',47,'Mike Rogers',44,'RCP'],\n"
          "['2026-09-09','ME','Maine','CNN','Troy Jackson',48,'Susan Collins',45,'RCP'],\n"
          "['2026-09-09','TX','Texas','Fabrizio/Anzalone','James Talarico',48,'Ken Paxton',44,'RCP'],\n"
          "['2026-09-09','ME','Maine','YouGov','Troy Jackson',48,'Susan Collins',44,'RCP'],\n"
          "['2026-09-09','NC','North Carolina','Elon University*','Roy Cooper',49,'Michael Whatley',38,'RCP'],\n"
          "['2026-09-08','TX','Texas','Univision','James Talarico',48,'Ken Paxton',43,'RCP'],\n"
          )
          if "['2026-09-10','MI','Michigan','Trafalgar Group*'" not in s:
              if marker not in s:
                  raise SystemExit('archive POLLS marker missing')
              s=s.replace(marker, marker+rows, 1)
          s=s.replace('90 public general-election matchup polls and snapshots from July 7 through September 8',
                      '99 public general-election matchup polls and snapshots from July 7 through September 10')
          p.write_text(s)

          # 2) Stop the later patch from manually prepending duplicate DOM-only rows.
          p=Path('sep9-polls-update.js')
          s=p.read_text()
          old="  function ensureArchiveRows(){\n    const sec=document.getElementById('julsepPollArchive'); if(!sec) return;"
          new="  function ensureArchiveRows(){\n    return;\n    const sec=document.getElementById('julsepPollArchive'); if(!sec) return;"
          if old in s:
              s=s.replace(old,new,1)
          elif "function ensureArchiveRows(){\n    return;" not in s:
              raise SystemExit('ensureArchiveRows anchor missing')
          p.write_text(s)

          # 3) Cache-bust both scripts so phones/desktops receive the corrected source.
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('/senate-julsep-archive.js?v=20260910-1922','/senate-julsep-archive.js?v=20260911-0015')
          s=s.replace('/sep9-polls-update.js?v=20260910-1938','/sep9-polls-update.js?v=20260911-0015')
          p.write_text(s)
          PY
          node --check senate-julsep-archive.js
          node --check sep9-polls-update.js
          grep -q "2026-09-10','MI','Michigan','Trafalgar Group\*'" senate-julsep-archive.js
          grep -q "2026-09-10','SC','South Carolina','InsiderAdvantage'" senate-julsep-archive.js
          grep -q "2026-09-10','OH','Ohio','InsiderAdvantage'" senate-julsep-archive.js
          grep -q "99 public general-election matchup polls" senate-julsep-archive.js
          grep -q "senate-julsep-archive.js?v=20260911-0015" index.html
      - name: Commit production fix
        shell: bash
        run: |
          git config user.name 'Will Election Polls Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add senate-julsep-archive.js sep9-polls-update.js index.html
          git commit -m 'Fix latest Senate polls on New Polls page'
          git push
