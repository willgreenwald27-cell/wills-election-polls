name: Fix party color semantics v5
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-party-color-semantics-v5.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply party-color semantics patch
        run: python .github/scripts/fix_party_color_semantics_v5.py
      - name: Validate JavaScript
        run: node --check senate-error-history.js
      - name: Commit production update
        run: |
          git config user.name 'Will Election Polls Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add senate-error-history.js
          git diff --cached --quiet && exit 0
          git commit -m 'Color polling and result panels by candidate party'
          git push origin main
