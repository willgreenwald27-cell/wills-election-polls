name: Apply SEO v63

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-seo:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply SEO metadata and homepage search copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          if "<!-- SEO-V63 -->" not in s:
              old_title = "<title>Will's Election Polls and Predictions</title>"
              new_head = """<!-- SEO-V63 --><title>2026 Election Polls &amp; Senate Forecasts | Will's Election Polls</title><meta name=\"description\" content=\"2026 U.S. election polls, Senate polling averages, forecasts and race probabilities. Explore interactive election maps and a model incorporating historical Senate polling errors.\"><meta name=\"robots\" content=\"index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1\"><meta name=\"googlebot\" content=\"index,follow\"><link rel=\"canonical\" href=\"https://willelectionpolls.com/\"><meta property=\"og:title\" content=\"2026 Election Polls &amp; Senate Forecasts | Will's Election Polls\"><meta property=\"og:description\" content=\"2026 U.S. election polls, Senate polling averages, forecasts and race probabilities, with interactive maps and historical polling-error context.\"><meta property=\"og:url\" content=\"https://willelectionpolls.com/\"><meta property=\"og:type\" content=\"website\"><meta property=\"og:site_name\" content=\"Will's Election Polls and Predictions\"><meta name=\"twitter:card\" content=\"summary\">"""
              if old_title not in s:
                  raise SystemExit("Expected page title not found")
              s = s.replace(old_title, new_head, 1)

          if "seoRuntimeV63" not in s:
              hook = 'document.body.classList.remove("edit-mode");'
              runtime = 'const seoRuntimeV63=true;document.title="2026 Election Polls & Senate Forecasts | Will\\u0027s Election Polls";function seoSetMetaV63(k,v,a){let m=[...document.head.querySelectorAll("meta")].find(x=>x.getAttribute(a)===k);if(!m){m=document.createElement("meta");m.setAttribute(a,k);document.head.appendChild(m)}m.setAttribute("content",v)}seoSetMetaV63("description","2026 U.S. election polls, Senate polling averages, forecasts and race probabilities. Explore interactive election maps and a model incorporating historical Senate polling errors.","name");seoSetMetaV63("robots","index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1","name");seoSetMetaV63("googlebot","index,follow","name");seoSetMetaV63("og:title","2026 Election Polls & Senate Forecasts | Will\\u0027s Election Polls","property");seoSetMetaV63("og:description","2026 U.S. election polls, Senate polling averages, forecasts and race probabilities, with interactive maps and historical polling-error context.","property");seoSetMetaV63("og:url","https://willelectionpolls.com/","property");seoSetMetaV63("og:type","website","property");let seoCanonicalV63=document.head.querySelector("link[rel=canonical]");if(!seoCanonicalV63){seoCanonicalV63=document.createElement("link");seoCanonicalV63.rel="canonical";document.head.appendChild(seoCanonicalV63)}seoCanonicalV63.href="https://willelectionpolls.com/";if(!document.getElementById("seoSchemaV63")){let q=document.createElement("script");q.id="seoSchemaV63";q.type="application/ld+json";q.textContent=JSON.stringify({"@context":"https://schema.org","@type":"WebSite","name":"Will\\u0027s Election Polls and Predictions","alternateName":"Will\\u0027s Election Polls","url":"https://willelectionpolls.com/","description":"2026 U.S. election polls, Senate polling averages, forecasts, race probabilities, interactive election maps, and historical Senate polling-error analysis."});document.head.appendChild(q)}const seoEyebrowV63=document.querySelector("#page-home .reference-eyebrow");if(seoEyebrowV63)seoEyebrowV63.textContent="2026 U.S. ELECTION POLLS & FORECASTS";const seoHeroIntroV63=document.querySelector("#page-home .reference-hero-copy>p");if(seoHeroIntroV63)seoHeroIntroV63.textContent="2026 U.S. election polls, Senate polling averages, forecasts, and race-by-race predictions for a clearer understanding of what’s next.";const seoBottomV63=document.querySelector("#page-home .reference-bottom");if(seoBottomV63&&!document.getElementById("homeSeoIntroV63")){const z=document.createElement("section");z.id="homeSeoIntroV63";z.setAttribute("aria-label","2026 election polling and forecasts");z.style.cssText="margin:0 0 22px;padding:0 2px;max-width:900px";const a=document.createElement("h2");a.textContent="2026 Election Polls, Senate Forecasts & Polling Averages";a.style.cssText="margin:0 0 7px;font-family:Georgia,serif;font-size:22px;letter-spacing:-.3px";const b=document.createElement("p");b.textContent="Track the latest 2026 Senate polls, polling averages, race ratings, election forecasts, betting-market context, and historical Senate polling misses in one interactive election dashboard.";b.style.cssText="margin:0;color:#66758a;font-size:13px;line-height:1.6";z.appendChild(a);z.appendChild(b);seoBottomV63.parentNode.insertBefore(z,seoBottomV63)}'
              if hook not in s:
                  raise SystemExit("Public-view hook not found")
              s = s.replace(hook, hook + runtime, 1)

          p.write_text(s, encoding="utf-8")

          Path("sitemap.xml").write_text('''<?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url>
              <loc>https://willelectionpolls.com/</loc>
              <changefreq>daily</changefreq>
              <priority>1.0</priority>
            </url>
            <url>
              <loc>https://willelectionpolls.com/governor.html</loc>
              <changefreq>daily</changefreq>
              <priority>0.8</priority>
            </url>
          </urlset>
          ''', encoding="utf-8")

          Path("robots.txt").write_text('''User-agent: *
          Allow: /

          Sitemap: https://willelectionpolls.com/sitemap.xml
          ''', encoding="utf-8")
          PY

      - name: Commit SEO update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/apply-seo-v63.yml
          git add index.html sitemap.xml robots.txt
          git diff --cached --quiet || git commit -m "Add SEO metadata and election search content"
          git push
