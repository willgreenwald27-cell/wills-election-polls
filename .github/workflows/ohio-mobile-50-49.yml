name: Ohio mobile 50-49 fix

on:
  push:
    paths:
      - '.github/workflows/ohio-mobile-50-49.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 .github/scripts/ohio_mobile_50_49.py
      - name: Commit changes
        run: |
          git config user.name "Will Election Polls Bot"
          git config user.email "actions@users.noreply.github.com"
          git add site-final.js senate-current-sync.js senate-history-context.js index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix Ohio mobile call and Senate 50-49 totals"
          git push

# retrigger after workflow syntax repair
