name: Ohio mobile 50-49 fix
on:
  push:
    paths:
      - '.github/workflows/ohio-mobile-50-49.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted Ohio mobile and 50-49 fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def repl(path, old, new, label):
              p=Path(path); s=p.read_text()
              if old not in s:
                  raise SystemExit(f'{label}: pattern not found in {path}')
              p.write_text(s.replace(old,new,1))

          # 1) Keep the early/final override aligned: Ohio blue, Texas tossup, 50D-49R.
          p=Path('site-final.js'); s=p.read_text()
          old="""      if(stateData.NH&&stateData.NH.active) stateData.NH.rating='tilt-d';
"""
          new="""      if(stateData.NH&&stateData.NH.active) stateData.NH.rating='tilt-d';
      if(stateData.OH&&stateData.OH.active){
        stateData.OH.rating='tilt-d';
        stateData.OH.predictionParty='Democratic';
        stateData.OH.prediction='Tilt Democratic';
        stateData.OH.notes='';
        for(const k of ['projectedWinner','predictionWinner','winner','callParty']) if(k in stateData.OH) stateData.OH[k]='Democratic';
        if('call' in stateData.OH) stateData.OH.call='Tilt Democratic';
      }
      if(stateData.TX&&stateData.TX.active){
        stateData.TX.rating='tossup';
        stateData.TX.predictionParty='Tossup';
        stateData.TX.prediction='Tossup';
        stateData.TX.notes='';
        for(const k of ['projectedWinner','predictionWinner','winner','callParty']) if(k in stateData.TX) stateData.TX[k]='Tossup';
        if('call' in stateData.TX) stateData.TX.call='Tossup';
      }
"""
          if old not in s: raise SystemExit('site-final data anchor missing')
          s=s.replace(old,new,1)
          s=s.replace("const value=/^REPUBLICAN$/i.test(t)?'51':'49';","const value=/^REPUBLICAN$/i.test(t)?'49':'50';",1)
          s=s.replace("if(nums[0]) nums[0].textContent='49';\n      if(nums[1]) nums[1].textContent='51';","if(nums[0]) nums[0].textContent='50';\n      if(nums[1]) nums[1].textContent='49';",1)
          s=s.replace("if(/^Democrats?:\\s*50$/i.test(t)) el.textContent=t.replace(/50$/,'49');\n        if(/^Republicans?:\\s*50$/i.test(t)) el.textContent=t.replace(/50$/,'51');","if(/^Democrats?:\\s*\\d+$/i.test(t)) el.textContent=t.replace(/\\d+$/,'50');\n        if(/^Republicans?:\\s*\\d+$/i.test(t)) el.textContent=t.replace(/\\d+$/,'49');",1)
          s=s.replace("if(/Democrat/i.test(parent)) el.textContent='49 seats';\n          if(/Republican/i.test(parent)) el.textContent='51 seats';","if(/Democrat/i.test(parent)) el.textContent='50 seats';\n          if(/Republican/i.test(parent)) el.textContent='49 seats';",1)
          s=s.replace("if(kids[0]) kids[0].style.setProperty('width','49%','important');\n        if(kids[1]) kids[1].style.setProperty('width','51%','important');","if(kids[0]) kids[0].style.setProperty('width','50%','important');\n        if(kids[1]) kids[1].style.setProperty('width','49%','important');\n        if(kids[2]) kids[2].style.setProperty('width','1%','important');",1)
          p.write_text(s)

          # 2) Main current-sync script: make Ohio Tilt D/light blue, keep Texas tossup, remove Ohio explanation,
          # and show 50D-49R + 1 tossup on both Senate page and homepage.
          p=Path('senate-current-sync.js'); s=p.read_text()
          s=s.replace("const TOSSUP='#f2c94c';","const TOSSUP='#f2c94c';\n  const TILT_BLUE='#d3e2f7';\n  const TILT_BLUE_BORDER='#a9c5ed';\n  const BLUE_DARK='#173f87';",1)
          old="""      const oh=stateData.OH;
      if(oh){
        set(oh,'rating','tossup');set(oh,'predictionParty','Tossup');set(oh,'prediction','Tossup');set(oh,'notes','');set(oh,'updated','2026-09-11');
        for(const k of ['projectedWinner','predictionWinner','winner','callParty']) if(k in oh) set(oh,k,'Tossup');
        if('call' in oh) set(oh,'call','Tossup');
      }
"""
          new="""      const oh=stateData.OH;
      if(oh){
        set(oh,'rating','tilt-d');set(oh,'predictionParty','Democratic');set(oh,'prediction','Tilt Democratic');set(oh,'notes','');set(oh,'updated','2026-09-13');
        for(const k of ['projectedWinner','predictionWinner','winner','callParty']) if(k in oh) set(oh,k,'Democratic');
        if('call' in oh) set(oh,'call','Tilt Democratic');
      }
"""
          if old not in s: raise SystemExit('current-sync Ohio data anchor missing')
          s=s.replace(old,new,1)
          s=s.replace("el.style.setProperty('fill',TOSSUP,'important');","el.style.setProperty('fill',TILT_BLUE,'important');",1)
          s=s.replace("el.style.setProperty('background',TOSSUP,'important');","el.style.setProperty('background',TILT_BLUE,'important');",1)
          s=s.replace("if(/^Prediction:\\s*/i.test(t))el.textContent='Prediction: Toss-up';","if(/^Prediction:\\s*/i.test(t))el.textContent='Prediction: Tilt Democratic';",1)
          s=s.replace("if(/^(Republican|Democrat(?:ic)?|TILT REPUBLICAN|LEAN REPUBLICAN|LIKELY REPUBLICAN|SOLID REPUBLICAN)$/i.test(t)){\n          const nearCall=norm(el.parentElement?.textContent||'');\n          if(/WILL[’']S CALL|MY PREDICTION/i.test(nearCall))el.textContent='Tossup';\n        }","if(/^(Republican|Democrat(?:ic)?|Tossup|TILT REPUBLICAN|LEAN REPUBLICAN|LIKELY REPUBLICAN|SOLID REPUBLICAN|TILT DEMOCRAT(?:IC)?)$/i.test(t)){\n          const nearCall=norm(el.parentElement?.textContent||'');\n          if(/WILL[’']S CALL|MY PREDICTION/i.test(nearCall))el.textContent=/TILT/i.test(t)?'TILT DEMOCRATIC':'Democratic';\n        }",1)
          s=s.replace("card.style.setProperty('background',TOSSUP,'important');\n          card.style.setProperty('border-color','#d9ad22','important');\n          card.style.setProperty('color','#fff','important');\n          card.querySelectorAll('*').forEach(el=>el.style.setProperty('color','#fff','important'));","card.style.setProperty('background',TILT_BLUE,'important');\n          card.style.setProperty('background-image','none','important');\n          card.style.setProperty('border-color',TILT_BLUE_BORDER,'important');\n          card.style.setProperty('color',BLUE_DARK,'important');\n          card.querySelectorAll('*').forEach(el=>el.style.setProperty('color',BLUE_DARK,'important'));",1)
          s=s.replace("if(party)party.textContent='Tossup';","if(party)party.textContent='Democratic';",1)
          s=s.replace("if(rating)rating.textContent='TOSSUP';","if(rating)rating.textContent='TILT DEMOCRATIC';",1)
          s=s.replace("const copy=card.querySelector('.prediction-copy');if(copy)copy.textContent='Tossup';","const copy=card.querySelector('.prediction-copy');if(copy)copy.textContent='Tilt Democratic';",1)
          s=s.replace("if(n)n.textContent=/^REPUBLICAN$/i.test(t)?'50':'49';","if(n)n.textContent=/^REPUBLICAN$/i.test(t)?'49':'50';",1)
          s=s.replace("if(/^0\\s+INDEPENDENT$/i.test(t)||/^0\\s+TOSSUP$/i.test(t))el.textContent='1 TOSSUP';","if(/^\\d+\\s+(?:INDEPENDENT|TOSSUPS?)$/i.test(t))el.textContent='1 TOSSUP';",1)
          s=s.replace("if(d)d.style.setProperty('width','49%','important');\n      if(r)r.style.setProperty('width','50%','important');","if(d)d.style.setProperty('width','50%','important');\n      if(r)r.style.setProperty('width','49%','important');",1)
          s=s.replace("if(nums.length>=2){nums[0].textContent='49';nums[1].textContent='50';}","if(nums.length>=2){nums[0].textContent='50';nums[1].textContent='49';}",1)
          s=s.replace("if(/^Democrats?:\\s*50$/i.test(t))el.textContent=t.replace(/50$/,'49');\n      if(/^Republicans?:\\s*51$/i.test(t))el.textContent=t.replace(/51$/,'50');","if(/^Democrats?:\\s*\\d+$/i.test(t))el.textContent=t.replace(/\\d+$/,'50');\n      if(/^Republicans?:\\s*\\d+$/i.test(t))el.textContent=t.replace(/\\d+$/,'49');",1)
          s=s.replace("if(d)d.style.setProperty('width','49%','important');\n      if(r)r.style.setProperty('width','50%','important');","if(d)d.style.setProperty('width','50%','important');\n      if(r)r.style.setProperty('width','49%','important');",1)
          s=s.replace("bar.setAttribute('aria-label','Senate prediction: 49 Democrats, 50 Republicans, and 1 tossup');","bar.setAttribute('aria-label','Senate prediction: 50 Democrats, 49 Republicans, and 1 tossup');",1)
          p.write_text(s)

          # 3) The late history-context script was overwriting the correct totals. Make it agree.
          p=Path('senate-history-context.js'); s=p.read_text()
          s=s.replace("if(n)n.textContent='49';","if(n)n.textContent=/^REPUBLICAN$/i.test(t)?'49':'50';",1)
          s=s.replace("if(/^\\d+\\s+(?:INDEPENDENT|TOSSUPS?)$/i.test(t))el.textContent='2 TOSSUPS';","if(/^\\d+\\s+(?:INDEPENDENT|TOSSUPS?)$/i.test(t))el.textContent='1 TOSSUP';",1)
          s=s.replace("if(d)d.style.setProperty('width','49%','important');\n      if(r)r.style.setProperty('width','49%','important');","if(d)d.style.setProperty('width','50%','important');\n      if(r)r.style.setProperty('width','49%','important');",1)
          s=s.replace("if(y){y.style.setProperty('width','2%','important');","if(y){y.style.setProperty('width','1%','important');",1)
          s=s.replace("if(nums.length>=2){nums[0].textContent='49';nums[1].textContent='49';}","if(nums.length>=2){nums[0].textContent='50';nums[1].textContent='49';}",1)
          s=s.replace("if(/^Democrats?:\\s*\\d+$/i.test(t))el.textContent=t.replace(/\\d+$/,'49');\n      if(/^Republicans?:\\s*\\d+$/i.test(t))el.textContent=t.replace(/\\d+$/,'49');\n      if(/^\\d+\\s+(?:INDEPENDENT|TOSSUPS?)$/i.test(t))el.textContent='2 TOSSUPS';","if(/^Democrats?:\\s*\\d+$/i.test(t))el.textContent=t.replace(/\\d+$/,'50');\n      if(/^Republicans?:\\s*\\d+$/i.test(t))el.textContent=t.replace(/\\d+$/,'49');\n      if(/^\\d+\\s+(?:INDEPENDENT|TOSSUPS?)$/i.test(t))el.textContent='1 TOSSUP';",1)
          s=s.replace("if(d)d.style.setProperty('width','49%','important');\n      if(r)r.style.setProperty('width','49%','important');","if(d)d.style.setProperty('width','50%','important');\n      if(r)r.style.setProperty('width','49%','important');",1)
          s=s.replace("if(y){y.style.setProperty('width','2%','important');","if(y){y.style.setProperty('width','1%','important');",1)
          s=s.replace("bar.setAttribute('aria-label','Senate prediction: 49 Democrats, 49 Republicans, and 2 tossups');","bar.setAttribute('aria-label','Senate prediction: 50 Democrats, 49 Republicans, and 1 tossup');",1)
          s=s.replace("if(note){note.textContent='2 TOSSUPS';","if(note){note.textContent='1 TOSSUP';",1)
          p.write_text(s)

          # 4) Force mobile Safari to fetch the new scripts instead of cached copies.
          p=Path('index.html'); s=p.read_text()
          for name,ver in [
              ('site-final.js','20260913-2350'),
              ('senate-current-sync.js','20260913-2350'),
              ('senate-history-context.js','20260913-2350')]:
              s,n=re.subn(rf'{re.escape(name)}\\?v=[0-9A-Za-z._-]+',f'{name}?v={ver}',s)
              if n<1: raise SystemExit(f'loader not found for {name}')
          p.write_text(s)
          PY
      - name: Commit targeted fix
        shell: bash
        run: |
          git config user.name 'Will Election Polls Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add site-final.js senate-current-sync.js senate-history-context.js index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Ohio mobile call and Senate 50-49 totals'
          git push
