name: Fix Texas Tilt Blue

on:
  push:
    paths:
      - '.github/workflows/fix-texas-tilt-blue-20260916.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make Texas Tilt Democratic everywhere
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Remove the old Texas-red enforcement that was fighting the blue patch.
          p = Path('site-final.js')
          s = p.read_text()
          s = s.replace("stateData.TX.rating='tilt-r'", "stateData.TX.rating='tilt-d'")
          s = s.replace("stateData.TX.predictionParty='Republican'", "stateData.TX.predictionParty='Democratic'")
          s = s.replace("stateData.TX.prediction='Tilt Republican'", "stateData.TX.prediction='Tilt Democratic'")
          s = s.replace("stateData.TX[k]='Republican'", "stateData.TX[k]='Democratic'")
          s = s.replace("stateData.TX.call='Tilt Republican'", "stateData.TX.call='Tilt Democratic'")
          s = s.replace("const value=/^REPUBLICAN$/i.test(t)?'50':'50';", "const value=/^REPUBLICAN$/i.test(t)?'49':'51';")
          p.write_text(s)

          # Align the underlying page source and popup copy with the same rating.
          idx = Path('index.html')
          h = idx.read_text()
          h = h.replace("stateData.TX.rating='tilt-r';stateData.TX.predictionParty='Republican';stateData.TX.callParty='Republican';stateData.TX.prediction='Tilt Republican';", "stateData.TX.rating='tilt-d';stateData.TX.predictionParty='Democratic';stateData.TX.callParty='Democratic';stateData.TX.prediction='Tilt Democratic';")
          h = h.replace("TX:'Tilt Republican'", "TX:'Tilt Democratic'")
          h = re.sub(r"site-final\.js\?v=[A-Za-z0-9._-]+", "site-final.js?v=20260916-1940", h)
          h = re.sub(r"senate-current-sync\.js\?v=[A-Za-z0-9._-]+", "senate-current-sync.js?v=20260916-1940", h)
          idx.write_text(h)
          PY
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-texas-tilt-blue-20260916.yml
          git add site-final.js index.html
          git commit -m 'Set Texas to Tilt Democratic consistently' || exit 0
          git push
