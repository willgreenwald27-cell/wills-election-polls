name: Fit Senate map desktop
on:
  push:
    paths:
      - '.github/workflows/fit-senate-map-desktop.yml'
permissions:
  contents: write
jobs:
  fit-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Adjust desktop Senate map size
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='.page-head-inner{align-items:center!important}.card,.feed-card,.page-side-card,.profile-card,.rating-table-card{transition:transform .16s ease,box-shadow .16s ease!important}'
          new='.page-head-inner{align-items:center!important}#page-senate .map-wrap{padding:4px 8px!important}#page-senate .map-wrap svg{display:block!important;width:min(100%,1320px)!important;max-width:1320px!important;height:auto!important;margin:0 auto!important}/*senate-desktop-fit-v1*/.card,.feed-card,.page-side-card,.profile-card,.rating-table-card{transition:transform .16s ease,box-shadow .16s ease!important}'
          if old not in s:
              raise SystemExit('Expected desktop CSS insertion point not found; refusing to modify index.html')
          if s.count(old)!=1:
              raise SystemExit(f'Expected one insertion point, found {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit adjustment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fit Senate map within desktop viewport'
          git push