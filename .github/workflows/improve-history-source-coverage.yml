name: Improve historical Senate polling coverage
on:
  push:
    paths:
      - '.github/workflows/improve-history-source-coverage.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use RCP archive from 2006 onward and rebuild
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/build_2026_senate_history.py')
          s=p.read_text()
          s=s.replace('if yr<=2014:', 'if yr<2006:', 1)
          s=s.replace("'methodNote':'Older cycles use the Stanford final-three-week dataset; 2016–2022 use RCP-listed polls ending in the final 21 days. Georgia 2020 uses the published RCP Class II runoff aggregate so the two simultaneous Georgia races are not mixed.'", "'methodNote':'2002/2004 cycles use the Stanford final-three-week dataset; 2008–2022 use RCP-listed polls ending in the final 21 days. Georgia 2020 uses the published RCP Class II runoff aggregate so the two simultaneous Georgia races are not mixed.'")
          s=s.replace("'note':'Final-three-week polling data through 2014.'", "'note':'Final-three-week polling data used for the 2002/2004 cycles.'")
          s=s.replace("'note':'RCP-listed Senate polls used for 2016–2022.'", "'note':'RCP-listed Senate polls used for 2008–2022.'")
          p.write_text(s)
          PY
          python3 -m py_compile tools/build_2026_senate_history.py
          python3 tools/build_2026_senate_history.py
      - name: Validate complete Maine history and totals
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('senate-error-history-data.json'))
          assert len(d['records'])==140
          me=[r for r in d['records'] if r['state']=='ME']
          assert [r['year'] for r in me]==[2002,2008,2014,2020]
          assert all(r['status'] in ('HIT','MISS') for r in me), me
          r14=next(r for r in me if r['year']==2014)
          assert r14['status']=='MISS' and r14['pollCount']>0, r14
          print('stats',d['stats'])
          print('Maine',[(r['year'],r['status'],r.get('pollMargin'),r.get('actualMargin'),r.get('error'),r.get('pollCount')) for r in me])
          PY
          grep -q 'senate-error-history.js?v=20260909-2305' index.html
      - name: Commit improved history
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/improve-history-source-coverage.yml
          git add tools/build_2026_senate_history.py senate-error-history-data.json index.html .github/workflows/improve-history-source-coverage.yml
          git commit -m "Complete 2026-seat polling history with RCP archive"
          git push
