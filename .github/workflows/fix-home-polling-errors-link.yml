name: Fix Past Polling Misses home link
on:
  push:
    paths:
      - '.github/workflows/fix-home-polling-errors-link.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix home error-page button
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='data-page-link="errors" aria-label="Explore past Senate polling errors"'
          new='onclick="document.querySelector(\'.site-header .nav [data-page-link=errors]\').click();return false;" aria-label="Explore past Senate polling errors"'
          if old not in s:
              raise SystemExit('Expected Past Polling Errors home button marker not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix Past Polling Misses home button target'
          git push
