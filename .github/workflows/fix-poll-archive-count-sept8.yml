name: Fix poll archive count Sept 8
on:
  push:
    paths:
      - '.github/workflows/fix-poll-archive-count-sept8.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update archive subtitle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('senate-julsep-archive.js')
          s=p.read_text()
          s=s.replace('89 public general-election matchup polls and snapshots from July 7 through September 7','90 public general-election matchup polls and snapshots from July 7 through September 8')
          p.write_text(s)
          assert '90 public general-election matchup polls and snapshots from July 7 through September 8' in s
          PY
      - name: Commit site update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/fix-poll-archive-count-sept8.yml
          git add senate-julsep-archive.js .github/workflows/fix-poll-archive-count-sept8.yml
          git commit -m "Update Senate poll archive count to 90"
          git push
