name: Update home latest date Sep 15

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-home-latest-date-sep15.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update Latest Update card date
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          inject = "h=h.replace('Sep 11, 2026','Sep 15, 2026');"
          anchor = "h=h.replace('</head>',publicLock+'</head>');"
          if inject not in s:
              if anchor not in s:
                  raise SystemExit('index loader anchor not found')
              s = s.replace(anchor, inject + anchor, 1)
              p.write_text(s)
          PY
      - name: Commit update
        run: |
          if git diff --quiet; then
            echo "No change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update homepage latest date to Sep 15"
          git push
