name: Repair loader syntax

on:
  push:
    paths:
      - '.github/workflows/repair-loader-syntax.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair broken selector quoting
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='onclick=\\"document.querySelector(\'.site-header .nav [data-page-link=errors]\').click();return false;\\"'
          new='onclick=\\"document.querySelector(&quot;.site-header .nav [data-page-link=errors]&quot;).click();return false;\\"'
          if old not in s:
              raise SystemExit('broken selector pattern not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          start=s.index('<script>')+len('<script>')
          end=s.index('</script>',start)
          Path('/tmp/loader.js').write_text(s[start:end])
          PY
      - name: Validate loader JavaScript
        run: node --check /tmp/loader.js
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Repair site loader syntax'
          git push
