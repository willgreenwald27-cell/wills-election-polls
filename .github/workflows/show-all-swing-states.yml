name: Show every swing state on Past Polling Errors
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/show-all-swing-states.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch swing-state cards only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('senate-error-history.js')
          s=p.read_text()
          old="""  function renderShocks(){
    const host=document.getElementById('ipeShocks'); if(!host)return;
    const rows=shockRows().slice(0,6);
    if(!rows.length){host.innerHTML='<div class=\"ipe-source\">No scored swing-state historical races are available.</div>';return}
    host.innerHTML=rows.map((z,i)=>{const r=z.r,p=drMargin(r,'poll'),a=drMargin(r,'actual'),idx=data.records.indexOf(r);return `<button type=\"button\" class=\"ipe-shock\" data-ipe-story=\"${idx}\"><span class=\"ipe-shock-rank\">${String(i+1).padStart(2,'0')} · ${esc(r.year)} U.S. Senate${r.wrongWinner?' · leader reversed':''}</span><strong>${esc(r.stateName)}</strong><div class=\"ipe-shock-route\"><div><span>Final polls</span><b>${marginLabel(p)}</b></div><i>→</i><div><span>Actual result</span><b>${marginLabel(a)}</b></div></div><div class=\"ipe-shock-foot\"><small>${esc(r.matchup||'')}</small><em>${Math.abs(z.g).toFixed(1)} pts</em></div></button>`}).join('');
    host.querySelectorAll('[data-ipe-story]').forEach(btn=>btn.addEventListener('click',()=>openStory(Number(btn.dataset.ipeStory))));
  }"""
          new="""  function renderShocks(){
    const host=document.getElementById('ipeShocks'); if(!host)return;
    const all=shockRows();
    const order=(data?.swingStates||[]).filter(ab=>(data?.targetStates||[]).includes(ab));
    const rows=order.map(ab=>all.filter(z=>z.r.state===ab).sort((a,b)=>Math.abs(b.g)-Math.abs(a.g))[0]).filter(Boolean);
    if(!rows.length){host.innerHTML='<div class=\"ipe-source\">No scored swing-state historical races are available.</div>';return}
    host.innerHTML=rows.map((z,i)=>{const r=z.r,p=drMargin(r,'poll'),a=drMargin(r,'actual'),idx=data.records.indexOf(r);return `<button type=\"button\" class=\"ipe-shock\" data-ipe-story=\"${idx}\"><span class=\"ipe-shock-rank\">${esc(r.year)} U.S. Senate${r.wrongWinner?' · leader reversed':''}</span><strong>${esc(r.stateName)}</strong><div class=\"ipe-shock-route\"><div><span>Final polls</span><b>${marginLabel(p)}</b></div><i>→</i><div><span>Actual result</span><b>${marginLabel(a)}</b></div></div><div class=\"ipe-shock-foot\"><small>${esc(r.matchup||'')}</small><em>${Math.abs(z.g).toFixed(1)} pts miss</em></div></button>`}).join('');
    host.querySelectorAll('[data-ipe-story]').forEach(btn=>btn.addEventListener('click',()=>openStory(Number(btn.dataset.ipeStory))));
  }"""
          if old not in s:
              raise SystemExit('renderShocks block not found')
          s=s.replace(old,new,1)
          s=s.replace('Historical polling misses for the states currently grouped as 2026 Senate battlegrounds. These are the largest prior polling misses in that group; click any card for a full-screen race story.','Historical polling misses for every state in the current 2026 Senate swing-state group. Each card shows that state’s largest saved polling miss; click any card for a full-screen race story.')
          p.write_text(s)
          PY
          node --check senate-error-history.js
          grep -q "const rows=order.map" senate-error-history.js
          grep -q "Texas" senate-error-history-data.json
          grep -q '"OH"' senate-error-history-data.json
          grep -q '"IA"' senate-error-history-data.json
      - name: Commit change
        run: |
          git config user.name 'Will Election Polls Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add senate-error-history.js
          git diff --cached --quiet && exit 0
          git commit -m 'Show every swing state on polling errors page'
          git push origin main
