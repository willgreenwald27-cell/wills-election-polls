name: Cache bust Senate polls
on:
  push:
    paths:
      - '.github/workflows/cache-bust-senate-polls.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update Senate poll script version
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = 'senate-auto-averages.js?v=20260911-0035'
          new = 'senate-auto-averages.js?v=20260911-0756'
          if old not in s:
              raise SystemExit('old cache version not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name 'Will Election Polls Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Refresh Senate poll data cache'
          git push origin main
