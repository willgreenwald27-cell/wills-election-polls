name: Remove duplicate homepage Senate prediction
on:
  push:
    paths:
      - '.github/workflows/remove-duplicate-home-senate.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove old duplicate Senate prediction and refresh cache
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('sep9-polls-update.js')
          s=p.read_text()
          if 'function removeDuplicateHomeSenatePrediction()' not in s:
              anchor='  function fixCounts(){\n'
              if anchor not in s:
                  raise SystemExit('fixCounts anchor missing')
              fn=r'''  function removeDuplicateHomeSenatePrediction(){
    const root=document.getElementById('page-home'); if(!root) return;
    const split=document.getElementById('homeForecastSplit');

    // Remove any older image-based Senate forecast left on the homepage.
    for(const img of [...root.querySelectorAll('img')]){
      if(split&&split.contains(img)) continue;
      const sig=((img.alt||'')+' '+(img.getAttribute('src')||'')).toLowerCase();
      if(!(/senate/.test(sig)&&/prediction|forecast/.test(sig))) continue;
      let parent=img.parentElement;
      img.remove();
      while(parent&&parent!==root&&!norm(parent.textContent)&&parent.children.length===0){
        const next=parent.parentElement; parent.remove(); parent=next;
      }
    }

    // Remove any older inline/card version of the Senate graphic.
    const leaves=[...root.querySelectorAll('*')].filter(el=>!el.children.length&&!split?.contains(el));
    for(const el of leaves){
      if(!/^Will[’']s Senate Prediction$/i.test(norm(el.textContent))) continue;
      let box=el.parentElement;
      for(let i=0;box&&box!==root&&i<8;i++,box=box.parentElement){
        const t=norm(box.textContent);
        if(/Will[’']s Senate Prediction/i.test(t)&&/Democrats/i.test(t)&&/Republicans/i.test(t)){
          box.remove();
          break;
        }
      }
    }
  }

'''
              s=s.replace(anchor,fn+anchor,1)

          old='  function apply(){applyAverages();ensureNativePolls();ensureArchiveRows();ensureHomeForecastSplit();fixCounts();}'
          new='  function apply(){applyAverages();ensureNativePolls();ensureArchiveRows();ensureHomeForecastSplit();removeDuplicateHomeSenatePrediction();fixCounts();}'
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('apply anchor missing')
          p.write_text(s)

          idx=Path('index.html')
          i=idx.read_text()
          i,n=re.subn(r'sep9-polls-update\.js\?v=[0-9-]+','sep9-polls-update.js?v=20260909-1450',i)
          if n!=1:
              raise SystemExit(f'expected one sep9 updater cache key, found {n}')
          idx.write_text(i)

          assert 'removeDuplicateHomeSenatePrediction();' in p.read_text()
          assert 'sep9-polls-update.js?v=20260909-1450' in idx.read_text()
          PY
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/remove-duplicate-home-senate.yml
          git add sep9-polls-update.js index.html .github/workflows/remove-duplicate-home-senate.yml
          git commit -m "Remove duplicate Senate prediction from homepage"
          git push
