name: Final Senate 51-49 fix
on:
  push:
    paths:
      - '.github/workflows/fix-final-51-49.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove Ohio tossup override and set final 51-49
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('senate-current-sync.js')
          s=p.read_text()

          # Make Ohio permanently Tilt Democratic instead of Tossup.
          s=re.sub(
            r"      const oh=stateData\.OH;\n      if\(oh\)\{.*?\n      \}\n      return changed;",
            """      const oh=stateData.OH;
      if(oh){
        set(oh,'rating','tilt-d');set(oh,'predictionParty','Democratic');set(oh,'prediction','Tilt Democratic');set(oh,'notes','');set(oh,'updated','2026-09-13');
        const dem=String(oh.candidate1Party||'').toLowerCase().includes('dem')?oh.candidate1:(String(oh.candidate2Party||'').toLowerCase().includes('dem')?oh.candidate2:'Democratic');
        for(const k of ['projectedWinner','predictionWinner','winner']) if(k in oh) set(oh,k,dem);
        if('callParty' in oh) set(oh,'callParty','Democratic');
        if('call' in oh) set(oh,'call','Tilt Democratic');
      }
      const tx=stateData.TX;
      if(tx){
        set(tx,'rating','tilt-d');set(tx,'predictionParty','Democratic');set(tx,'prediction','Tilt Democratic');set(tx,'notes','');set(tx,'updated','2026-09-13');
        const dem=String(tx.candidate1Party||'').toLowerCase().includes('dem')?tx.candidate1:(String(tx.candidate2Party||'').toLowerCase().includes('dem')?tx.candidate2:'Democratic');
        for(const k of ['projectedWinner','predictionWinner','winner']) if(k in tx) set(tx,k,dem);
        if('callParty' in tx) set(tx,'callParty','Democratic');
        if('call' in tx) set(tx,'call','Tilt Democratic');
      }
      return changed;""",
            s, count=1, flags=re.S)

          # Replace old Ohio Tossup DOM override with Tilt Democratic blue styling.
          s=re.sub(
            r"  function forceOhio\(\)\{.*?\n  \}\n\n  function forceSenateSummary\(\)\{",
            """  function forceOhio(){
    const root=document.getElementById('page-senate'); if(!root)return;
    const BLUE_TILT='#d3e2f7';
    root.querySelectorAll('[data-state=\"OH\"],[data-state=\"OH\"] path,[data-abbr=\"OH\"],[data-abbr=\"OH\"] path,[data-state-abbr=\"OH\"],[data-state-abbr=\"OH\"] path,#OH,#OH path,#state-OH,#state-OH path').forEach(el=>{
      el.style.setProperty('fill',BLUE_TILT,'important');
      if(el.namespaceURI!=='http://www.w3.org/2000/svg'&&!/^(path|polygon|rect)$/i.test(el.tagName||'')) el.style.setProperty('background',BLUE_TILT,'important');
    });
    const labels=leafs(root).filter(el=>norm(el.textContent)==='Ohio'&&el.getClientRects().length);
    for(const label of labels){
      let box=label.parentElement;
      for(let i=0;box&&box!==root&&i<14;i++,box=box.parentElement){
        const t=norm(box.textContent);
        if(/WILL[’']S CALL/i.test(t)&&(/AVG POLLS/i.test(t)||/MY PREDICTION/i.test(t))) break;
      }
      if(!box||box===root)continue;
      for(const el of leafs(box)){
        const t=norm(el.textContent);
        if(/^Prediction:\\s*/i.test(t))el.textContent='Prediction: Tilt Democratic';
      }
      const copy=box.querySelector('.prediction-copy');if(copy)copy.textContent='Tilt Democratic';
      const callLeaf=leafs(box).find(el=>/^WILL[’']S CALL$/i.test(norm(el.textContent)));
      if(callLeaf){
        let card=callLeaf.parentElement;
        for(let i=0;card&&card!==box&&i<4;i++,card=card.parentElement){
          const t=norm(card.textContent);if(/WILL[’']S CALL/i.test(t)&&t.length<180)break;
        }
        if(card&&card!==box){
          const vals=leafs(card);
          const party=vals.find(el=>/^(Republican|Democrat(?:ic)?|Tossup)$/i.test(norm(el.textContent)));
          if(party)party.textContent='Democratic';
          const rating=vals.find(el=>/(TOSSUP|TILT|LEAN|LIKELY|SOLID)\\s*(REPUBLICAN|DEMOCRAT(?:IC)?)?/i.test(norm(el.textContent)));
          if(rating)rating.textContent='TILT DEMOCRATIC';
          const c=card.querySelector('.prediction-copy');if(c)c.textContent='Tilt Democratic';
        }
      }
      for(const heading of leafs(box).filter(el=>/^WHY MY FORECAST DIFFERS$/i.test(norm(el.textContent)))){
        let n=heading.parentElement;
        for(let i=0;n&&n!==box&&i<5;i++,n=n.parentElement){
          const t=norm(n.textContent);
          if(/^WHY MY FORECAST DIFFERS/i.test(t)&&!/WILL[’']S CALL/i.test(t)){n.remove();break;}
        }
      }
    }
  }

  function forceSenateSummary(){""",
            s, count=1, flags=re.S)

          # Force Senate summary to 51 D / 49 R, no tossup.
          s=re.sub(
            r"  function forceSenateSummary\(\)\{.*?\n  \}\n\n  function forceHome\(\)\{",
            """  function forceSenateSummary(){
    const root=document.getElementById('page-senate'); if(!root)return;
    const row=root.querySelector('.balance-count-row');
    const dem=row?.querySelector('.balance-party.dem');
    const rep=row?.querySelector('.balance-party.rep');
    const dn=dem?.querySelector('strong,.party-number,.final-party-number');
    const rn=rep?.querySelector('strong,.party-number,.final-party-number');
    if(dn)dn.textContent='51';
    if(rn)rn.textContent='49';
    for(const el of leafs(root)){
      const t=norm(el.textContent);
      if(/^1\\s+TOSSUP$/i.test(t)||/^1\\s+INDEPENDENT$/i.test(t)){el.textContent='';el.style.setProperty('display','none','important');}
    }
    for(const bar of root.querySelectorAll('.senate-bar,.forecast-bar,.seat-bar,[class*=\"senate-bar\"],[class*=\"seat-bar\"]')){
      const d=bar.querySelector('.dem'),r=bar.querySelector('.rep');
      if(d)d.style.setProperty('width','51%','important');
      if(r)r.style.setProperty('width','49%','important');
      bar.querySelectorAll('.tossup,.toss-up,[data-tossup]').forEach(el=>el.remove());
    }
  }

  function forceHome(){""",
            s, count=1, flags=re.S)

          # Force homepage card to 51 D / 49 R and remove explanation/tossup text.
          s=re.sub(
            r"  function forceHome\(\)\{.*?\n  \}\n\n  function apply\(\)\{",
            """  function forceHome(){
    const root=document.getElementById('page-home');if(!root)return;
    const card=root.querySelector('#homeForecastSplit .senate-card,.will-senate-card');
    if(!card)return;
    card.querySelectorAll('.senate-tiebreak,.final-tiebreak,.will-tossup-count').forEach(el=>el.remove());
    const nums=[...card.querySelectorAll('.party-number,.final-party-number')];
    if(nums[0])nums[0].textContent='51';
    if(nums[1])nums[1].textContent='49';
    for(const el of leafs(card)){
      const t=norm(el.textContent);
      if(/^Democrats?:\\s*\\d+$/i.test(t))el.textContent=t.replace(/\\d+$/,'51');
      if(/^Republicans?:\\s*\\d+$/i.test(t))el.textContent=t.replace(/\\d+$/,'49');
      if(/^1\\s+TOSSUP$/i.test(t)||/^1\\s+INDEPENDENT$/i.test(t)){el.textContent='';el.style.setProperty('display','none','important');}
      if(/^WHY MY FORECAST DIFFERS$/i.test(t)){let n=el.parentElement;for(let i=0;n&&n!==card&&i<5;i++,n=n.parentElement){if(/WHY MY FORECAST DIFFERS/i.test(norm(n.textContent))){n.remove();break;}}}
    }
    for(const el of [...card.querySelectorAll('p,small,.muted,.note,.forecast-note,.senate-note,.senate-explanation,.forecast-explanation')]){
      const t=norm(el.textContent);
      if(t.length>18&&(/(?:prediction|forecast).{0,120}(?:poll|average)/i.test(t)||/(?:poll|average).{0,120}(?:prediction|forecast)/i.test(t)))el.remove();
    }
    const bar=card.querySelector('.senate-bar,.final-bar');
    if(bar){
      const d=bar.querySelector('.dem'),r=bar.querySelector('.rep');
      if(d)d.style.setProperty('width','51%','important');
      if(r)r.style.setProperty('width','49%','important');
      bar.querySelectorAll('.tossup,.toss-up,[data-tossup]').forEach(el=>el.remove());
      bar.setAttribute('aria-label','Senate prediction: 51 Democrats and 49 Republicans');
    }
  }

  function apply(){""",
            s, count=1, flags=re.S)

          p.write_text(s)

          idx=Path('index.html')
          h=idx.read_text()
          h2,n=re.subn(r'senate-current-sync\\.js\\?v=[0-9A-Za-z._-]+','senate-current-sync.js?v=20260913-2215',h,count=1)
          if n!=1: raise SystemExit('senate-current-sync loader not found exactly once')
          idx.write_text(h2)
          PY
      - name: Commit final Senate fix
        shell: bash
        run: |
          git config user.name 'Will Election Polls Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add senate-current-sync.js index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Remove Ohio tossup override and set Senate 51-49 Democratic'
          git push
