name: Add House prediction graphic and fix About polls
on:
  push:
    paths:
      - '.github/workflows/add-house-prediction-and-fix-about-polls.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add House forecast graphic and About poll count fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Responsive vector version of the House forecast graphic.
          svg='''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
          <title id="title">Will’s House of Reps Prediction</title>
          <desc id="desc">Democrats 228 seats, Republicans 207 seats. 218 seats are needed for a majority.</desc>
          <defs>
            <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eef5fc"/></linearGradient>
            <linearGradient id="blue" x1="0" x2="1"><stop stop-color="#1468d8"/><stop offset="1" stop-color="#2763b8"/></linearGradient>
            <linearGradient id="red" x1="0" x2="1"><stop stop-color="#e9373d"/><stop offset="1" stop-color="#bd2937"/></linearGradient>
            <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0c223d" flood-opacity=".12"/></filter>
            <clipPath id="barclip"><rect x="90" y="505" width="1420" height="105" rx="28"/></clipPath>
          </defs>
          <rect width="1600" height="900" fill="url(#bg)"/>
          <rect x="42" y="44" width="1516" height="812" rx="30" fill="#fff" filter="url(#shadow)"/>

          <g fill="#9aa8b8" opacity=".95">
            <rect x="760" y="105" width="80" height="55" rx="2"/>
            <path d="M750 105h100l-50-42z"/>
            <rect x="784" y="62" width="32" height="8" rx="2"/>
            <rect x="796" y="42" width="8" height="24"/>
            <rect x="774" y="113" width="8" height="38" fill="#fff" opacity=".85"/>
            <rect x="796" y="113" width="8" height="38" fill="#fff" opacity=".85"/>
            <rect x="818" y="113" width="8" height="38" fill="#fff" opacity=".85"/>
          </g>
          <line x1="410" y1="115" x2="710" y2="115" stroke="#c8d1dc" stroke-width="3"/>
          <line x1="890" y1="115" x2="1190" y2="115" stroke="#c8d1dc" stroke-width="3"/>

          <text x="800" y="270" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="82" font-weight="900" fill="#0c223d">Will’s House of Reps Prediction</text>
          <text x="800" y="326" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700" letter-spacing="9" fill="#6d7888">435 SEATS • 218 NEEDED FOR A MAJORITY</text>

          <text x="105" y="435" font-family="Inter,Arial,sans-serif" font-size="58" font-weight="900" fill="#2763b8">DEMOCRATS: 228</text>
          <text x="1495" y="435" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="58" font-weight="900" fill="#bd2937">REPUBLICANS: 207</text>
          <text x="105" y="476" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="800" letter-spacing="4" fill="#657184">SEATS</text>
          <text x="1495" y="476" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="800" letter-spacing="4" fill="#657184">SEATS</text>

          <g clip-path="url(#barclip)">
            <rect x="90" y="505" width="743.9" height="105" fill="url(#blue)"/>
            <rect x="833.9" y="505" width="676.1" height="105" fill="url(#red)"/>
          </g>
          <text x="462" y="574" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="48" font-weight="900" fill="#fff">228</text>
          <text x="1172" y="574" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="48" font-weight="900" fill="#fff">207</text>

          <!-- 218 / 435 = 50.11%, deliberately inside the Democratic segment because 228 exceeds a majority. -->
          <line x1="801.6" y1="475" x2="801.6" y2="650" stroke="#0c223d" stroke-width="5" stroke-dasharray="11 10"/>
          <text x="801.6" y="696" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="900" fill="#0c223d">218 majority</text>

          <circle cx="515" cy="770" r="25" fill="#2763b8"/>
          <text x="558" y="766" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="850" fill="#0c223d">Democrats</text>
          <text x="558" y="800" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="600" fill="#687589">228 seats</text>
          <circle cx="920" cy="770" r="25" fill="#bd2937"/>
          <text x="963" y="766" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="850" fill="#0c223d">Republicans</text>
          <text x="963" y="800" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="600" fill="#687589">207 seats</text>
          </svg>'''
          Path('house-prediction.svg').write_text(svg)

          p=Path('accepted-good.js')
          s=p.read_text()
          if 'function ensureHousePrediction()' not in s:
              anchor='  function enforceMaineData(){\n'
              if anchor not in s:
                  raise SystemExit('accepted-good insertion anchor not found')
              block='''  function ensureHousePrediction(){
    const root=document.getElementById('page-home'); if(!root||document.getElementById('housePrediction2026')) return;
    const shell=root.querySelector('.reference-home-shell')||root.querySelector('.content')||root;
    const section=document.createElement('section'); section.id='housePrediction2026';
    section.style.cssText='width:100%;margin:28px 0 10px;display:block';
    const img=document.createElement('img');
    img.src='/house-prediction.svg?v=20260908-2203';
    img.alt="Will’s House of Reps Prediction: Democrats 228 seats, Republicans 207 seats; 218 needed for a majority.";
    img.style.cssText='display:block;width:100%;height:auto;border-radius:16px';
    section.appendChild(img);
    const metrics=root.querySelector('.reference-metrics');
    if(metrics) metrics.insertAdjacentElement('afterend',section); else shell.appendChild(section);
  }

  function fixAboutPollCount(){
    const root=document.getElementById('page-about'); if(!root) return;
    for(const el of leafs(root)){
      const t=norm(el.textContent); if(!t) continue;
      if(/\\b13\\s+polls?\\b/i.test(t)){
        el.textContent=t.replace(/\\b13(?=\\s+polls?\\b)/i,'89');
        continue;
      }
      if(t!=='13') continue;
      let box=el.parentElement,ok=false;
      for(let i=0;box&&box!==root&&i<6;i++,box=box.parentElement){if(/poll/i.test(norm(box.textContent))){ok=true;break;}}
      if(ok) el.textContent='89';
    }
  }

'''
              s=s.replace(anchor,block+anchor,1)
          old='    addStyle(); buildNav(); ensureArchive(); fixHome(); fixSenate(); activeNav();'
          new='    addStyle(); buildNav(); ensureArchive(); fixHome(); ensureHousePrediction(); fixAboutPollCount(); fixSenate(); activeNav();'
          if old not in s and new not in s:
              raise SystemExit('apply anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('index.html')
          i=p.read_text()
          i=re.sub(r'accepted-good\\.js\\?v=[0-9-]+','accepted-good.js?v=20260908-2203',i)
          p.write_text(i)

          out=Path('accepted-good.js').read_text()
          assert 'function ensureHousePrediction()' in out
          assert 'function fixAboutPollCount()' in out
          assert 'house-prediction.svg?v=20260908-2203' in out
          assert 'ensureHousePrediction(); fixAboutPollCount();' in out
          assert 'accepted-good.js?v=20260908-2203' in Path('index.html').read_text()
          assert Path('house-prediction.svg').exists()
          PY
      - name: Commit site update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/add-house-prediction-and-fix-about-polls.yml
          git add accepted-good.js index.html house-prediction.svg .github/workflows/add-house-prediction-and-fix-about-polls.yml
          git commit -m "Add House prediction graphic and fix About poll count"
          git push
