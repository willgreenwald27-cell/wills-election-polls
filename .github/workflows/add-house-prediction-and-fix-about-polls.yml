name: Add House prediction graphic and fix About polls
on:
  push:
    paths:
      - '.github/workflows/add-house-prediction-and-fix-about-polls.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch site
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, textwrap
          p=Path('accepted-good.js')
          s=p.read_text()
          if 'function ensureHousePrediction()' not in s:
              anchor='  function enforceMaineData(){\n'
              if anchor not in s:
                  raise SystemExit('accepted-good insertion anchor not found')
              block=textwrap.dedent(r'''
                function ensureHousePrediction(){
                  const root=document.getElementById('page-home'); if(!root||document.getElementById('housePrediction2026')) return;
                  const shell=root.querySelector('.reference-home-shell')||root.querySelector('.content')||root;
                  const section=document.createElement('section'); section.id='housePrediction2026';
                  section.style.cssText='width:100%;margin:28px 0 10px;display:block';
                  const img=document.createElement('img');
                  img.src='/house-prediction.svg?v=20260908-2208';
                  img.alt="Will’s House of Reps Prediction: Democrats 228 seats, Republicans 207 seats; 218 needed for a majority.";
                  img.style.cssText='display:block;width:100%;height:auto;border-radius:16px';
                  section.appendChild(img);
                  const metrics=root.querySelector('.reference-metrics');
                  if(metrics) metrics.insertAdjacentElement('afterend',section); else shell.appendChild(section);
                }

                function fixAboutPollCount(){
                  const root=document.getElementById('page-about'); if(!root) return;
                  for(const el of leafs(root)){
                    const t=norm(el.textContent); if(!t) continue;
                    if(/\b13\s+polls?\b/i.test(t)){
                      el.textContent=t.replace(/\b13(?=\s+polls?\b)/i,'89');
                      continue;
                    }
                    if(t!=='13') continue;
                    let box=el.parentElement,ok=false;
                    for(let i=0;box&&box!==root&&i<6;i++,box=box.parentElement){if(/poll/i.test(norm(box.textContent))){ok=true;break;}}
                    if(ok) el.textContent='89';
                  }
                }

              ''')
              s=s.replace(anchor,block+anchor,1)
          old='    addStyle(); buildNav(); ensureArchive(); fixHome(); fixSenate(); activeNav();'
          new='    addStyle(); buildNav(); ensureArchive(); fixHome(); ensureHousePrediction(); fixAboutPollCount(); fixSenate(); activeNav();'
          if old not in s and new not in s:
              raise SystemExit('apply anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          p=Path('index.html')
          i=p.read_text()
          i=re.sub(r'accepted-good\.js\?v=[0-9-]+','accepted-good.js?v=20260908-2208',i)
          p.write_text(i)
          out=Path('accepted-good.js').read_text()
          assert 'function ensureHousePrediction()' in out
          assert 'function fixAboutPollCount()' in out
          assert 'ensureHousePrediction(); fixAboutPollCount();' in out
          assert 'house-prediction.svg?v=20260908-2208' in out
          assert 'accepted-good.js?v=20260908-2208' in Path('index.html').read_text()
          assert Path('house-prediction.svg').exists()
          PY
      - name: Commit site update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/add-house-prediction-and-fix-about-polls.yml
          git add accepted-good.js index.html .github/workflows/add-house-prediction-and-fix-about-polls.yml
          git commit -m "Show House forecast and correct About poll count"
          git push
