name: Add static Governor nav

on:
  push:
    paths:
      - '.github/workflows/static-governor-nav.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert Governor button into rendered header HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='static-governor-nav-v1'
          if marker not in s:
              needle="h=h.replace('</head>',publicLock+'</head>');"
              stmt="h=h.replace('<button data-page-link=\"polls\">New Polls</button>','<button type=\"button\" data-governor-link onclick=\"window.location.href=\\\'/governor.html\\\'\">2026 Governor Map</button><button data-page-link=\"polls\">New Polls</button>');/*static-governor-nav-v1*/"
              if needle not in s:
                  raise SystemExit('loader insertion point not found')
              s=s.replace(needle,needle+stmt,1)
          if marker not in s:
              raise SystemExit('static Governor nav marker missing')
          p.write_text(s)
          start=s.index('<script>')+len('<script>')
          end=s.rindex('</script>')
          Path('/tmp/loader.js').write_text(s[start:end])
          PY
      - name: Validate loader JavaScript
        run: node --check /tmp/loader.js
      - name: Commit static Governor nav
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Add Governor tab directly to rendered header'
          git push
