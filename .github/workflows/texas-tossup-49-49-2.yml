name: Texas tossup and 49-49-2 Senate forecast
on:
  push:
    paths:
      - '.github/workflows/texas-tossup-49-49-2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply Texas tossup and seat totals
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('senate-current-sync.js')
          s=p.read_text()
          # Add Texas tossup data sync after Ohio block if absent
          if "const tx=stateData.TX;" not in s:
              anchor="""      const oh=stateData.OH;\n      if(oh){\n        set(oh,'rating','tossup');set(oh,'predictionParty','Tossup');set(oh,'prediction','Tossup');set(oh,'notes','');set(oh,'updated','2026-09-11');\n        for(const k of ['projectedWinner','predictionWinner','winner','callParty']) if(k in oh) set(oh,k,'Tossup');\n        if('call' in oh) set(oh,'call','Tossup');\n      }\n"""
              insert=anchor+"""      const tx=stateData.TX;\n      if(tx){\n        set(tx,'rating','tossup');set(tx,'predictionParty','Tossup');set(tx,'prediction','Tossup');set(tx,'notes','');set(tx,'updated','2026-09-12');\n        for(const k of ['projectedWinner','predictionWinner','winner','callParty']) if(k in tx) set(tx,k,'Tossup');\n        if('call' in tx) set(tx,'call','Tossup');\n      }\n"""
              if anchor not in s: raise SystemExit('Ohio sync anchor not found')
              s=s.replace(anchor,insert,1)
          # Clone Ohio visual treatment to Texas by generating a generalized helper if not present
          if 'function forceTexas(){' not in s:
              m=re.search(r'\n  function forceOhio\(\)\{.*?\n  \}\n\n  function forceSenateSummary',s,re.S)
              if not m: raise SystemExit('forceOhio block not found')
              ohio=m.group(0)
              body=ohio[len('\n  function forceOhio(){'): -len('\n\n  function forceSenateSummary')]
              txbody=body.replace('OH','TX').replace('Ohio','Texas')
              txfunc='\n  function forceTexas(){'+txbody+'\n  }\n\n  function forceSenateSummary'
              s=s[:m.start()]+ohio[:-len('\n\n  function forceSenateSummary')]+txfunc+s[m.end():]
          # Seat summary numbers and tossup count
          s=s.replace("?\'50\':\'49\'","?'49':'49'")
          s=s.replace("el.textContent='1 TOSSUP';","el.textContent='2 TOSSUPS';")
          s=s.replace("if(d)d.style.setProperty('width','49%','important');\n      if(r)r.style.setProperty('width','50%','important');","if(d)d.style.setProperty('width','49%','important');\n      if(r)r.style.setProperty('width','49%','important');")
          s=s.replace("if(y){y.style.setProperty('width','1%','important');","if(y){y.style.setProperty('width','2%','important');")
          # Home card totals
          s=s.replace("if(nums.length>=2){nums[0].textContent='49';nums[1].textContent='50';}","if(nums.length>=2){nums[0].textContent='49';nums[1].textContent='49';}")
          s=s.replace("if(/^Republicans?:\\s*51$/i.test(t))el.textContent=t.replace(/51$/,'50');","if(/^Republicans?:\\s*(?:50|51)$/i.test(t))el.textContent=t.replace(/(?:50|51)$/,'49');")
          s=s.replace("s.textContent='1 TOSSUP';","s.textContent='2 TOSSUPS';")
          s=s.replace("aria-label','Senate prediction: 49 Democrats, 50 Republicans, and 1 tossup'","aria-label','Senate prediction: 49 Democrats, 49 Republicans, and 2 tossups'")
          s=s.replace("forceMaine();forceOhio();forceSenateSummary();forceHome();","forceMaine();forceOhio();forceTexas();forceSenateSummary();forceHome();")
          p.write_text(s)
          i=Path('index.html')
          h=i.read_text()
          h,n=re.subn(r'senate-current-sync\.js\?v=[0-9-]+','senate-current-sync.js?v=20260912-1249',h,count=1)
          if n!=1: raise SystemExit('senate-current-sync cache ref not found')
          i.write_text(h)
          PY
          node --check senate-current-sync.js
          grep -q "const tx=stateData.TX" senate-current-sync.js
          grep -q "function forceTexas" senate-current-sync.js
          grep -q "2 TOSSUPS" senate-current-sync.js
          grep -q "49 Republicans, and 2 tossups" senate-current-sync.js
          git config user.name 'Will Election Polls Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add senate-current-sync.js index.html
          git commit -m 'Set Texas tossup and Senate forecast to 49-49 with 2 tossups'
          git push origin main
