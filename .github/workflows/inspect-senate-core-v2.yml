name: Inspect Senate core v2

on:
  push:
    paths:
      - '.github/workflows/inspect-senate-core-v2.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and extract Senate core snippets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,gzip,re
          files=['d0.txt','d1.txt','d2.txt','d3.txt','d4.txt','d5.txt','d6.txt','d7.txt','d8a.txt','d8b.txt','d9.txt']
          b=''.join(Path(f).read_text() for f in files)
          html=gzip.decompress(base64.b64decode(b)).decode('utf-8')
          pats=['const stateData','let stateData','statePollMarginLabel','function renderSenate','function openState','function renderHomeDashboard','function compute','projected','prediction-copy','poll average']
          out=[]
          for pat in pats:
            out.append('\n===== '+pat+' =====\n')
            start=0
            found=0
            while True:
              i=html.find(pat,start)
              if i<0 or found>=8: break
              a=max(0,i-1200); z=min(len(html),i+5000)
              out.append(html[a:z])
              out.append('\n---\n')
              start=i+len(pat); found+=1
          Path('senate-core-inspection.txt').write_text(''.join(out))
          PY
      - name: Commit inspection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add senate-core-inspection.txt
          git commit -m 'Extract Senate core inspection snippets'
          git push
