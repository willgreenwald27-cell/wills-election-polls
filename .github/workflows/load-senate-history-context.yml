name: Load Senate history context
on:
  push:
    paths:
      - '.github/workflows/load-senate-history-context.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Load final Senate history context script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="/senate-history-context.js?v=20260911-1341"><\\/script>'
          if 'senate-history-context.js' not in s:
              if '</body>' not in s: raise SystemExit('body close not found')
              s=s.replace('</body>',tag+'</body>',1)
              p.write_text(s)
          PY
          git config user.name 'Will Election Polls Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Load Senate historical context and desktop label fix' || exit 0
          git push origin main
