name: Enable Senate display fixes

on:
  push:
    paths:
      - '.github/workflows/enable-senate-display-fixes.yml'

permissions:
  contents: write

jobs:
  patch-loader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh Senate calls and display corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          s,n1=re.subn(r'/senate-julsep-archive\.js(?:\?v=[0-9A-Za-z._-]+)?','/senate-julsep-archive.js?v=20260907-1622',s)
          if n1 != 1:
              raise SystemExit(f'Expected one Senate archive loader, found {n1}')
          pat=r'(<script src="/senate-julsep-archive\.js\?v=[^"]+"><\\/script>)(?:<script src="/senate-display-fixes\.js(?:\?v=[^"]+)?"><\\/script>)?'
          fix='<script src="/senate-display-fixes.js?v=20260907-1750"><\\/script>'
          s,n2=re.subn(pat,lambda m:m.group(1)+fix,s)
          if n2 != 1:
              raise SystemExit(f'Expected one Senate archive script marker, found {n2}')
          old="const callOverride={AK:'Peltola +1.1%',GA:'Ossoff +8.1%',NC:'Cooper +7.9%',OH:'Husted +0.9%',NH:'Pappas +5.6%',ME:'Jackson +0.4%',TX:'Paxton +0.3%'}[s.abbr];"
          new="const callOverride={AK:'Peltola +1.1%',GA:'Ossoff +8.1%',NC:'Cooper +7.9%',OH:'Husted +0.9%',NH:'Pappas +5.6%',ME:'Collins +1.3%',TX:'Paxton +0.3%',IA:'Hinson +3.2%',KS:'Marshall +6.9%',NE:'Ricketts +4.3%'}[s.abbr];"
          if old in s:
              s=s.replace(old,new)
          elif new not in s:
              raise SystemExit('Could not find expected Senate callOverride')
          p.write_text(s)
          if s.count('/senate-display-fixes.js?v=20260907-1750') != 1:
              raise SystemExit('Senate display fix loader verification failed')
          if s.count("ME:'Collins +1.3%'") != 1:
              raise SystemExit('Maine call override verification failed')
          PY
      - name: Validate scripts and protect site data
        run: |
          node --check safe-patches.js
          node --check mobile-party-colors.js
          node --check senate-julsep-archive.js
          node --check senate-display-fixes.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          if len(scripts) != 1:
              raise SystemExit(f'Expected one loader script, found {len(scripts)}')
          Path('/tmp/loader.js').write_text(scripts[0])
          PY
          node --check /tmp/loader.js
          git diff --quiet -- d0.txt d1.txt d2.txt d3.txt d4.txt d5.txt d6.txt d7.txt d8a.txt d8b.txt d9.txt
      - name: Commit loader update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh mobile Senate party colors'
          git push
