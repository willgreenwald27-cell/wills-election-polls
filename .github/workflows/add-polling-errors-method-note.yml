name: Add polling errors methodology note

on:
  push:
    paths:
      - '.github/workflows/add-polling-errors-method-note.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add methodology note to Past Polling Errors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          marker = 'const heroIntro=document.querySelector("#page-home .reference-hero-copy>p");'
          insert = '''const errorsRoot=document.getElementById("page-errors");if(errorsRoot&&!document.getElementById("pollingErrorsMethodNote")){const note=document.createElement("p");note.id="pollingErrorsMethodNote";note.textContent="Polling-error calculations are based on polling averages compiled from reputable public polling sources, rather than any single survey.";note.style.cssText="margin:8px 0 16px;font-size:12px;line-height:1.5;color:#5f6d7f;max-width:900px";const anchor=errorsRoot.querySelector(".page-head p,.errors-summary");if(anchor)anchor.insertAdjacentElement("afterend",note);else errorsRoot.prepend(note)}'''
          if insert in s:
              raise SystemExit(0)
          if marker not in s:
              raise SystemExit('Insertion marker not found')
          s = s.replace(marker, insert + marker, 1)
          p.write_text(s)
          start = s.index('<script>') + len('<script>')
          end = s.rindex('</script>')
          Path('/tmp/loader.js').write_text(s[start:end])
          PY
      - name: Validate loader JavaScript
        run: node --check /tmp/loader.js
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Add polling errors methodology note'
          git push
