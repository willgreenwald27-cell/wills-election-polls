name: Fix navigation, Kalshi heading, and About school

on:
  push:
    paths:
      - '.github/workflows/fix-navigation-kalshi-school.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch site source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,gzip,re

          names=['d0.txt','d1.txt','d2.txt','d3.txt','d4.txt','d5.txt','d6.txt','d7.txt','d8a.txt','d8b.txt','d9.txt']
          encoded=''.join(Path(n).read_text().strip() for n in names)
          html=gzip.decompress(base64.b64decode(encoded)).decode('utf-8')

          # 1) Make SPA navigation persistent and restore page routes after returning from governor.html.
          show_start=html.find('function showPage(name){')
          if show_start < 0:
              raise SystemExit('showPage not found')
          scroll="window.scrollTo({top:0,behavior:'instant'});"
          scroll_at=html.find(scroll,show_start)
          if scroll_at < 0:
              raise SystemExit('showPage scroll marker not found')
          route_code="window.scrollTo({top:0,behavior:'instant'});try{const u=name==='home'?location.pathname:location.pathname+'?page='+encodeURIComponent(name);history.replaceState(null,'',u)}catch(e){}"
          if "history.replaceState(null,'',u)" not in html[show_start:show_start+1800]:
              html=html[:scroll_at]+route_code+html[scroll_at+len(scroll):]

          def add_button_type(m):
              attrs=m.group(1)
              if re.search(r'\btype\s*=',attrs,re.I):
                  return '<button'+attrs+'>'
              return '<button type="button"'+attrs+'>'
          html=re.sub(r'<button([^>]*\bdata-page-link="[^"]+"[^>]*)>',add_button_type,html)

          route_script='''<script id="page-route-restore">(()=>{try{const p=new URLSearchParams(location.search).get('page');if(p&&['home','senate','polls','betting','errors','about'].includes(p)&&document.getElementById('page-'+p)&&typeof showPage==='function')showPage(p)}catch(e){}})();</script>'''
          html=re.sub(r'<script id="page-route-restore">.*?</script>','',html,flags=re.S)
          html=html.replace('</body>',route_script+'</body>',1)

          # 2) Make the Kalshi page title permanently say Live Kalshi Senate Odds with a flashing red dot.
          old_heading='<h1>Kalshi Senate Odds</h1>'
          new_heading='<h1 class="live-kalshi-title"><span class="live-kalshi-dot" aria-hidden="true"></span>Live Kalshi Senate Odds</h1>'
          if old_heading in html:
              html=html.replace(old_heading,new_heading,1)
          elif 'Live Kalshi Senate Odds' not in html:
              raise SystemExit('Kalshi heading marker not found')

          live_style='''<style id="static-live-kalshi-style">.live-kalshi-title{display:flex;align-items:center;gap:0}.live-kalshi-dot{display:inline-block;width:10px;height:10px;flex:0 0 10px;border-radius:50%;background:#e32636;margin-right:9px;vertical-align:middle;animation:kalshiPulseStatic 1.15s ease-in-out infinite}@keyframes kalshiPulseStatic{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(227,38,54,.42)}50%{opacity:.32;box-shadow:0 0 0 6px rgba(227,38,54,0)}}</style>'''
          html=re.sub(r'<style id="static-live-kalshi-style">.*?</style>','',html,flags=re.S)
          html=html.replace('</head>',live_style+'</head>',1)

          # 3) Add school information to About Me with a Redwood-style R/tree mark.
          html=re.sub(r'<section id="aboutSchool".*?</section>','',html,flags=re.S)
          about_start=html.find('<section class="page" id="page-about">')
          if about_start < 0:
              raise SystemExit('About page not found')
          strip_start=html.find('<section class="about-stat-strip"',about_start)
          if strip_start < 0:
              raise SystemExit('About stat strip not found')
          strip_end=html.find('</section>',strip_start)
          if strip_end < 0:
              raise SystemExit('About stat strip end not found')
          strip_end += len('</section>')

          school='''
<section id="aboutSchool" aria-label="School" style="margin:14px 0 18px;padding:16px 18px;border:1px solid #d9dee7;border-radius:16px;background:#fff;display:flex;align-items:center;gap:18px;box-shadow:0 7px 22px rgba(20,34,53,.055)">
  <div aria-hidden="true" style="width:86px;height:72px;flex:0 0 86px;display:flex;align-items:center;justify-content:center;background:#f7f8fa;border-radius:13px;border:1px solid #e4e8ee">
    <svg viewBox="0 0 120 120" width="70" height="70" role="img" aria-label="Redwood High School redwood tree logo">
      <text x="7" y="99" font-family="Georgia,serif" font-size="96" font-weight="900" fill="#d92732" stroke="#17263d" stroke-width="2.2" paint-order="stroke">R</text>
      <path d="M61 11 51 29h7L45 45h10L41 63h12L37 84h18v23h12V84h18L69 63h12L67 45h9L64 29h7Z" fill="#177548" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
    </svg>
  </div>
  <div style="min-width:0">
    <div style="font-size:9px;font-weight:950;letter-spacing:1.4px;color:#d92732;text-transform:uppercase;margin-bottom:4px">School</div>
    <h3 style="margin:0;font-family:Georgia,serif;font-size:21px;line-height:1.15;color:#17263d">Redwood High School</h3>
    <p style="margin:5px 0 0;font-size:12px;line-height:1.45;color:#66758a">Larkspur, California</p>
  </div>
</section>'''
          html=html[:strip_end]+school+html[strip_end:]

          # Recompress and redistribute source chunks.
          new_encoded=base64.b64encode(gzip.compress(html.encode('utf-8'),mtime=0)).decode('ascii')
          q,r=divmod(len(new_encoded),len(names))
          pos=0
          for i,n in enumerate(names):
              size=q+(1 if i<r else 0)
              Path(n).write_text(new_encoded[pos:pos+size])
              pos+=size
          if pos!=len(new_encoded):
              raise SystemExit('chunk split failed')

          # Verify all requested changes in rebuilt source.
          rebuilt=gzip.decompress(base64.b64decode(''.join(Path(n).read_text().strip() for n in names))).decode('utf-8')
          checks=[
              'history.replaceState(null,\'\',u)',
              'id="page-route-restore"',
              'Live Kalshi Senate Odds',
              'id="aboutSchool"',
              'Redwood High School',
              'Larkspur, California'
          ]
          for c in checks:
              if c not in rebuilt:
                  raise SystemExit('verification failed: '+c)
          print('Navigation routing, Live Kalshi heading, and About school card verified.')
          PY
      - name: Validate rebuilt page JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,gzip,re
          names=['d0.txt','d1.txt','d2.txt','d3.txt','d4.txt','d5.txt','d6.txt','d7.txt','d8a.txt','d8b.txt','d9.txt']
          html=gzip.decompress(base64.b64decode(''.join(Path(n).read_text().strip() for n in names))).decode('utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S)
          for i,s in enumerate(scripts):
              Path(f'/tmp/site-script-{i}.js').write_text(s)
          print(len(scripts))
          PY
          for f in /tmp/site-script-*.js; do node --check "$f"; done
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add d0.txt d1.txt d2.txt d3.txt d4.txt d5.txt d6.txt d7.txt d8a.txt d8b.txt d9.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Fix page routing and update About and Kalshi UI'
          git push
