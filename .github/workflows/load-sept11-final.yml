name: Load Sep 11 final override
on:
  push:
    paths:
      - '.github/workflows/load-sept11-final.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Load final override last
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="/sept11-final.js?v=20260911-001"><\/script>'
          if tag not in s:
              needle='<script src="/site-layout-polish.js?v=20260910-1946"><\/script>'
              if needle not in s:
                  raise SystemExit('site-layout-polish loader not found')
              s=s.replace(needle, needle+tag, 1)
          p.write_text(s)
          PY
          grep -q 'sept11-final.js?v=20260911-001' index.html
          node --check sept11-final.js
      - name: Commit loader update
        run: |
          git config user.name 'Will Election Polls Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/load-sept11-final.yml
          git commit -m 'Load final Maine popup and Sep 11 date override'
          git push origin main
