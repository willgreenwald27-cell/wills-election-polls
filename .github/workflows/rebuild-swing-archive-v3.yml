name: Rebuild swing archive and homepage promo
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-swing-archive-v3.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Rebuild Past Polling Errors swing section
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('senate-error-history.js')
          s=p.read_text()

          marker="  const isCycleState=r=>{const t=data?.targetStates||[];return !t.length||t.includes(String(r?.state||''));};\n"
          extras="""  const TX_EXTRA_RACES=[
    {state:'TX',stateName:'Texas',year:2006,seatClass:'Class I',swing2026:true,matchup:'Kay Bailey Hutchison vs. Barbara Ann Radnofsky',stage:'general',winner:'Kay Bailey Hutchison',winnerParty:'REP',runnerUp:'Barbara Ann Radnofsky',runnerUpParty:'DEM',actualWinnerPct:61.678,actualRunnerPct:36.058,actualMargin:25.620,status:'UNSCORED',pollCount:0,supplemental:true,source:'Texas Secretary of State — 2006 General Election'},
    {state:'TX',stateName:'Texas',year:2012,seatClass:'Class I',swing2026:true,matchup:'Ted Cruz vs. Paul Sadler',stage:'general',winner:'Ted Cruz',winnerParty:'REP',runnerUp:'Paul Sadler',runnerUpParty:'DEM',actualWinnerPct:56.63,actualRunnerPct:40.45,actualMargin:16.18,status:'UNSCORED',pollCount:0,supplemental:true,source:'Texas Secretary of State — 2012 General Election'},
    {state:'TX',stateName:'Texas',year:2018,seatClass:'Class I',swing2026:true,matchup:\"Ted Cruz vs. Beto O'Rourke\",stage:'general',winner:'Ted Cruz',winnerParty:'REP',runnerUp:\"Beto O'Rourke\",runnerUpParty:'DEM',actualWinnerPct:50.89,actualRunnerPct:48.33,actualMargin:2.56,status:'UNSCORED',pollCount:0,supplemental:true,source:'Texas Secretary of State — 2018 General Election'},
    {state:'TX',stateName:'Texas',year:2024,seatClass:'Class I',swing2026:true,matchup:'Ted Cruz vs. Colin Allred',stage:'general',winner:'Ted Cruz',winnerParty:'REP',runnerUp:'Colin Allred',runnerUpParty:'DEM',actualWinnerPct:53.12,actualRunnerPct:null,actualMargin:null,status:'UNSCORED',pollCount:0,supplemental:true,source:'Texas Secretary of State / FEC — 2024 General Election'}
  ];
  function swingStateRecords(ab){
    const base=(data?.records||[]).filter(r=>isCycleState(r)&&r.state===ab&&Number(r.year)>=2001);
    const extra=ab==='TX'?TX_EXTRA_RACES:[];
    const seen=new Set();
    return [...base,...extra].filter(r=>{const k=`${r.year}|${r.seatClass||''}|${r.matchup||''}`;if(seen.has(k))return false;seen.add(k);return true}).sort((a,b)=>b.year-a.year);
  }
"""
          if 'const TX_EXTRA_RACES=' not in s:
              if marker not in s: raise SystemExit('cycle marker not found')
              s=s.replace(marker,marker+extras,1)

          css_anchor="      #page-errors .ipe-shock-foot em{font-style:normal;font-size:20px;font-weight:1000;color:#fff}\n"
          css="""
      #page-errors .ipe-swing-organized{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
      #page-errors .ipe-swing-state{background:#fff;border:1px solid #dbe3ed;border-radius:18px;overflow:hidden;box-shadow:0 12px 32px rgba(19,39,72,.07)}
      #page-errors .ipe-swing-toggle{width:100%;border:0;background:linear-gradient(135deg,#102b52,#1f4777);color:#fff;padding:17px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;cursor:pointer}
      #page-errors .ipe-swing-toggle strong{display:block;font-family:Georgia,serif;font-size:25px;color:#fff;margin:0}
      #page-errors .ipe-swing-toggle small{display:block;margin-top:4px;font-size:8px;line-height:1.4;color:#bfd0e4;font-weight:750}
      #page-errors .ipe-swing-toggle .ipe-toggle-meta{text-align:right;font-size:8px;font-weight:1000;letter-spacing:.55px;text-transform:uppercase;color:#d9e6f4;white-space:nowrap}
      #page-errors .ipe-swing-toggle .ipe-chevron{display:inline-block;margin-left:6px;transition:transform .18s ease}
      #page-errors .ipe-swing-state.open .ipe-chevron{transform:rotate(180deg)}
      #page-errors .ipe-swing-body{display:none;padding:12px;background:#f6f8fb}
      #page-errors .ipe-swing-state.open .ipe-swing-body{display:grid;gap:9px}
      #page-errors .ipe-swing-race{border:1px solid #dfe5ed;border-radius:14px;background:#fff;padding:13px;text-align:left;color:#21344d;width:100%;box-shadow:0 5px 18px rgba(20,39,70,.045)}
      #page-errors button.ipe-swing-race{cursor:pointer}
      #page-errors button.ipe-swing-race:hover{border-color:#adc0d7;box-shadow:0 9px 24px rgba(20,39,70,.09)}
      #page-errors .ipe-swing-race-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
      #page-errors .ipe-swing-race-top b{font-family:Georgia,serif;font-size:17px;color:#182b45}
      #page-errors .ipe-swing-race-top span{font-size:7px;font-weight:950;letter-spacing:.65px;text-transform:uppercase;color:#7a889a}
      #page-errors .ipe-party-matchup{display:grid;grid-template-columns:1fr 26px 1fr;gap:7px;align-items:stretch}
      #page-errors .ipe-party-candidate{border-radius:11px;padding:10px 11px;border:1px solid transparent;min-width:0}
      #page-errors .ipe-party-candidate.d{background:#e7f2ff;border-color:#bdd9f7;color:#135fa8}
      #page-errors .ipe-party-candidate.r{background:#fff0f2;border-color:#f1c9cf;color:#ad3341}
      #page-errors .ipe-party-candidate.i{background:#f1ebff;border-color:#d8c8f7;color:#7149b5}
      #page-errors .ipe-party-candidate span{display:block;font-size:6px;font-weight:1000;letter-spacing:.7px;text-transform:uppercase;opacity:.72}
      #page-errors .ipe-party-candidate b{display:block;margin-top:4px;font-size:10px;line-height:1.25;color:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      #page-errors .ipe-party-vs{display:grid;place-items:center;font-size:7px;font-weight:1000;color:#8a97a8;text-transform:uppercase}
      #page-errors .ipe-swing-numbers{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:9px}
      #page-errors .ipe-swing-number{border-radius:9px;background:#f2f5f9;padding:8px 9px}
      #page-errors .ipe-swing-number span{display:block;font-size:6px;font-weight:1000;letter-spacing:.55px;text-transform:uppercase;color:#8794a5}
      #page-errors .ipe-swing-number b{display:block;margin-top:4px;font-size:10px;color:#31445d}
      #page-errors .ipe-unsaved-poll{margin-top:9px;border-radius:9px;background:#fff7e6;border:1px solid #efdba6;padding:9px 10px;font-size:8px;line-height:1.45;color:#806323;font-weight:750}
      #page-errors .ipe-candidate.d{background:rgba(20,101,188,.28);border-color:rgba(105,183,255,.55);border-top-color:#64b5ff}
      #page-errors .ipe-candidate.r{background:rgba(179,47,64,.28);border-color:rgba(255,125,139,.50);border-top-color:#ff7a85}
      #page-errors .ipe-candidate.i{background:rgba(111,75,181,.28);border-color:rgba(186,154,255,.48);border-top-color:#b695ff}
      @media(max-width:1000px){#page-errors .ipe-swing-organized{grid-template-columns:1fr}}
      @media(max-width:700px){#page-errors .ipe-swing-toggle{grid-template-columns:1fr}.ipe-swing-toggle .ipe-toggle-meta{text-align:left!important}.ipe-party-matchup{grid-template-columns:1fr!important}.ipe-party-vs{min-height:14px}.ipe-swing-numbers{grid-template-columns:1fr!important}}
"""
          if 'ipe-swing-organized' not in s:
              if css_anchor not in s: raise SystemExit('css anchor not found')
              s=s.replace(css_anchor,css_anchor+css,1)

          new_block=r'''  function swingRaceHTML(r){
    const idx=(data?.records||[]).indexOf(r), clickable=idx>=0&&r.pollCount&&num(r.pollMargin)!==null;
    const result=num(r.actualMargin)!==null?`${r.winner} +${one(r.actualMargin)}`:`${r.winner} won`;
    const error=absError(r);
    const inner=`<div class="ipe-swing-race-top"><div><b>${esc(r.year)} U.S. Senate</b><span>${esc(r.seatClass||'')}</span></div><span>${r.pollCount?esc(r.status||''):'RESULT ONLY'}</span></div><div class="ipe-party-matchup"><div class="ipe-party-candidate ${partyCardClass(r.winnerParty)}"><span>${esc(shortParty(r.winnerParty))} · ${esc(r.winnerParty||'')}</span><b>${esc(r.winner||'')}</b></div><div class="ipe-party-vs">vs</div><div class="ipe-party-candidate ${partyCardClass(r.runnerUpParty)}"><span>${esc(shortParty(r.runnerUpParty))} · ${esc(r.runnerUpParty||'')}</span><b>${esc(r.runnerUp||'')}</b></div></div>${r.pollCount?`<div class="ipe-swing-numbers"><div class="ipe-swing-number"><span>Final polls</span><b>${esc(pollResultLabel(r))}</b></div><div class="ipe-swing-number"><span>Result</span><b>${esc(result)}</b></div><div class="ipe-swing-number"><span>Polls missed</span><b>${error===null?'—':error.toFixed(1)+' pts'}</b></div></div>`:`<div class="ipe-unsaved-poll">${esc(result)} · This election is included so the state dropdown contains the full 21st-century Senate history. A qualifying polling average is not yet stored for this race, so no polling-error score is shown.</div>`}`;
    return clickable?`<button type="button" class="ipe-swing-race" data-ipe-story="${idx}">${inner}</button>`:`<article class="ipe-swing-race">${inner}</article>`;
  }

  function renderShocks(){
    const host=document.getElementById('ipeShocks'); if(!host)return;
    const states=(data?.swingStates||[]).filter(ab=>(data?.targetStates||[]).includes(ab));
    if(!states.length){host.innerHTML='<div class="ipe-source">No swing-state history is available.</div>';return}
    host.className='ipe-swing-organized';
    host.innerHTML=states.map(ab=>{const rows=swingStateRecords(ab),name=rows[0]?.stateName||ab,scored=rows.filter(r=>r.pollCount&&absError(r)!==null),big=scored.length?Math.max(...scored.map(r=>absError(r))):null;return `<section class="ipe-swing-state" data-swing-state="${esc(ab)}"><button type="button" class="ipe-swing-toggle"><span><strong>${esc(name)}</strong><small>${rows.length} Senate races shown · 21st-century history${ab==='TX'?' · both Texas seats':''}</small></span><span class="ipe-toggle-meta">${big===null?'Open history':`largest saved miss ${big.toFixed(1)} pts`} <i class="ipe-chevron">⌄</i></span></button><div class="ipe-swing-body">${rows.map(swingRaceHTML).join('')}</div></section>`}).join('');
    host.querySelectorAll('.ipe-swing-toggle').forEach(btn=>btn.addEventListener('click',()=>btn.closest('.ipe-swing-state')?.classList.toggle('open')));
    host.querySelectorAll('[data-ipe-story]').forEach(btn=>btn.addEventListener('click',e=>{e.stopPropagation();openStory(Number(btn.dataset.ipeStory))}));
  }'''
          s,n=re.subn(r"  function renderShocks\(\)\{.*?\n  \}\n\n  function openStory",new_block+"\n\n  function openStory",s,count=1,flags=re.S)
          if n!=1: raise SystemExit('renderShocks block replacement failed')

          s=s.replace('Historical polling misses for every state in the current 2026 Senate swing-state group. Each card shows that state’s largest saved polling miss; click any card for a full-screen race story.','Open a state to see its saved 21st-century Senate history. Candidate colors follow the party listed for that candidate in that election; scored races can be opened as full-screen polling-error stories.')

          enhance=r'''  function enhanceHomePromo(){
    const home=document.getElementById('page-home'); if(!home)return;
    const shell=home.querySelector('.reference-home-shell')||home;
    let box=document.getElementById('homePastPollingMisses');
    if(!box){box=document.createElement('button');box.id='homePastPollingMisses';box.type='button'}
    box.innerHTML='<span style="display:block;font-size:9px;font-weight:1000;letter-spacing:1.5px;text-transform:uppercase;color:#c7dcfa;margin-bottom:8px">FEATURED DATA PROJECT · PAST POLLING ERRORS</span><strong style="display:block;font-family:Georgia,serif;font-size:clamp(25px,3vw,38px);line-height:1.02;color:#fff;margin-bottom:9px">See where Senate polls missed — race by race.</strong><span style="display:block;max-width:760px;font-size:12px;line-height:1.55;font-weight:700;color:#e2eaf5">Explore historical polling misses for the Senate seats on the 2026 ballot, compare final polls with election results, and open organized swing-state histories.</span><span style="display:inline-flex;margin-top:14px;padding:9px 12px;border-radius:999px;background:#fff;color:#173d70;font-size:9px;font-weight:1000">Explore Past Polling Errors →</span>';
    box.style.cssText='width:100%;margin:18px 0 22px;padding:25px 27px;background:linear-gradient(115deg,#092858 0%,#175b9f 48%,#8d3048 100%);color:#fff;border:0;border-radius:20px;text-align:left;cursor:pointer;display:block;box-shadow:0 18px 44px rgba(16,39,75,.20);position:relative;overflow:hidden';
    box.onclick=()=>{if(typeof showPage==='function')showPage('errors');else document.querySelector('[data-page-link="errors"]')?.click()};
    const metrics=home.querySelector('.reference-metrics');
    if(metrics&&box.previousElementSibling!==metrics)metrics.insertAdjacentElement('afterend',box);else if(!box.parentNode)shell.appendChild(box);
  }
'''
          if 'function enhanceHomePromo()' not in s:
              s=s.replace("  document.addEventListener('keydown'",enhance+"\n  document.addEventListener('keydown'",1)
          s=s.replace("load.then(d=>{data=d;render();setTimeout(render,450)})", "load.then(d=>{data=d;render();enhanceHomePromo();setTimeout(()=>{render();enhanceHomePromo()},450);setTimeout(enhanceHomePromo,1400)})")
          s=s.replace("new MutationObserver(()=>{if(data&&!rendering&&document.getElementById('page-errors')&&!document.querySelector(`#page-errors .${ROOT_CLASS}`))render()}).observe(document.body,{childList:true,subtree:true});", "new MutationObserver(()=>{if(data&&!rendering&&document.getElementById('page-errors')&&!document.querySelector(`#page-errors .${ROOT_CLASS}`))render();enhanceHomePromo()}).observe(document.body,{childList:true,subtree:true});")

          p.write_text(s)
          PY
          node --check senate-error-history.js
          grep -q "TX_EXTRA_RACES" senate-error-history.js
          grep -q "ipe-swing-organized" senate-error-history.js
          grep -q "enhanceHomePromo" senate-error-history.js
          grep -q "Kay Bailey Hutchison" senate-error-history.js
          grep -q "Beto O'Rourke" senate-error-history.js
      - name: Commit production change
        run: |
          git config user.name 'Will Election Polls Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add senate-error-history.js
          git diff --cached --quiet && exit 0
          git commit -m 'Organize swing histories, fix party colors, and feature polling errors'
          git push origin main
