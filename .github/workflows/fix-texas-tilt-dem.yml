name: Fix Texas Tilt Democratic

on:
  push:
    paths:
      - '.github/workflows/fix-texas-tilt-dem.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make Texas Tilt Democratic everywhere
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('site-final.js')
          s = p.read_text()
          s = s.replace("stateData.TX.rating='tilt-r';stateData.TX.predictionParty='Republican';stateData.TX.prediction='Tilt Republican';", "stateData.TX.rating='tilt-d';stateData.TX.predictionParty='Democratic';stateData.TX.prediction='Tilt Democratic';")
          s = s.replace("stateData.TX[k]='Republican'", "stateData.TX[k]='Democratic'")
          s = s.replace("stateData.TX.call='Tilt Republican'", "stateData.TX.call='Tilt Democratic'")
          s = s.replace("const value=/^REPUBLICAN$/i.test(t)?'50':'50';", "const value=/^REPUBLICAN$/i.test(t)?'49':'51';")
          s = s.replace("if(nums[0]) nums[0].textContent='50';", "if(nums[0]) nums[0].textContent='51';")
          s = s.replace("if(nums[1]) nums[1].textContent='50';", "if(nums[1]) nums[1].textContent='49';")
          s = s.replace("if(/^Democrats?:\\s*\\d+$/i.test(t)) el.textContent=t.replace(/\\d+$/,'50');", "if(/^Democrats?:\\s*\\d+$/i.test(t)) el.textContent=t.replace(/\\d+$/,'51');")
          s = s.replace("if(/^Republicans?:\\s*\\d+$/i.test(t)) el.textContent=t.replace(/\\d+$/,'50');", "if(/^Republicans?:\\s*\\d+$/i.test(t)) el.textContent=t.replace(/\\d+$/,'49');")
          s = s.replace("if(/^50 seats$/i.test(t)){", "if(/^\\d+ seats$/i.test(t)){")
          s = s.replace("if(/Democrat/i.test(parent)) el.textContent='50 seats';", "if(/Democrat/i.test(parent)) el.textContent='51 seats';")
          s = s.replace("if(/Republican/i.test(parent)) el.textContent='50 seats';", "if(/Republican/i.test(parent)) el.textContent='49 seats';")
          s = s.replace("kids[0].style.setProperty('width','50%','important')", "kids[0].style.setProperty('width','51%','important')")
          s = s.replace("kids[1].style.setProperty('width','50%','important')", "kids[1].style.setProperty('width','49%','important')")
          p.write_text(s)

          idx = Path('index.html')
          h = idx.read_text()
          h = h.replace("stateData.TX.rating='tilt-r';stateData.TX.predictionParty='Republican';stateData.TX.callParty='Republican';stateData.TX.prediction='Tilt Republican';", "stateData.TX.rating='tilt-d';stateData.TX.predictionParty='Democratic';stateData.TX.callParty='Democratic';stateData.TX.prediction='Tilt Democratic';")
          h = h.replace("TX:'Tilt Republican'", "TX:'Tilt Democratic'")
          h = re.sub(r"site-final\.js\?v=[A-Za-z0-9._-]+", "site-final.js?v=20260915-2115", h)
          idx.write_text(h)
          PY
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-texas-tilt-dem.yml
          git add site-final.js index.html
          git commit -m 'Set Texas to Tilt Democratic' || exit 0
          git push
