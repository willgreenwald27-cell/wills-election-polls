name: Fix Senate homepage source v1
on:
  push:
    paths:
      - '.github/workflows/fix-senate-home-source-v1.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove stale 49-51 source and Texas rerender loop
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('senate-color-polish.js')
          s=p.read_text()
          reps=[
            ("const dem=senate?'49':'228', rep=senate?'51':'207';","const dem=senate?'51':'228', rep=senate?'49':'207';"),
            ("const demW=senate?'49%':'52.4138%', repW=senate?'51%':'47.5862%';","const demW=senate?'51%':'52.4138%', repW=senate?'49%':'47.5862%';"),
            ("if(s.updated!=='2026-09-09'){s.updated='2026-09-09';changed=true;}","if(s.updated!=='2026-09-15'){s.updated='2026-09-15';changed=true;}\n      if(s.rating!=='tilt-d'){s.rating='tilt-d';changed=true;}\n      if(s.predictionParty!=='Democratic'){s.predictionParty='Democratic';changed=true;}\n      if(s.callParty!=='Democratic'){s.callParty='Democratic';changed=true;}\n      if(s.prediction!=='Tilt Democratic'){s.prediction='Tilt Democratic';changed=true;}\n      if(String(s.notes||'')!==''){s.notes='';changed=true;}"),
            ("  setInterval(apply,700);\n", ""),
            ("  new MutationObserver(()=>{clearTimeout(window.__senateColorPolishTimer);window.__senateColorPolishTimer=setTimeout(apply,35)}).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class','style']});\n", "")
          ]
          for old,new in reps:
              if old not in s:
                  raise SystemExit('Expected senate-color-polish source fragment not found: '+old[:80])
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit source repair
        shell: bash
        run: |
          git config user.name 'Will Election Polls Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add senate-color-polish.js
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Senate homepage source and Texas rerender loop'
          git pull --rebase origin main
          git push
