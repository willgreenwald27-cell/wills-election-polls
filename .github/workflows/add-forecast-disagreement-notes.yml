name: Add forecast disagreement notes
on:
  push:
    paths:
      - '.github/workflows/add-forecast-disagreement-notes.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Texas and Ohio forecast notes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('accepted-good.js')
          s=p.read_text()
          if 'FORECAST_DISAGREEMENT_NOTES' not in s:
              anchor='  function fixSenate(){\n'
              if anchor not in s: raise SystemExit('fixSenate anchor not found')
              block="  const FORECAST_DISAGREEMENT_NOTES={\n    TX:{candidates:['Ken Paxton','James Talarico'],text:\"Why my forecast differs from the polling average: I’m giving more weight to Texas’s Republican-leaning fundamentals and turnout patterns, while accounting for the possibility that some surveys may underrepresent rural and blue-collar voters.\"},\n    OH:{candidates:['Jon Husted','Sherrod Brown'],text:\"Why my forecast differs from the polling average: I’m giving more weight to Ohio’s recent Republican-leaning fundamentals and turnout patterns, while accounting for the possibility that some surveys may underrepresent rural and blue-collar voters.\"}\n  };\n\n  function ensureForecastDisagreementNotes(){\n    const root=document.body; if(!root) return;\n    const all=leafs(root);\n    for(const [abbr,cfg] of Object.entries(FORECAST_DISAGREEMENT_NOTES)){\n      const seed=all.find(el=>el.getClientRects().length&&cfg.candidates.includes(norm(el.textContent)));\n      if(!seed) continue;\n      let box=seed.parentElement;\n      for(let i=0;box&&box!==root&&i<16;i++,box=box.parentElement){\n        const t=norm(box.textContent);\n        if(cfg.candidates.every(n=>t.includes(n))&&/POLL AVERAGE|AVG POLLS/i.test(t)&&/WILL'S CALL|MY PREDICTION|WILL'S STATISTICAL ODDS/i.test(t)) break;\n      }\n      if(!box||box===root) continue;\n      let note=box.querySelector(`[data-forecast-disagreement=\\\"${abbr}\\\"]`);\n      if(!note){\n        note=document.createElement('div'); note.dataset.forecastDisagreement=abbr;\n        note.style.cssText='margin:16px 0 2px;padding:13px 14px;border-top:1px solid #dbe2ea;background:#f7f9fc;border-radius:10px;color:#27384d;font-size:12px;line-height:1.5';\n        const label=document.createElement('strong'); label.textContent='WHY MY FORECAST DIFFERS'; label.style.cssText='display:block;margin-bottom:5px;font-size:10px;letter-spacing:.8px;color:#607089';\n        const body=document.createElement('div'); body.className='forecast-disagreement-copy'; body.textContent=cfg.text;\n        note.append(label,body); box.appendChild(note);\n      }else{ const body=note.querySelector('.forecast-disagreement-copy'); if(body) body.textContent=cfg.text; }\n    }\n  }\n\n"
              s=s.replace(anchor,block+anchor,1)
          call='    fixAllCandidateColors(root);\n    fixMobileOddsFallback(root);'
          if '    ensureForecastDisagreementNotes();\n'+call not in s:
              if call not in s: raise SystemExit('fixSenate call anchor not found')
              s=s.replace(call,'    ensureForecastDisagreementNotes();\n'+call,1)
          p.write_text(s)
          p=Path('index.html')
          i=p.read_text()
          i=re.sub(r'accepted-good\.js\?v=[0-9-]+','accepted-good.js?v=20260908-1654',i)
          p.write_text(i)
          out=Path('accepted-good.js').read_text()
          assert 'FORECAST_DISAGREEMENT_NOTES' in out and 'ensureForecastDisagreementNotes();' in out
          assert 'accepted-good.js?v=20260908-1654' in Path('index.html').read_text()
          PY
      - name: Commit site update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/add-forecast-disagreement-notes.yml
          git add accepted-good.js index.html .github/workflows/add-forecast-disagreement-notes.yml
          git commit -m "Add Texas and Ohio forecast rationale notes"
          git push
