name: Cache bump site UX

on:
  push:
    paths:
      - 'nav-cache-trigger.txt'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump site UX cache key
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          new='site-ux-polish.js?v=20260914-2055'
          s,n=re.subn(r'site-ux-polish\.js\?v=[0-9-]+',new,s,count=1)
          if n!=1:
              raise SystemExit(f'Expected exactly one site UX cache key, found {n}')
          p.write_text(s)
          print(new)
          PY
      - name: Commit cache bump
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Cache-bump final navigation fix"
          git push
