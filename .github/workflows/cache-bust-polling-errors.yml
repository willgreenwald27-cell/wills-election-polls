name: Force polling-errors refresh
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cache-bust-polling-errors.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Bump polling-errors script version
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          s2,n=re.subn(r'senate-error-history\.js\?v=[0-9-]+','senate-error-history.js?v=20260911-0136',s,count=1)
          if n != 1:
              raise SystemExit(f'expected one script reference, found {n}')
          p.write_text(s2)
          PY
          grep -o 'senate-error-history.js?v=[0-9-]*' index.html
      - name: Commit refresh and remove one-time workflow
        run: |
          git config user.name 'Will Election Polls Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm .github/workflows/cache-bust-polling-errors.yml
          git add index.html .github/workflows/cache-bust-polling-errors.yml
          git commit -m 'Bust cache for updated Past Polling Errors experience'
          git push origin main
