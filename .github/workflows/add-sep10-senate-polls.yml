name: Add Sep 10 Senate polls
on:
  push:
    paths:
      - '.github/workflows/add-sep10-senate-polls.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Michigan South Carolina and Ohio polls
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sep9-polls-update.js')
          s=p.read_text()
          if "pollster:'Trafalgar Group*'" in s and "state:'SC',pollster:'InsiderAdvantage'" in s and "state:'OH',pollster:'InsiderAdvantage'" in s:
              raise SystemExit('Sep 10 polls already present')
          s=s.replace("changed=setCandidatePoll('MI','el-sayed','45.4')||changed;", "changed=setCandidatePoll('MI','el-sayed','46.5')||changed;")
          s=s.replace("changed=setCandidatePoll('MI','rogers','44.5')||changed;", "changed=setCandidatePoll('MI','rogers','44.7')||changed;")
          anchor="    changed=setCandidatePoll('NC','whatley','40.7')||changed;\n"
          extra=("    changed=setCandidatePoll('OH','brown','49.3')||changed;\n"
                 "    changed=setCandidatePoll('OH','husted','46.7')||changed;\n"
                 "    changed=setCandidatePoll('SC','graham','45.0')||changed;\n"
                 "    changed=setCandidatePoll('SC','andrews','43.0')||changed;\n")
          if anchor not in s:
              raise SystemExit('average anchor not found')
          s=s.replace(anchor, anchor+extra, 1)
          s=s.replace("if(oh.updated!=='2026-09-09'){oh.updated='2026-09-09';changed=true;}", "if(oh.updated!=='2026-09-10'){oh.updated='2026-09-10';changed=true;}")
          s=s.replace("if(mi.updated!=='2026-09-09'){mi.updated='2026-09-09';changed=true;}", "if(mi.updated!=='2026-09-10'){mi.updated='2026-09-10';changed=true;}")
          s=s.replace("    changed=applyForecastCalls()||changed;\n", "    changed=applyForecastCalls()||changed;\n    try{if(typeof stateData!=='undefined'&&stateData?.SC&&stateData.SC.updated!=='2026-09-10'){stateData.SC.updated='2026-09-10';changed=true;}}catch(e){}\n", 1)
          native_anchor="      if(changed&&typeof renderPolls==='function') renderPolls();\n"
          native_extra=("      add({date:'2026-09-10',state:'MI',pollster:'Trafalgar Group*',sample:'1,079 LV',c1:'Abdul El-Sayed',c1Pct:'46',c2:'Mike Rogers',c2Pct:'45',notes:'RealClearPolling · El-Sayed +1'});\n"
                        "      add({date:'2026-09-10',state:'SC',pollster:'InsiderAdvantage',sample:'',c1:'Graham Nordone',c1Pct:'45',c2:'Annie Andrews',c2Pct:'43',notes:'RealClearPolling · Graham Nordone +2'});\n"
                        "      add({date:'2026-09-10',state:'OH',pollster:'InsiderAdvantage',sample:'',c1:'Sherrod Brown',c1Pct:'47',c2:'Jon Husted',c2Pct:'42',notes:'RealClearPolling · Brown +5'});\n")
          if native_anchor not in s:
              raise SystemExit('native poll anchor not found')
          s=s.replace(native_anchor, native_extra+native_anchor, 1)
          archive_anchor="    if(filter==='ALL'||filter==='TX') list.prepend(row('TX','Texas','Univision','James Talarico',48,'Ken Paxton',43,'Sep 8'));\n"
          archive_extra=("    if(filter==='ALL'||filter==='SC') list.prepend(row('SC','South Carolina','InsiderAdvantage','Graham Nordone',45,'Annie Andrews',43,'Sep 10'));\n"
                         "    if(filter==='ALL'||filter==='OH') list.prepend(row('OH','Ohio','InsiderAdvantage','Sherrod Brown',47,'Jon Husted',42,'Sep 10'));\n"
                         "    if(filter==='ALL'||filter==='MI') list.prepend(row('MI','Michigan','Trafalgar Group*','Abdul El-Sayed',46,'Mike Rogers',45,'Sep 10'));\n")
          if archive_anchor not in s:
              raise SystemExit('archive anchor not found')
          s=s.replace(archive_anchor, archive_anchor+archive_extra, 1)
          s=s.replace("96 public general-election matchup polls and snapshots from July 7 through September 9", "99 public general-election matchup polls and snapshots from July 7 through September 10")
          p.write_text(s)
          PY
          node --check sep9-polls-update.js
          grep -q "Trafalgar Group\*" sep9-polls-update.js
          grep -q "state:'SC',pollster:'InsiderAdvantage'" sep9-polls-update.js
          grep -q "setCandidatePoll('OH','brown','49.3')" sep9-polls-update.js
      - name: Commit production poll update
        shell: bash
        run: |
          git config user.name 'Will Election Polls Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add sep9-polls-update.js
          git commit -m 'Add Sep 10 Michigan South Carolina and Ohio Senate polls'
          git push
