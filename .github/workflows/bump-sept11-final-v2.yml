name: Refresh Sep 11 final asset
on:
  push:
    paths:
      - '.github/workflows/bump-sept11-final-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Bump final override cache key
        run: |
          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(); old='/sept11-final.js?v=20260911-001'; assert old in s; p.write_text(s.replace(old,'/sept11-final.js?v=20260911-002',1))"
          grep -q 'sept11-final.js?v=20260911-002' index.html
      - name: Commit production cache refresh
        run: |
          git config user.name 'Will Election Polls Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/bump-sept11-final-v2.yml
          git add index.html
          git commit -m 'Refresh Maine odds and popup rationale'
          git push origin main
