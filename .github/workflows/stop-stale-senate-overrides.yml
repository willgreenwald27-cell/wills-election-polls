name: Stop stale Senate overrides
on:
  push:
    paths:
      - '.github/workflows/stop-stale-senate-overrides.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove stale Sep 9/11 and Senate rerender conflicts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('sept11-final.js')
          s = p.read_text()
          s = s.replace("el.textContent='Sep 11, 2026';", "el.textContent='Sep 15, 2026';")
          s = s.replace("el.textContent='Last updated September 11, 2026';", "el.textContent='Last updated September 15, 2026';")
          s = s.replace("  setInterval(apply,500);\n", "")
          p.write_text(s)

          p = Path('sept9-final-ui.js')
          s = p.read_text()
          s = s.replace("if(d)d.textContent='Sep 9, 2026';", "if(d)d.textContent='Sep 15, 2026';")
          s = s.replace("if(s.updated!=='2026-09-09'){s.updated='2026-09-09';changed=true;}", "if(s.updated!=='2026-09-15'){s.updated='2026-09-15';changed=true;}\n        s.rating='tilt-d';s.predictionParty='Democratic';s.callParty='Democratic';s.prediction='Tilt Democratic';s.notes='';")
          s = s.replace("    if(changed&&typeof renderSenate==='function'&&!renderingSenate){", "    changed=false; // do not trigger a competing Senate rerender\n    if(changed&&typeof renderSenate==='function'&&!renderingSenate){")
          s = s.replace("  setInterval(apply,1400);\n", "")
          p.write_text(s)

          p = Path('site-ux-polish.js')
          s = p.read_text()
          s = s.replace("  setInterval(apply,750);\n", "")
          s = s.replace("new MutationObserver(schedule).observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['class','style']});", "new MutationObserver(schedule).observe(document.body,{childList:true,subtree:true,characterData:true});")
          p.write_text(s)

          p = Path('index.html')
          s = p.read_text()
          s = s.replace("h=h.replace('Sep 11, 2026','Sep 15, 2026');", "h=h.replaceAll('Sep 11, 2026','Sep 15, 2026').replaceAll('Sep 12, 2026','Sep 15, 2026').replaceAll('Sep 9, 2026','Sep 15, 2026');")
          versions = {
            'site-final.js':'20260915-2125',
            'senate-current-sync.js':'20260915-2125',
            'sept9-final-ui.js':'20260915-2125',
            'sept11-final.js':'20260915-2125',
            'site-ux-polish.js':'20260915-2125',
            'senate-auto-averages.js':'20260915-2125'
          }
          for name, ver in versions.items():
              s = re.sub(re.escape(name) + r'\?v=[0-9-]+', f'{name}?v={ver}', s)
          p.write_text(s)
          PY
      - name: Commit stabilized state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sept11-final.js sept9-final-ui.js site-ux-polish.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Stop stale date and Senate rerender overrides"
          git push
