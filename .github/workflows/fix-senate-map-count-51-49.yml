name: Fix Senate Map Count 51-49

on:
  push:
    paths:
      - '.github/workflows/fix-senate-map-count-51-49.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce Senate map count at 51-49 Democratic
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('site-ux-polish.js')
          s = p.read_text()
          old = "const rs=rep.querySelector('span');if(rs){rs.textContent='Republican';rs.style.removeProperty('opacity');rs.style.removeProperty('visibility');}"
          new = old + "const dn=dem.querySelector('strong');if(dn)dn.textContent='51';const rn=rep.querySelector('strong');if(rn)rn.textContent='49';"
          if new not in s:
              s = s.replace(old, new)
          p.write_text(s)
          idx = Path('index.html')
          h = idx.read_text()
          h = re.sub(r"site-ux-polish\.js\?v=[A-Za-z0-9._-]+", "site-ux-polish.js?v=20260916-2004", h)
          idx.write_text(h)
          PY
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-senate-map-count-51-49.yml
          git add site-ux-polish.js index.html
          git commit -m 'Set Senate map count to 51-49 Democratic' || exit 0
          git push
