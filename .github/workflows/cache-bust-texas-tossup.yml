name: Cache bust Texas tossup override
on:
  push:
    paths:
      - '.github/workflows/cache-bust-texas-tossup.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Refresh override cache
        run: |
          perl -0pi -e 's/senate-history-context\.js\?v=20260911-1347/senate-history-context.js?v=20260912-1257/' index.html
          grep -q 'senate-history-context.js?v=20260912-1257' index.html
          git config user.name 'Will Election Polls Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Refresh Texas tossup override cache'
          git push origin main
