name: Add Sept 8 Michigan poll
on:
  push:
    paths:
      - '.github/workflows/add-sept8-michigan-poll.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Michigan poll and refresh average
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          archive=Path('senate-julsep-archive.js')
          s=archive.read_text()
          poll_row="['2026-09-08','MI','Michigan','Detroit News / Glengariff','Abdul El-Sayed',44,'Mike Rogers',46,'RCP'],\n"
          if poll_row not in s:
              anchor='  const POLLS=[\n'
              if anchor not in s:
                  raise SystemExit('POLLS anchor not found')
              s=s.replace(anchor,anchor+poll_row,1)

          if 'let renderingMichigan=false;' not in s:
              s=s.replace('  let renderingMinnesota=false;\n','  let renderingMinnesota=false;\n  let renderingMichigan=false;\n',1)

          if 'function applyMichiganAverage()' not in s:
              anchor='  function applyMinnesotaAverage(){\n'
              if anchor not in s:
                  raise SystemExit('Minnesota average anchor not found')
              block=r'''  function applyMichiganAverage(){
    try{
      if(typeof stateData==='undefined'||!stateData||!stateData.MI) return;
      const mi=stateData.MI;
      let changed=false;
      const setPoll=(slot,last,pct)=>{
        const name=norm(mi['candidate'+slot]).toLowerCase();
        if(!name.includes(last)) return;
        const key='candidate'+slot+'Poll';
        if(String(mi[key])!==String(pct)){mi[key]=String(pct);changed=true;}
      };
      setPoll(1,'el-sayed','46.9'); setPoll(2,'el-sayed','46.9');
      setPoll(1,'rogers','44.6'); setPoll(2,'rogers','44.6');
      if(mi.updated!=='2026-09-08'){mi.updated='2026-09-08';changed=true;}
      if(changed&&typeof renderSenate==='function'&&!renderingMichigan){
        renderingMichigan=true;
        try{renderSenate();}finally{renderingMichigan=false;}
      }
    }catch(e){console.warn('Michigan polling-average update unavailable',e);}
  }

  function ensureSep8MichiganPoll(){
    try{
      if(typeof polls==='undefined'||!Array.isArray(polls)) return;
      const exists=polls.some(p=>p&&p.state==='MI'&&p.date==='2026-09-08'&&/Glengariff/i.test(String(p.pollster||'')));
      if(exists) return;
      polls.push({date:'2026-09-08',state:'MI',pollster:'Detroit News / Glengariff',sample:'600 likely voters',c1:'Abdul El-Sayed',c1Pct:'44',c2:'Mike Rogers',c2Pct:'46',notes:'RealClearPolling listing · Rogers +2 · ±4% MOE'});
      if(typeof renderPolls==='function') renderPolls();
    }catch(e){console.warn('Michigan poll feed update unavailable',e);}
  }

'''
              s=s.replace(anchor,block+anchor,1)

          old='  function apply(){applyMaineCall();applyMinnesotaAverage();ensureSep7MinnesotaPoll();fixMaineVisibleDetail();ensurePollArchive();}'
          new='  function apply(){applyMaineCall();applyMichiganAverage();applyMinnesotaAverage();ensureSep8MichiganPoll();ensureSep7MinnesotaPoll();fixMaineVisibleDetail();ensurePollArchive();}'
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('archive apply anchor not found')
          archive.write_text(s)

          ctrl=Path('accepted-good.js')
          a=ctrl.read_text()
          a=re.sub(r"senate-julsep-archive\.js\?v=[0-9-]+","senate-julsep-archive.js?v=20260908-2220",a)
          a=a.replace("['13','14','88'].includes(v)) el.textContent='89';","['13','14','88','89'].includes(v)) el.textContent='90';")
          a=a.replace(r"if(/\b13\s+polls?\b/i.test(t)){",r"if(/\b(?:13|89)\s+polls?\b/i.test(t)){")
          a=a.replace(r"t.replace(/\b13(?=\s+polls?\b)/i,'89')",r"t.replace(/\b(?:13|89)(?=\s+polls?\b)/i,'90')")
          a=a.replace("if(t!=='13') continue;","if(!['13','89'].includes(t)) continue;")
          a=a.replace("if(ok) el.textContent='89';","if(ok) el.textContent='90';")
          ctrl.write_text(a)

          idx=Path('index.html')
          i=idx.read_text()
          i=re.sub(r'accepted-good\.js\?v=[0-9-]+','accepted-good.js?v=20260908-2220',i)
          idx.write_text(i)

          out=archive.read_text()
          assert poll_row in out
          assert 'function applyMichiganAverage()' in out
          assert "setPoll(1,'el-sayed','46.9')" in out
          assert "setPoll(1,'rogers','44.6')" in out
          assert "sample:'600 likely voters'" in out
          assert 'senate-julsep-archive.js?v=20260908-2220' in ctrl.read_text()
          assert "el.textContent='90'" in ctrl.read_text()
          assert 'accepted-good.js?v=20260908-2220' in idx.read_text()
          PY
      - name: Commit site update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/add-sept8-michigan-poll.yml
          git add senate-julsep-archive.js accepted-good.js index.html .github/workflows/add-sept8-michigan-poll.yml
          git commit -m "Add Sept 8 Michigan Senate poll and update average"
          git push
