name: Add Sept 8 Michigan poll
on:
  push:
    paths:
      - '.github/workflows/add-sept8-michigan-poll.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Michigan poll and average
        run: python3 .github/patch-mi-sept8.py
      - name: Commit site update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/add-sept8-michigan-poll.yml .github/patch-mi-sept8.py
          git add senate-julsep-archive.js accepted-good.js index.html .github/workflows/add-sept8-michigan-poll.yml .github/patch-mi-sept8.py
          git commit -m "Add Sept 8 Michigan Senate poll and update average"
          git push
