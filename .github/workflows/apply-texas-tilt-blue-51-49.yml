name: Align Texas blue source and refresh cache

on:
  push:
    paths:
      - '.github/workflows/apply-texas-tilt-blue-51-49.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align loader source
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('senate-current-sync.js')
          s=p.read_text()
          assert "set(tx,'rating','tilt-d');set(tx,'predictionParty','Democratic');set(tx,'prediction','Tilt Democratic')" in s
          idx=Path('index.html')
          h=idx.read_text()
          old="if(stateData.TX&&stateData.TX.active){stateData.TX.rating='tilt-r';stateData.TX.predictionParty='Republican';stateData.TX.callParty='Republican';stateData.TX.prediction='Tilt Republican';}"
          new="if(stateData.TX&&stateData.TX.active){stateData.TX.rating='tilt-d';stateData.TX.predictionParty='Democratic';stateData.TX.callParty='Democratic';stateData.TX.prediction='Tilt Democratic';}"
          if old in h:
              h=h.replace(old,new,1)
          h,n=re.subn(r"senate-current-sync\.js\?v=[0-9A-Za-z._-]+","senate-current-sync.js?v=20260915-1733",h)
          assert n>0
          idx.write_text(h)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Align Texas Democratic source and refresh cache'
          git push
