name: Embed Homepage Senate 51-49 Fix

on:
  push:
    paths:
      - '.github/workflows/apply-texas-tilt-blue-51-49.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Embed Senate-only homepage override
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip

          parts = ['d0.txt','d1.txt','d2.txt','d3.txt','d4.txt','d5.txt','d6.txt','d7.txt','d8a.txt','d8b.txt','d9.txt']
          encoded = ''.join(Path(p).read_text() for p in parts)
          html = gzip.decompress(base64.b64decode(encoded)).decode('utf-8')

          marker = 'wg-home-senate-embedded-51-49-v1'
          if marker not in html:
              script = r'''
<script id="wg-home-senate-embedded-51-49-v1">
(()=>{
  const text=e=>String(e?.textContent||'').replace(/\s+/g,' ').trim();
  const leaves=r=>r?[...r.querySelectorAll('*')].filter(e=>e.children.length===0):[];
  function fix(){
    const root=document.getElementById('page-home');
    if(!root)return;
    const candidates=[...root.querySelectorAll('*')].filter(el=>{
      const t=text(el);
      if(!/senate/i.test(t))return false;
      return leaves(el).filter(x=>text(x)==='50').length>=2;
    }).sort((a,b)=>{
      const ah=/house/i.test(text(a))?1:0;
      const bh=/house/i.test(text(b))?1:0;
      if(ah!==bh)return ah-bh;
      return a.querySelectorAll('*').length-b.querySelectorAll('*').length;
    });
    const card=candidates[0];
    if(!card)return;
    const fifties=leaves(card).filter(x=>text(x)==='50');
    let dem=null,rep=null;
    for(const x of fifties){
      let n=x;
      let ctx='';
      for(let i=0;n&&n!==card&&i<5;i++,n=n.parentElement)ctx+=' '+text(n);
      if(!dem&&/democrat/i.test(ctx))dem=x;
      if(!rep&&/republican/i.test(ctx))rep=x;
    }
    if(dem)dem.textContent='51';
    if(rep)rep.textContent='49';
    if(!dem&&!rep&&fifties.length>=2){fifties[0].textContent='51';fifties[1].textContent='49';}
    else {
      const left=fifties.filter(x=>x!==dem&&x!==rep);
      if(!dem&&left[0])left[0].textContent='51';
      if(!rep&&left[1])left[1].textContent='49';
    }
    for(const el of leaves(card)){
      const t=text(el);
      if(/^Democrats?\s*:?\s*50$/i.test(t))el.textContent=t.replace(/50$/,'51');
      if(/^Republicans?\s*:?\s*50$/i.test(t))el.textContent=t.replace(/50$/,'49');
    }
  }
  fix();
  [50,150,350,700,1200,2200,4000].forEach(ms=>setTimeout(fix,ms));
  setInterval(fix,900);
  new MutationObserver(fix).observe(document.body,{childList:true,subtree:true,characterData:true});
})();
</script>
'''
              html = html.replace('</body>', script + '</body>', 1)

          out = base64.b64encode(gzip.compress(html.encode('utf-8'), mtime=0)).decode('ascii')
          size = (len(out) + len(parts) - 1) // len(parts)
          for i,p in enumerate(parts):
              Path(p).write_text(out[i*size:(i+1)*size])
          PY
      - name: Commit page payload
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add d0.txt d1.txt d2.txt d3.txt d4.txt d5.txt d6.txt d7.txt d8a.txt d8b.txt d9.txt
          git commit -m 'Embed homepage Senate 51-49 fix in page payload' || exit 0
          git push
