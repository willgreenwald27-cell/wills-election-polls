name: Apply Texas tilt blue and 51-49 Senate update

on:
  push:
    paths:
      - '.github/workflows/apply-texas-tilt-blue-51-49.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Senate source and cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('senate-current-sync.js')
          s = p.read_text()

          old = "set(tx,'rating','tilt-r');set(tx,'predictionParty','Republican');set(tx,'prediction','Tilt Republican');set(tx,'notes','');set(tx,'updated','2026-09-14');\n        for(const k of ['projectedWinner','predictionWinner','winner','callParty']) if(k in tx) set(tx,k,'Republican');\n        if('call' in tx) set(tx,'call','Tilt Republican');"
          new = "set(tx,'rating','tilt-d');set(tx,'predictionParty','Democratic');set(tx,'prediction','Tilt Democratic');set(tx,'notes','');set(tx,'updated','2026-09-15');\n        for(const k of ['projectedWinner','predictionWinner','winner','callParty']) if(k in tx) set(tx,k,'Democratic');\n        if('call' in tx) set(tx,'call','Tilt Democratic');"
          assert old in s, 'Texas source block not found'
          s = s.replace(old, new, 1)

          marker = "\n  function forceSenateSummary(){"
          assert marker in s, 'forceSenateSummary marker not found'
          force_tx = r'''

  function forceTexas(){
    const root=document.getElementById('page-senate'); if(!root)return;
    root.querySelectorAll('[data-state="TX"],[data-state="TX"] path,[data-abbr="TX"],[data-abbr="TX"] path,[data-state-abbr="TX"],[data-state-abbr="TX"] path,#TX,#TX path,#state-TX,#state-TX path').forEach(el=>{
      el.style.setProperty('fill',TILT_BLUE,'important');
      if(el.namespaceURI!=='http://www.w3.org/2000/svg'&&!/^(path|polygon|rect)$/i.test(el.tagName||'')) el.style.setProperty('background',TILT_BLUE,'important');
    });
    const labels=leafs(root).filter(el=>norm(el.textContent)==='Texas'&&el.getClientRects().length);
    for(const label of labels){
      let box=label.parentElement;
      for(let i=0;box&&box!==root&&i<14;i++,box=box.parentElement){
        const t=norm(box.textContent);
        if(/WILL[’']S CALL/i.test(t)&&(/AVG POLLS/i.test(t)||/MY PREDICTION/i.test(t))) break;
      }
      if(!box||box===root)continue;
      let ls=leafs(box);
      for(const el of ls){
        const t=norm(el.textContent);
        if(/^Prediction:\s*/i.test(t))el.textContent='Prediction: Tilt Democratic';
        if(/^(Republican|Democrat(?:ic)?|Tossup|TILT REPUBLICAN|LEAN REPUBLICAN|LIKELY REPUBLICAN|SOLID REPUBLICAN|TILT DEMOCRAT(?:IC)?)$/i.test(t)){
          const nearCall=norm(el.parentElement?.textContent||'');
          if(/WILL[’']S CALL|MY PREDICTION/i.test(nearCall))el.textContent=/TILT/i.test(t)?'TILT DEMOCRATIC':'Democratic';
        }
      }
      const callLeaf=ls.find(el=>/^WILL[’']S CALL$/i.test(norm(el.textContent)));
      if(callLeaf){
        let card=callLeaf.parentElement;
        for(let i=0;card&&card!==box&&i<4;i++,card=card.parentElement){
          const t=norm(card.textContent);
          if(/WILL[’']S CALL/i.test(t)&&t.length<180) break;
        }
        if(card&&card!==box){
          card.style.setProperty('background',TILT_BLUE,'important');
          card.style.setProperty('background-image','none','important');
          card.style.setProperty('border-color',TILT_BLUE_BORDER,'important');
          card.style.setProperty('color',BLUE_DARK,'important');
          card.querySelectorAll('*').forEach(el=>el.style.setProperty('color',BLUE_DARK,'important'));
          const vals=leafs(card);
          const party=vals.find(el=>/^(Republican|Democrat(?:ic)?|Tossup)$/i.test(norm(el.textContent)));
          if(party)party.textContent='Democratic';
          const rating=vals.find(el=>/(TILT|LEAN|LIKELY|SOLID)\s+(REPUBLICAN|DEMOCRAT(?:IC)?)/i.test(norm(el.textContent)));
          if(rating)rating.textContent='TILT DEMOCRATIC';
          const copy=card.querySelector('.prediction-copy');if(copy)copy.textContent='Tilt Democratic';
        }
      }
      for(const heading of leafs(box).filter(el=>/^WHY MY FORECAST DIFFERS$/i.test(norm(el.textContent)))){
        let n=heading.parentElement;
        for(let i=0;n&&n!==box&&i<5;i++,n=n.parentElement){
          const t=norm(n.textContent);
          if(/^WHY MY FORECAST DIFFERS/i.test(t)&&!/WILL[’']S CALL/i.test(t)){n.remove();break;}
        }
      }
    }
  }
'''
          s = s.replace(marker, force_tx + marker, 1)

          s = s.replace("if(n)n.textContent=/^REPUBLICAN$/i.test(t)?'50':'50';", "if(n)n.textContent=/^REPUBLICAN$/i.test(t)?'49':'51';", 1)
          s = s.replace("if(d)d.style.setProperty('width','50%','important');\n      if(r)r.style.setProperty('width','50%','important');", "if(d)d.style.setProperty('width','51%','important');\n      if(r)r.style.setProperty('width','49%','important');", 1)
          s = s.replace("if(nums.length>=2){nums[0].textContent='50';nums[1].textContent='50';}", "if(nums.length>=2){nums[0].textContent='51';nums[1].textContent='49';}", 1)
          s = s.replace("if(/^Democrats?:\\s*\\d+$/i.test(t))el.textContent=t.replace(/\\d+$/,'50');", "if(/^Democrats?:\\s*\\d+$/i.test(t))el.textContent=t.replace(/\\d+$/,'51');", 1)
          s = s.replace("if(/^Republicans?:\\s*\\d+$/i.test(t))el.textContent=t.replace(/\\d+$/,'50');", "if(/^Republicans?:\\s*\\d+$/i.test(t))el.textContent=t.replace(/\\d+$/,'49');", 1)
          s = s.replace("if(d)d.style.setProperty('width','50%','important');\n      if(r)r.style.setProperty('width','50%','important');", "if(d)d.style.setProperty('width','51%','important');\n      if(r)r.style.setProperty('width','49%','important');", 1)
          s = s.replace("bar.setAttribute('aria-label','Senate prediction: 50 Democrats and 50 Republicans');", "bar.setAttribute('aria-label','Senate prediction: 51 Democrats and 49 Republicans');", 1)
          s = s.replace("forceMaine();forceOhio();forceSenateSummary();forceHome();", "forceMaine();forceOhio();forceTexas();forceSenateSummary();forceHome();", 1)
          p.write_text(s)

          idx = Path('index.html')
          h = idx.read_text()
          h2, n = re.subn(r"senate-current-sync\.js\?v=[0-9A-Za-z._-]+", "senate-current-sync.js?v=20260915-1724", h)
          if n == 0:
              h2, n = re.subn(r"senate-current-sync\.js", "senate-current-sync.js?v=20260915-1724", h, count=1)
          assert n > 0, 'senate-current-sync cache reference not found in index.html'
          idx.write_text(h2)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add senate-current-sync.js index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Set Texas tilt Democratic and Senate 51-49'
          git push
