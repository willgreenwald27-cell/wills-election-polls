name: Add Minnesota Sep 7 poll
on:
  push:
    paths:
      - '.github/workflows/add-minnesota-sep7-poll.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Minnesota update
        run: python .github/scripts/update_mn_sep7.py
      - name: Commit site update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/add-minnesota-sep7-poll.yml .github/scripts/update_mn_sep7.py
          git add senate-julsep-archive.js accepted-good.js index.html .github/workflows/add-minnesota-sep7-poll.yml .github/scripts/update_mn_sep7.py
          git commit -m "Add Sep 7 Minnesota poll and update average"
          git push
