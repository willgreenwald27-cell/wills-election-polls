name: Audit Senate popup averages
on:
  push:
    paths:
      - '.github/workflows/audit-site-poll-averages.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Calculate averages from polls displayed on site
        run: |
          python - <<'PY'
          import ast,csv,json,re
          from pathlib import Path

          src=Path('senate-julsep-archive.js').read_text()
          m=re.search(r'const POLLS=(\[.*?\]);\s*const RED=',src,re.S)
          if not m: raise SystemExit('POLLS array not found')
          polls=ast.literal_eval(m.group(1))
          rows=[]
          for x in polls:
              rows.append({'date':x[0],'state':x[1],'pollster':x[3],'c1':x[4],'c1Pct':float(x[5]),'c2':x[6],'c2Pct':float(x[7]),'source':'archive'})

          objpat=re.compile(r"(?:add\(|polls\.push\()\{date:'([^']+)',state:'([^']+)',pollster:'([^']+)',sample:'[^']*',c1:'([^']+)',c1Pct:'([^']+)',c2:'([^']+)',c2Pct:'([^']+)'",re.S)
          for fn in ['sep9-polls-update.js','sep10-polls-update.js','sept9-final-ui.js']:
              txt=Path(fn).read_text()
              for date,state,pollster,c1,p1,c2,p2 in objpat.findall(txt):
                  rows.append({'date':date,'state':state,'pollster':pollster,'c1':c1,'c1Pct':float(p1),'c2':c2,'c2Pct':float(p2),'source':fn})

          def norm_pollster(s):
              s=s.replace('*','').lower()
              return re.sub(r'[^a-z0-9]+','',s)
          def last(name):
              return re.sub(r'[^a-z0-9-]+','',name.lower().split()[-1])
          dedup=[]; seen=set()
          for r in rows:
              vals=tuple(sorted([(last(r['c1']),round(r['c1Pct'],3)),(last(r['c2']),round(r['c2Pct'],3))]))
              key=(r['state'],r['date'],norm_pollster(r['pollster']),vals)
              if key in seen: continue
              seen.add(key); dedup.append(r)

          states={}
          with open('senate-state-summary.csv',newline='') as f:
              for r in csv.DictReader(f): states[r['abbr']]=r
          out={'unique_site_polls':len(dedup),'averages':{}}
          for ab,s in states.items():
              a,b=last(s['candidate1']),last(s['candidate2'])
              hits=[]
              for r in dedup:
                  if r['state']!=ab: continue
                  names={last(r['c1']),last(r['c2'])}
                  if {a,b}!=names: continue
                  vals={last(r['c1']):r['c1Pct'],last(r['c2']):r['c2Pct']}
                  hits.append((r,vals[a],vals[b]))
              if not hits: continue
              av1=sum(x[1] for x in hits)/len(hits); av2=sum(x[2] for x in hits)/len(hits)
              out['averages'][ab]={
                  'state':s['name'],'candidate1':s['candidate1'],'candidate2':s['candidate2'],
                  'poll_count':len(hits),'candidate1_avg':round(av1,1),'candidate2_avg':round(av2,1),
                  'current_candidate1':s['candidate1Poll'],'current_candidate2':s['candidate2Poll'],
                  'polls':[{'date':x[0]['date'],'pollster':x[0]['pollster'],'c1':x[0]['c1'],'c1Pct':x[0]['c1Pct'],'c2':x[0]['c2'],'c2Pct':x[0]['c2Pct']} for x in hits]
              }
          Path('poll-average-audit.json').write_text(json.dumps(out,indent=2,ensure_ascii=False)+'\n')
          Path('poll-average-summary.csv').write_text('abbr,state,candidate1,candidate1_avg,candidate2,candidate2_avg,poll_count\n'+''.join(
              f"{ab},{v['state']},{v['candidate1']},{v['candidate1_avg']},{v['candidate2']},{v['candidate2_avg']},{v['poll_count']}\n" for ab,v in out['averages'].items()
          ))
          PY
      - name: Commit audit
        run: |
          git config user.name 'Will Election Polls Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add poll-average-audit.json poll-average-summary.csv
          git commit -m 'Generate Senate polling average audit'
          git push origin main
