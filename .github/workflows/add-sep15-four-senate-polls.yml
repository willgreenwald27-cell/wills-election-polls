name: Add Sep 15 Senate Polls

on:
  push:
    paths:
      - '.github/workflows/add-sep15-four-senate-polls.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add polls and refresh averages
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('senate-auto-averages.js')
          s = p.read_text()
          marker = "  const NEW_POLLS=[\n"
          rows = (
              "    ['2026-09-15','ME','Maine','Quantus Insights','Troy Jackson',46,'Susan Collins',47,'Collins +1'],\n"
              "    ['2026-09-15','MN','Minnesota','KSTP/SurveyUSA*','Peggy Flanagan',42,'Michele Tafoya',42,'Tie'],\n"
              "    ['2026-09-15','OH','Ohio','Bowling Green/YouGov*','Sherrod Brown',48,'Jon Husted',45,'Brown +3'],\n"
              "    ['2026-09-15','IA','Iowa','co/efficient','Ashley Hinson',48,'Josh Turek',43,'Hinson +5'],\n"
          )
          if "['2026-09-15','ME','Maine','Quantus Insights'" not in s:
              s = s.replace(marker, marker + rows, 1)
          p.write_text(s)

          p = Path('senate-current-sync.js')
          s = p.read_text()
          replacements = {
              "IA:{'turek':'44.7','hinson':'45.0'}": "IA:{'turek':'44.4','hinson':'44.4'}",
              "ME:{'jackson':'47.7','collins':'44.2'}": "ME:{'jackson':'47.5','collins':'44.5'}",
              "MN:{'flanagan':'45.0','tafoya':'41.5'}": "MN:{'flanagan':'44.6','tafoya':'42.2'}",
              "OH:{'brown':'47.8','husted':'41.4'}": "OH:{'brown':'47.7','husted':'42.0'}",
              "set(me,'updated','2026-09-10')": "set(me,'updated','2026-09-15')",
              "set(oh,'updated','2026-09-14')": "set(oh,'updated','2026-09-15')",
          }
          for old,new in replacements.items():
              s = s.replace(old,new)
          p.write_text(s)

          p = Path('index.html')
          s = p.read_text()
          s = re.sub(r"senate-auto-averages\.js\?v=[A-Za-z0-9._-]+", "senate-auto-averages.js?v=20260916-1948", s)
          s = re.sub(r"senate-current-sync\.js\?v=[A-Za-z0-9._-]+", "senate-current-sync.js?v=20260916-1948", s)
          p.write_text(s)
          PY
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/add-sep15-four-senate-polls.yml
          git add senate-auto-averages.js senate-current-sync.js index.html
          git commit -m 'Add Sep 15 Senate polls and refresh averages' || exit 0
          git push
