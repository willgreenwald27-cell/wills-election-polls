name: Add Minnesota Sep 14 Senate poll

on:
  push:
    paths:
      - '.github/workflows/add-mn-sep14-poll.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add Minnesota poll and bump cache
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('senate-auto-averages.js')
          s = p.read_text()
          row = "    ['2026-09-14','MN','Minnesota','co/efficient*','Peggy Flanagan',43,'Michele Tafoya',42,'Flanagan +1'],\n"
          anchor = "  const NEW_POLLS=[\n"
          if row not in s:
              s = s.replace(anchor, anchor + row, 1)
          p.write_text(s)

          idx = Path('index.html')
          h = idx.read_text()
          h2 = re.sub(r"senate-auto-averages\.js\?v=[A-Za-z0-9._-]+", "senate-auto-averages.js?v=20260915-1722", h)
          if h2 == h:
              h2 = h.replace('senate-auto-averages.js', 'senate-auto-averages.js?v=20260915-1722', 1)
          idx.write_text(h2)
          PY
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/add-mn-sep14-poll.yml
          git add senate-auto-averages.js index.html
          git commit -m 'Add Sep 14 Minnesota Senate poll' || exit 0
          git push
