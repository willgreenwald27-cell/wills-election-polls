name: Set Texas and Ohio blue, homepage 51-49
on:
  push:
    paths:
      - '.github/workflows/set-texas-ohio-blue-home-51-49.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Senate prediction changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('site-final.js')
          s = p.read_text()

          nh = "      if(stateData.NH&&stateData.NH.active) stateData.NH.rating='tilt-d';\n"
          override = (
              "      if(stateData.NH&&stateData.NH.active) stateData.NH.rating='tilt-d';\n"
              "      for(const abbr of ['TX','OH']){\n"
              "        const race=stateData[abbr];\n"
              "        if(!race||!race.active) continue;\n"
              "        race.rating='tilt-d';\n"
              "        race.predictionParty='Democratic';\n"
              "        race.prediction='Tilt Democratic';\n"
              "        race.notes='';\n"
              "        race.updated='2026-09-13';\n"
              "        if('callParty' in race) race.callParty='Democratic';\n"
              "        if('call' in race) race.call='Tilt Democratic';\n"
              "      }\n"
          )
          if override not in s:
              if nh not in s:
                  raise SystemExit('NH anchor not found')
              s = s.replace(nh, override, 1)

          s = s.replace("const value=/^REPUBLICAN$/i.test(t)?'51':'49';", "const value=/^REPUBLICAN$/i.test(t)?'49':'51';", 1)
          s = s.replace("if(nums[0]) nums[0].textContent='49';", "if(nums[0]) nums[0].textContent='51';", 1)
          s = s.replace("if(nums[1]) nums[1].textContent='51';", "if(nums[1]) nums[1].textContent='49';", 1)
          s = s.replace("if(/^Democrats?:\\s*50$/i.test(t)) el.textContent=t.replace(/50$/,'49');", "if(/^Democrats?:\\s*(?:49|50|51)$/i.test(t)) el.textContent=t.replace(/\\d+$/,'51');", 1)
          s = s.replace("if(/^Republicans?:\\s*50$/i.test(t)) el.textContent=t.replace(/50$/,'51');", "if(/^Republicans?:\\s*(?:49|50|51)$/i.test(t)) el.textContent=t.replace(/\\d+$/,'49');", 1)
          s = s.replace("if(/Democrat/i.test(parent)) el.textContent='49 seats';", "if(/Democrat/i.test(parent)) el.textContent='51 seats';", 1)
          s = s.replace("if(/Republican/i.test(parent)) el.textContent='51 seats';", "if(/Republican/i.test(parent)) el.textContent='49 seats';", 1)
          s = s.replace("if(kids[0]) kids[0].style.setProperty('width','49%','important');", "if(kids[0]) kids[0].style.setProperty('width','51%','important');", 1)
          s = s.replace("if(kids[1]) kids[1].style.setProperty('width','51%','important');", "if(kids[1]) kids[1].style.setProperty('width','49%','important');", 1)

          home_anchor = "      const bar=senateCard.querySelector('.senate-bar');\n      if(bar){\n"
          home_explanation = (
              "      for(const el of [...senateCard.querySelectorAll('p,small,.muted,.note,.forecast-note,.senate-note,.senate-explanation,.forecast-explanation')]){\n"
              "        const t=norm(el.textContent);\n"
              "        if(t.length>18&&(/(?:prediction|forecast).{0,100}(?:poll|average)/i.test(t)||/(?:poll|average).{0,100}(?:prediction|forecast)/i.test(t))){\n"
              "          el.remove();\n"
              "        }\n"
              "      }\n"
              "      const bar=senateCard.querySelector('.senate-bar');\n"
              "      if(bar){\n"
          )
          if home_explanation not in s:
              if home_anchor not in s:
                  raise SystemExit('home Senate bar anchor not found')
              s = s.replace(home_anchor, home_explanation, 1)

          p.write_text(s)

          idx = Path('index.html')
          h = idx.read_text()
          h = h.replace("OH:'Tossup'", "OH:'Tilt Democratic'", 1)
          h = h.replace("TX:'Paxton +0.3%'", "TX:'Tilt Democratic'", 1)
          h2, n = re.subn(r'site-final\.js\?v=[0-9A-Za-z._-]+', 'site-final.js?v=20260913-2202', h, count=1)
          if n != 1:
              raise SystemExit('site-final loader not found exactly once')
          idx.write_text(h2)
          PY
      - name: Commit production update
        shell: bash
        run: |
          git config user.name 'Will Election Polls Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add site-final.js index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Set Texas and Ohio tilt blue and Senate 51-49 Democratic'
          git push
