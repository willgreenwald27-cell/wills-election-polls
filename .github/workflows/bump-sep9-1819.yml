name: Refresh Texas poll and homepage forecast script
on:
  push:
    paths:
      - '.github/workflows/bump-sep9-1819.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump updater cache key only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          s,n=re.subn(r'sep9-polls-update\.js\?v=[0-9-]+','sep9-polls-update.js?v=20260909-1819',s)
          if n!=1:
              raise SystemExit(f'expected exactly one sep9 script reference; found {n}')
          p.write_text(s)
          assert "const files=['d0.txt','d1.txt','d2.txt','d3.txt','d4.txt','d5.txt','d6.txt','d7.txt','d8a.txt','d8b.txt','d9.txt']" in s
          assert 'document.open();document.write(h);document.close()' in s
          PY
      - name: Commit cache refresh
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/bump-sep9-1819.yml
          git add index.html .github/workflows/bump-sep9-1819.yml
          git commit -m "Refresh homepage forecast and Texas poll"
          git push
