name: Update Will statistical odds Ohio Iowa v2
on:
  push:
    paths:
      - '.github/workflows/update-wills-odds-ohio-iowa-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update odds and cache
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('sep9-polls-update.js')
          s=p.read_text()
          a="if(name.includes('husted')&&String(oh[key])!=='55'){oh[key]='55';changed=true;}"
          b="if(name.includes('husted')&&String(oh[key])!=='50'){oh[key]='50';changed=true;}"
          c="if(name.includes('brown')&&String(oh[key])!=='45'){oh[key]='45';changed=true;}"
          d="if(name.includes('brown')&&String(oh[key])!=='50'){oh[key]='50';changed=true;}"
          if a not in s or c not in s: raise SystemExit('Ohio odds anchors not found')
          s=s.replace(a,b,1).replace(c,d,1)
          anchor="      if(typeof stateData!=='undefined'&&stateData?.MI){"
          ia="      if(typeof stateData!=='undefined'&&stateData?.IA){\n        const ia=stateData.IA;\n        for(const slot of [1,2]){\n          const name=norm(ia['candidate'+slot]).toLowerCase();\n          const key='candidate'+slot+'Odds';\n          if(name.includes('hinson')&&String(ia[key])!=='59'){ia[key]='59';changed=true;}\n          if(name.includes('turek')&&String(ia[key])!=='41'){ia[key]='41';changed=true;}\n        }\n        if(ia.updated!=='2026-09-11'){ia.updated='2026-09-11';changed=true;}\n      }\n"
          if "name.includes('hinson')&&String(ia[key])!=='59'" not in s:
              if anchor not in s: raise SystemExit('Michigan anchor not found')
              s=s.replace(anchor,ia+anchor,1)
          p.write_text(s)
          i=Path('index.html')
          h=i.read_text()
          h,n=re.subn(r'sep9-polls-update\.js\?v=[0-9-]+','sep9-polls-update.js?v=20260911-1338',h,count=1)
          if n!=1: raise SystemExit('sep9 cache reference not found')
          i.write_text(h)
          PY
          node --check sep9-polls-update.js
          grep -q "name.includes('husted').*50" sep9-polls-update.js
          grep -q "name.includes('brown').*50" sep9-polls-update.js
          grep -q "name.includes('hinson').*59" sep9-polls-update.js
          grep -q "name.includes('turek').*41" sep9-polls-update.js
          git config user.name 'Will Election Polls Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add sep9-polls-update.js index.html
          git commit -m 'Set Will odds Ohio 50-50 and Iowa 59-41 Republican'
          git push origin main
