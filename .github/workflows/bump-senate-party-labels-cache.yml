name: Refresh Senate party labels
on:
  push:
    paths:
      - '.github/workflows/bump-senate-party-labels-cache.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump cache key
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='senate-party-labels.js?v=20260911-001'
          new='senate-party-labels.js?v=20260911-002'
          if old not in s:
              raise SystemExit('cache key anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit cache refresh
        shell: bash
        run: |
          git config user.name 'Will Election Polls Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Refresh Senate party label script' || exit 0
          git push
