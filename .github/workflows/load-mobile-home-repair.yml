name: Load mobile colors and home navigation repair
on:
  push:
    paths:
      - '.github/workflows/load-mobile-home-repair.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load repair script safely
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="/mobile-home-repair.js?v=20260908-0001"><\\/script>'
          if 'mobile-home-repair.js' not in s:
              pat=r'(<script src="/accepted-good\.js\?v=[^"]+"><\\/script>)'
              ns,n=re.subn(pat,lambda m:m.group(1)+tag,s,count=1)
              if n != 1:
                  raise SystemExit(f'accepted-good loader tag not found exactly once: {n}')
              s=ns
          p.write_text(s)
      - name: Validate loader and repair script
        shell: bash
        run: |
          node --check mobile-home-repair.js
          python - <<'PY'
          from pathlib import Path
          import subprocess
          s=Path('index.html').read_text()
          assert 'mobile-home-repair.js?v=20260908-0001' in s
          assert "const files=['d0.txt','d1.txt','d2.txt','d3.txt','d4.txt','d5.txt','d6.txt','d7.txt','d8a.txt','d8b.txt','d9.txt']" in s
          start=s.index('<script>')+len('<script>')
          end=s.index('</script>',start)
          Path('/tmp/loader.js').write_text(s[start:end])
          subprocess.run(['node','--check','/tmp/loader.js'],check=True)
          PY
          git diff --quiet -- d0.txt d1.txt d2.txt d3.txt d4.txt d5.txt d6.txt d7.txt d8a.txt d8b.txt d9.txt
      - name: Commit loader update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m "Load mobile colors and home navigation repair"
          git push
