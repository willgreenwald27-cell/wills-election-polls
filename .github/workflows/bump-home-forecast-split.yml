name: Refresh homepage forecast split
on:
  push:
    paths:
      - '.github/workflows/bump-home-forecast-split.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh homepage forecast script
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          ns,n=re.subn(r'sep9-polls-update\.js\?v=[0-9-]+','sep9-polls-update.js?v=20260909-1430',s)
          if n != 1:
              raise SystemExit(f'expected one sep9 loader reference, found {n}')
          p.write_text(ns)
      - name: Validate loader
        shell: python
        run: |
          from pathlib import Path
          s=Path('index.html').read_text()
          assert 'sep9-polls-update.js?v=20260909-1430' in s
          assert "const files=['d0.txt','d1.txt','d2.txt','d3.txt','d4.txt','d5.txt','d6.txt','d7.txt','d8a.txt','d8b.txt','d9.txt']" in s
          assert 'document.open();document.write(h);document.close()' in s
      - name: Commit cache refresh
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/bump-home-forecast-split.yml
          git add index.html .github/workflows/bump-home-forecast-split.yml
          git commit -m "Show split House and Senate forecasts on homepage"
          git push
