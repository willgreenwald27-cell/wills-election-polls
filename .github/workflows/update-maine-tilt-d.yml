name: Update Maine Tilt Democratic
on:
  push:
    paths:
      - '.github/workflows/update-maine-tilt-d.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Maine forecast update
        run: python3 patch_maine_tilt_d.py
      - name: Commit site update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/update-maine-tilt-d.yml patch_maine_tilt_d.py
          git add site-final.js accepted-good.js safe-patches.js senate-julsep-archive.js index.html .github/workflows/update-maine-tilt-d.yml patch_maine_tilt_d.py
          git commit -m "Restore Maine Tilt Democratic forecast"
          git push
